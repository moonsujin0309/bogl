<meta charset="utf-8">
<title>보글 · BOGL°</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2926">
<link rel="manifest" href="manifest.webmanifest">
<script id="bogl-data" type="application/json">__DATA__</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  :root{
    --d-bg:oklch(.215 .006 60); --d-card:oklch(.268 .006 60); --d-card2:oklch(.312 .006 60);
    --d-line:oklch(.352 .006 60); --d-tx2:oklch(.782 .008 70); --d-tx3:oklch(.622 .008 70);
    --cream:oklch(.965 .008 85);
    --l-bg:oklch(.968 .004 80); --l-card:#fff; --l-line:oklch(.925 .005 80);
    --l-thumb:oklch(.953 .005 80); --ink:oklch(.215 .008 60);
    --l-tx2:oklch(.485 .01 60); --l-tx3:oklch(.67 .01 60);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* 아이폰 기준: 100vh는 주소창 때문에 튀므로 dvh를 쓰고, 노치·홈바는 safe-area로 피한다. */
  :root{ --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px) }
  html,body{overscroll-behavior-y:none}
  /* 바탕은 현재 화면 색을 따라간다. 밝은 회색으로 두면 좌우 끝과
     스크롤 바운스에서 흰 띠가 비친다. */
  html{background:var(--d-bg)}
  body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
       -webkit-font-smoothing:antialiased;background:var(--d-bg);
       text-size-adjust:100%;-webkit-text-size-adjust:100%}
  body.light{background:var(--l-bg)}
  html:has(body.light){background:var(--l-bg)}
  a{color:inherit;text-decoration:none}
  .app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
  .view{display:none;min-height:100dvh;flex-direction:column}
  .view.on{display:flex}
  .mk{font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:-.045em;line-height:1}
  .deg{font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:0;line-height:1}
  button{font:inherit;border:0;background:none;padding:0;cursor:pointer;color:inherit;text-align:left}
  button[disabled]{opacity:.4;cursor:default}
  .grow{flex:1}

  /* ── 공통 (다크) ─────────────────────────────── */
  #home,#folder,#browse{background:var(--d-bg);color:var(--cream)}
  .top{display:flex;align-items:center;gap:10px;padding:calc(14px + var(--sa-t)) 26px 6px}
  /* 폴더·모든 요리 머리줄. 뒤로 · 제목 · 오른쪽 글자 버튼. 제목은 줄바꿈 없이 글자만 줄인다. */
  .fhead{display:flex;align-items:center;gap:2px;padding:calc(8px + var(--sa-t)) 16px 6px}
  .fhead .ttl{flex:1;min-width:0;height:44px;display:flex;align-items:center;padding:0 6px;
              font-size:clamp(18px,5.5vw,22px);font-weight:900;letter-spacing:-.045em;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ib{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--d-tx2);flex-shrink:0}
  .txt{height:44px;padding:0 10px;font-size:12.5px;font-weight:700;color:var(--d-tx2);display:flex;align-items:center;flex-shrink:0;white-space:nowrap}
  .hint{margin:0;padding:26px;font-size:13px;line-height:1.6;color:var(--d-tx3);text-align:center}
  .dishrow{display:flex;justify-content:space-between;padding:6px 22px 4px;gap:2px;width:100%}
  .dish{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0}
  .cir{width:54px;height:54px;border-radius:27px;background:var(--d-card);
       display:flex;align-items:center;justify-content:center;color:var(--d-tx3);flex-shrink:0}
  .cir.ph{overflow:hidden}
  .cir.ph img{display:block;width:100%;height:100%;object-fit:cover}
  /* 한 줄로 두면 `두부두루치기`·`된장채소수제비`가 잘린다. 이름이 안 읽히면 메뉴가 아니다.
     한국어 긴 낱말은 keep-all로 안 쪼개지므로 anywhere로 풀고 두 줄까지 준다. */
  .dish span:last-child{font-size:10.5px;color:var(--d-tx2);text-align:center;line-height:1.25;
             overflow-wrap:anywhere;width:100%;overflow:hidden;
             display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .rule{height:1px;background:var(--d-line);margin:0 26px}
  .ppl{display:flex;align-items:center;gap:9px;padding:10px 26px 8px;flex-wrap:wrap}
  .lbl{font-size:10px;letter-spacing:.16em;color:var(--d-tx3);white-space:nowrap}
  .chip{display:flex;align-items:center;gap:8px;height:36px;padding:0 5px 0 12px;border-radius:11px;
        background:var(--d-card2);font-size:12.5px;font-weight:700}
  .chip b{font-weight:500;color:var(--d-tx3);min-width:14px;text-align:center}
  .step,.servb{position:relative}
  .step::after,.servb::after{content:'';position:absolute;inset:-9px}
  .step{width:26px;height:26px;border-radius:8px;background:oklch(.40 .008 60);color:var(--cream);
        display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1}
  /* 하단 버튼은 화면에 붙여 둔다. 목록이 길어져도 밀려나지 않게. */
  .footD{position:sticky;bottom:0;padding:12px 26px calc(16px + var(--sa-b));
         background:linear-gradient(to top,var(--d-bg) 68%,transparent)}
  .footRow{display:flex;gap:9px}
  .cta{display:flex;align-items:center;justify-content:center;gap:9px;flex:1;min-width:0;
       width:100%;height:56px;border-radius:15px;
       background:var(--cream);color:var(--ink);font-size:16px;font-weight:900;letter-spacing:-.02em}
  /* 보조 버튼. 1순위(크림 CTA)는 화면당 하나라 여기는 카드색으로 가라앉힌다. */
  .alt{display:flex;align-items:center;justify-content:center;gap:7px;height:56px;padding:0 15px;
       border-radius:15px;background:var(--d-card);color:var(--d-tx2);
       font-size:13px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}

  /* ── 홈 · 폴더 카드 ────────────────────────────── */
  .fc{display:flex;align-items:center;gap:14px;width:calc(100% - 52px);margin:0 26px 10px;
      padding:16px 18px;border-radius:18px;background:var(--d-card);color:var(--cream)}
  .fc .ft{min-width:0;flex:1}
  .fc .fn{display:block;font-size:17px;font-weight:900;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fc .fm{display:block;font-size:11.5px;color:var(--d-tx3);margin-top:4px}
  .fc .fp{display:flex;flex-shrink:0;padding-left:8px}
  .fc .fp .cir{width:34px;height:34px;border-radius:17px;margin-left:-8px;border:2px solid var(--d-card);
               background:var(--d-card2);font-size:11px;font-weight:900;color:var(--d-tx2)}
  .fc .fp .cir svg{width:16px;height:16px}

  /* ── 폴더 · 배치 카드 ──────────────────────────── */
  .plan{padding:6px 26px 4px;display:flex;flex-direction:column;gap:8px}
  .day{border-radius:16px;background:var(--d-card);padding:13px 16px}
  .day .dh{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.14em;color:var(--d-tx3)}
  .day .dh .tp{margin-left:auto;display:flex;align-items:center;gap:5px;letter-spacing:0;font-weight:900;
               color:var(--ink);background:var(--cream);padding:4px 8px;border-radius:7px}
  .day .dn{margin-top:6px;font-size:14.5px;font-weight:700;letter-spacing:-.03em;line-height:1.45;color:var(--cream)}
  .day .dn.none{color:var(--d-tx3);font-weight:500}
  .day .dp{margin-top:7px;font-size:11.5px;line-height:1.55;color:var(--d-tx2)}

  /* ── 모든 요리 (다크) ─────────────────────────
     레시피 앱 문법 그대로 2열 썸네일 그리드 + 탐색 카드. */
  .sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:16px 26px 11px}
  .sec h2{margin:0;font-size:17px;font-weight:900;letter-spacing:-.045em;color:var(--cream)}
  .sec .side{font-size:11.5px;color:var(--d-tx3);white-space:nowrap}
  /* 탐색 카드 — 글자 왼쪽, 사진 오른쪽. 세 줄로 쌓고 가로로 흐른다. */
  .explore{display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:8px;
           padding:0 26px 4px;overflow-x:auto;scrollbar-width:none}
  .explore::-webkit-scrollbar{display:none}
  .ec{display:flex;align-items:center;justify-content:space-between;gap:6px;width:152px;height:54px;
      padding-left:14px;border-radius:13px;background:var(--d-card);overflow:hidden}
  .ec .el{font-size:12.5px;font-weight:800;letter-spacing:-.03em;color:var(--cream);
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ec .ep{width:58px;height:54px;flex:0 0 auto;background:var(--d-card2)}
  .ec .ep img{display:block;width:100%;height:100%;object-fit:cover}
  .ec.on{background:var(--cream)}
  .ec.on .el{color:var(--ink)}
  /* 정렬. 칩보다 한 단 낮은 글줄로 둔다 — 분류를 고르는 탐색 카드와 위계가 겹치면 안 된다. */
  .sortrow{display:flex;gap:14px;padding:0 26px 12px;overflow-x:auto;scrollbar-width:none}
  .sortrow::-webkit-scrollbar{display:none}
  .sortrow button{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--d-tx3);
                  padding:5px 0;white-space:nowrap;border-bottom:1.5px solid transparent}
  .sortrow button.on{color:var(--cream);border-bottom-color:var(--cream)}
  /* 사진이 주인공이다. 제목은 사진 아래 굵게 두 줄, 곁들이는 값은 태그로. */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 11px;
        padding:0 26px calc(28px + var(--sa-b))}
  .card{display:flex;flex-direction:column;gap:9px}
  .card .th{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--d-card);
            color:var(--d-tx3)}
  .card .th .bowl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .card .th .bowl svg{width:34px;height:34px}
  .card .mk2{position:absolute;top:8px;right:8px;width:25px;height:25px;border-radius:13px;
             background:var(--cream);color:var(--ink);display:flex;align-items:center;justify-content:center}
  .card .th img{display:block;width:100%;height:100%;object-fit:cover}
  /* 담기 모드 — 체크는 색이 아니라 반전으로. */
  .card .ck2{position:absolute;top:8px;left:8px;width:25px;height:25px;border-radius:13px;border:1.5px solid var(--cream);
             color:transparent;display:flex;align-items:center;justify-content:center;background:oklch(.2 .01 60/.35)}
  .card.on .ck2{background:var(--cream);color:var(--ink)}
  .card .in{position:absolute;bottom:8px;left:8px;font-size:10px;font-weight:900;padding:3px 7px;border-radius:6px;
            background:var(--cream);color:var(--ink)}
  .card .cn{font-size:14px;font-weight:700;letter-spacing:-.035em;line-height:1.35;color:var(--cream);
            overflow-wrap:anywhere;overflow:hidden;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:-2px}
  .card .tg2{font-size:10.5px;font-weight:600;color:var(--d-tx2);background:var(--d-card2);
             padding:4px 8px;border-radius:6px;white-space:nowrap}
  .card button.tg2{color:var(--cream);font-weight:800;min-height:24px}
  .empty{padding:40px 26px;text-align:center;font-size:13px;color:var(--d-tx3)}

  /* ── 레시피 (다크) ────────────────────────────
     모달로 두면 스크롤이 갇히고 길이가 안 나온다. 레시피는 페이지가 맞다.
     본문은 라이트 토큰으로 짜여 있으므로 이 블록에서 토큰만 갈아끼운다 —
     되돌리려면 아래 여덟 줄을 지우고 배경을 --l-bg로 되돌리면 끝이다. */
  #recipe{
    --l-bg:oklch(.215 .006 60); --l-card:oklch(.268 .006 60);
    --l-line:oklch(.352 .006 60); --l-thumb:oklch(.312 .006 60);
    --ink:oklch(.965 .008 85);      /* 반전 바탕이 크림이 된다 */
    --cream:oklch(.215 .006 60);    /* 반전 위의 글씨는 바탕색으로 */
    --l-tx2:oklch(.782 .008 70); --l-tx3:oklch(.622 .008 70);
    background:var(--l-bg);color:var(--ink)}
  .rtop{display:flex;align-items:center;justify-content:space-between;
        padding:calc(8px + var(--sa-t)) 16px 0}
  .rback,.rmark{width:44px;height:44px;border-radius:22px;color:var(--l-tx2);
         display:flex;align-items:center;justify-content:center}
  .rtr{display:flex;align-items:center;gap:2px}
  /* 남은 시간은 자리가 흔들리면 안 읽힌다. 숫자 폭을 고정한다. */
  .rtime{height:44px;min-width:44px;padding:0 11px;border-radius:22px;color:var(--l-tx2);
         display:flex;align-items:center;justify-content:center;gap:6px}
  .rtime b{font-size:13px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .rtime.on{background:var(--ink);color:var(--cream)}
  /* 타이머 설정 — 큰 숫자 하나와 ±, 그리고 자주 쓰는 시간 */
  .tdial{display:flex;align-items:center;justify-content:space-between;gap:14px;
         padding:6px 4px 14px}
  .tdial .tv{font-size:44px;font-weight:900;letter-spacing:-.05em;line-height:1;
             font-variant-numeric:tabular-nums;color:var(--ink)}
  .tdial button{width:46px;height:46px;border-radius:15px;background:var(--l-thumb);color:var(--ink);
                display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}
  .tpre{display:flex;gap:5px;padding-bottom:16px}
  .tpre button{flex:1;min-width:0;height:38px;padding:0 6px;border-radius:11px;
               background:var(--l-thumb);color:var(--l-tx2);font-size:12.5px;font-weight:800;
               display:flex;align-items:center;justify-content:center;white-space:nowrap}
  .tpre button.on{background:var(--ink);color:var(--cream)}
  .tgo{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border-radius:15px;
       background:var(--ink);color:var(--cream);font-size:15px;font-weight:900}
  .tgo.stop{background:var(--l-thumb);color:var(--l-tx2)}
  .ring{display:flex;flex-direction:column;align-items:center;gap:16px;padding:14px 0 22px;text-align:center}
  .ring .rc2{width:84px;height:84px;border-radius:42px;background:var(--ink);color:var(--cream);
             display:flex;align-items:center;justify-content:center}
  .ring h4{margin:0;font-size:19px;font-weight:900;letter-spacing:-.04em;color:var(--ink)}
  .ring p{margin:0;font-size:12.5px;color:var(--l-tx3)}
  .rmark.on{background:var(--ink);color:var(--cream)}
  .rhead{display:flex;align-items:center;gap:14px;padding:4px 26px 14px}
  .rth{width:62px;height:62px;border-radius:16px;overflow:hidden;background:var(--l-thumb);flex:0 0 auto;
       display:flex;align-items:center;justify-content:center;color:var(--l-tx3)}
  .rth img{display:block;width:100%;height:100%;object-fit:cover}
  .rht{min-width:0}
  .rtitle{margin:0;font-size:19px;font-weight:900;letter-spacing:-.045em;line-height:1.25;
          overflow-wrap:anywhere}
  .rtags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .rtags i{font-style:normal;font-size:11px;font-weight:700;color:var(--l-tx2);background:var(--l-card);
           border:1px solid var(--l-line);padding:5px 9px;border-radius:7px}
  /* 재료는 만드는 도중에도 언제든 돌아볼 수 있어야 한다. 그래서 화면에 붙여 둔다. */
  .rseg{position:sticky;top:0;z-index:3;display:flex;gap:6px;padding:9px 26px 10px;
        background:var(--l-bg);border-bottom:1px solid var(--l-line)}
  .rseg button{flex:1;height:42px;border-radius:12px;background:var(--l-card);
               border:1px solid var(--l-line);font-size:13px;font-weight:800;color:var(--l-tx2);
               display:flex;align-items:center;justify-content:center}
  .rseg button.on{background:var(--ink);border-color:var(--ink);color:var(--cream);font-weight:900}
  .rpane{flex:1;display:flex;flex-direction:column;padding:16px 26px calc(30px + var(--sa-b))}
  .rpane.stepping{padding-bottom:0}
  .serv{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
  .serv .sl{font-size:10px;letter-spacing:.15em;color:var(--l-tx3)}
  .servc{display:flex;align-items:center;gap:9px;height:40px;padding:0 6px 0 14px;border-radius:12px;
         background:var(--l-card);border:1px solid var(--l-line);font-size:13.5px;font-weight:800}
  .servb{width:30px;height:30px;border-radius:9px;background:var(--l-thumb);color:var(--ink);
         display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1}
  .ing{background:var(--l-card);border-radius:16px;padding:4px 16px}
  .igr{font-size:10px;letter-spacing:.14em;color:var(--l-tx3);padding:13px 0 1px}
  .ir{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 0;
      border-bottom:1px solid var(--l-line);font-size:13.5px}
  .ing .ir:last-child{border-bottom:0}
  .ir b{font-weight:700;color:var(--l-tx2);font-size:12.5px;white-space:nowrap}
  .ir b.raw{font-weight:500;color:var(--l-tx3)}
  /* 만드는 법은 한 번에 한 단계만. 스무 문단을 한꺼번에 두면 어디까지 했는지 놓친다. */
  .scard{background:var(--l-card);border-radius:18px;overflow:hidden}
  .scard .sb{padding:17px 20px 20px}
  .scard .snum{font-size:10.5px;font-weight:900;letter-spacing:.14em;color:var(--l-tx3)}
  .scard .stx{margin-top:8px;font-size:15px;line-height:1.7;color:var(--ink)}
  .stip{display:block;margin-top:12px;padding:11px 13px;border-radius:10px;background:var(--l-thumb);
        font-size:12px;line-height:1.65;color:var(--l-tx3)}
  .sfoot{position:sticky;bottom:0;padding:10px 0 calc(10px + var(--sa-b));
         background:linear-gradient(to top,var(--l-bg) 74%,transparent)}
  .dots{display:flex;gap:5px;justify-content:center;padding:0 0 10px}
  .dots i{width:6px;height:6px;border-radius:3px;background:var(--l-line);transition:width .18s}
  .dots i.on{background:var(--ink);width:17px}
  .snav{display:flex;gap:9px}
  .snav button{flex:1;height:52px;border-radius:14px;font-size:14px;font-weight:900;
               display:flex;align-items:center;justify-content:center;gap:7px}
  .snav .prev{background:var(--l-card);border:1px solid var(--l-line);color:var(--l-tx2)}
  .snav .next{background:var(--ink);color:var(--cream)}
  .snav button[disabled]{opacity:.34}
  .rsrc{margin-top:26px;padding-top:15px;border-top:1px solid var(--l-line);
        font-size:10.5px;line-height:1.75;color:var(--l-tx3)}
  .rsrc a{text-decoration:underline;text-underline-offset:2px}
  /* 영상 요리 — 만드는 법 대신 영상. 챕터를 누르면 그 자리로 간다. */
  .yt{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--l-thumb)}

/* ── 유튜브 ──────────────────────────────────────────────
   playlistItems.list(1 unit) · videos.list · playlists.list(제목 한 줄)만 부른다. search는 절대 안 부른다(100 units). */
const LIST_ERR = "재생목록을 못 읽었어요. 공개 상태가 '미등록'인지 확인해 주세요";
async function ytApi(path, params){
  const u = new URL('https://www.googleapis.com/youtube/v3/' + path);
  Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  u.searchParams.set('key', YTKEY);
  const r = await fetch(u);
  if(!r.ok) throw new Error('yt ' + r.status);
  return r.json();
}
/** 재생목록 → 폴더 요리. 이미 재료를 고친 항목은 덮어쓰지 않고, 링크로 따로 담은 것은 남긴다. */
async function pullList(f){
  // ponytail: 첫 50개만. 재생목록이 더 길면 pageToken을 돌려야 한다
  const r = await ytApi('playlistItems', { part: 'snippet', maxResults: 50, playlistId: f.list });
  const old = new Map(f.dishes.filter(e => e.vid).map(e => [e.vid, e]));
  const fresh = r.items.map(it => {
    const s = it.snippet, vid = s.resourceId && s.resourceId.videoId;
    if(!vid || /^(Private|Deleted) video$/.test(s.title)) return null;
    const p = parseDesc(s.description), o = old.get(vid);
    return Object.assign({ name: s.title, src: 'yt', vid, url: 'https://youtu.be/' + vid, servings: 2,
                           ing: p.ing, chapters: p.chapters, at: Date.now() },
                         o && o.edited ? { name: o.name, ing: o.ing, edited: 1 } : {});
  }).filter(Boolean);
  const got = new Set(fresh.map(e => e.vid));
  f.dishes = f.dishes.filter(e => typeof e === 'string' || (e.link && !got.has(e.vid))).concat(fresh);
  f.at = Date.now(); saveF();
}
/** 유튜브 데이터는 30일 넘게 못 갖는다. 25일 지난 것은 폴더를 열 때 다시 받는다. */
async function syncFolder(f){
  if(!YTKEY) return false;
  const old = Date.now() - 25 * DAY;
  let changed = false;
  if(f.list && f.at < old){ await pullList(f); changed = true; }
  const stale = f.dishes.filter(e => e.vid && e.link && e.at < old);
  if(stale.length){
    const r = await ytApi('videos', { part: 'snippet', id: stale.map(e => e.vid).join(',') });
    r.items.forEach(v => { const e = stale.find(x => x.vid === v.id); if(!e) return;
      const p = parseDesc(v.snippet.description); e.chapters = p.chapters; e.at = Date.now();
      if(!e.edited){ e.name = v.snippet.title; e.ing = p.ing; } });
    changed = true; saveF();
  }
  return changed;
}
async function makeListFolder(url, then){
  const list = ytList(url); if(!list) return toast('재생목록 주소가 아니에요');
  $('nflgo').disabled = true;
  let name = '재생목록';
  try{ const r = await ytApi('playlists', { part: 'snippet', id: list }); if(r.items[0]) name = r.items[0].snippet.title; }catch(e){}
  const f = createFolder(name, 5, list);
  try{ await pullList(f); }catch(e){ toast(LIST_ERR); }
  closeSheet(); then(f);
}

/* ── ③ 모든 요리 ─────────────────────────────────────────
   탐색 카드는 분류만이 아니라 난이도·시간도 섞는다. 고르는 이유가 그것뿐이 아니다. */
const BUCKETS = [['국 · 찌개', ['국', '찌개/전골/스튜', '탕']], ['밥 · 면', ['밥', '만두/면류', '도시락/간식']],
                 ['볶음 · 조림', ['볶음', '조림']], ['찜 · 구이', ['찜', '구이']], ['전 · 반찬', ['부침', '나물/생채/샐러드', '밑반찬/김치']]];
D.catalog.forEach(c => c.bucket = (BUCKETS.find(b => b[1].includes(c.kind)) || ['그 밖에'])[0]);
const catMatch = (c, cat) =>
  cat.f === 'all' || (cat.f === 'mark' && marks.has(c.name)) || (cat.f === 'bucket' && c.bucket === cat.v)
  || (cat.f === 'level' && c.level === cat.v) || (cat.f === 'maxmin' && c.min <= cat.v);
/** 저장한 것이 있을 때만 맨 앞에 세운다. 대표 사진은 사진 있는 요리 중 첫 번째. */
function catList(){
  const cats = (marks.size ? [{ label: '저장한 요리', f: 'mark' }] : []).concat([{ label: '전체', f: 'all' }],
    BUCKETS.map(b => b[0]).concat('그 밖에').filter(b => D.catalog.some(c => c.bucket === b)).map(b => ({ label: b, f: 'bucket', v: b })),
    [{ label: '초보환영', f: 'level', v: '초보환영' }, { label: '30분 안에', f: 'maxmin', v: 30 }]);
  cats.forEach(c => { const hit = D.catalog.filter(x => catMatch(x, c)); c.n = hit.length; c.pic = (hit.find(x => PHOTO[x.name]) || {}).name; });
  return cats;
}
/** 정렬. 재료·단계·시간은 `적을수록 쉬운 것`이라 전부 오름차순이다. */
const SORTS = {
  '가나다':      c => c.name,
  '재료 적은 순': c => [(c.ing || []).length, c.name],
  '단계 적은 순': c => [(c.steps || []).length || 99, c.name],
  '시간 짧은 순': c => [c.min || 999, c.name],
};
function renderBrowse(){
  const f = browseFid && folders.find(x => x.id === browseFid);
  if(browseFid && !f) browseFid = null;
  const cats = catList();
  const cat = cats.find(c => c.label === catKey) || cats[0];   // 고르던 묶음이 사라졌으면 맨 앞으로
  catKey = cat.label;
  const items = D.catalog.filter(c => catMatch(c, cat));
  $('btitle').textContent = f ? f.name + '에 담기' : '모든 요리';
  $('explore').innerHTML = cats.map(c => `
    <button class="ec${c.label === catKey ? ' on' : ''}" data-b="${esc(c.label)}">
      <span class="el">${esc(c.label)}</span>

    </button>`).join('');
  $('gtitle').textContent = cat.f === 'all' ? '모든 요리' : cat.label;
  $('gcount').textContent = `${items.length}가지 · ${f ? '눌러서 고르기' : '눌러서 만드는 법 보기'}`;
  $('sortrow').innerHTML = Object.keys(SORTS).map(k => `<button class="${k === sortKey ? 'on' : ''}" data-s="${esc(k)}">${esc(k)}</button>`).join('');
  const skey = SORTS[sortKey] || SORTS['가나다'];
  items.sort((a, b) => { const x = skey(a), y = skey(b);
    return Array.isArray(x) ? (x[0] - y[0]) || String(x[1]).localeCompare(y[1], 'ko') : String(x).localeCompare(String(y), 'ko'); });
  $('grid').innerHTML = items.length ? items.map(c => { const inF = f && has(f, c.name), on = picked.has(c.name); return `
    <div class="card${on ? ' on' : ''}" data-n="${esc(c.name)}">
      <button class="th" data-a="${f ? 'pick' : 'open'}">${PHOTO[c.name] ? `<img src="${PHOTO[c.name]}" alt="">` : `<span class="bowl">${BOWL}</span>`}
        ${marks.has(c.name) ? `<i class="mk2">${MARKI}</i>` : ''}
        ${f && !inF ? `<i class="ck2">${CHECKI}</i>` : ''}${inF ? `<i class="in">담겨 있어요</i>` : ''}</button>
      <span class="cn">${esc(c.name)}</span>
      <span class="tags"><i class="tg2">${esc(c.time)}</i><i class="tg2">${esc(c.level)}</i>${f ? `<button class="tg2" data-a="open">레시피</button>` : ''}</span>
    </div>`; }).join('') : `<div class="empty" style="grid-column:span 2">여기엔 아직 요리가 없어요</div>`;
  $('bfoot').style.display = f ? '' : 'none';
  if(f){ $('bpick').textContent = picked.size ? `${picked.size}가지 담기` : '요리를 골라 주세요'; $('bpick').disabled = !picked.size; }
}
$('explore').onclick = e => { const b = e.target.closest('.ec'); if(!b) return; catKey = b.dataset.b; renderBrowse(); scrollTo(0, 0); };
$('sortrow').onclick = e => { const b = e.target.closest('button'); if(!b) return; sortKey = b.dataset.s; renderBrowse(); };
$('grid').onclick = e => {
  const b = e.target.closest('button[data-a]'); if(!b) return;
  const n = b.closest('.card').dataset.n;
  if(b.dataset.a === 'open') return openRecipe(CAT.get(n), 'browse');

  if(has(f, n)) return toast('이미 담겨 있어요');
  picked.has(n) ? picked.delete(n) : picked.add(n);
  renderBrowse();
};
$('bback').onclick = () => go(browseFid ? 'folder' : 'home');
$('bpick').onclick = () => {
  const f = folders.find(x => x.id === browseFid); if(!f) return;
  [...picked].forEach(n => { if(!has(f, n)) f.dishes.push(n); });

/* ── ④ 레시피 — 모달이 아니라 페이지다. 재료와 만드는 법(또는 영상)을 탭으로. */
let rDish = null, rBack = 'home', rServ = 2, rTab = 'ing', stepI = 0;
/** 레시피 분량. 장보기와 달리 올림하지 않는다 — 사러 갈 양이 아니라 넣을 양이다. 0.5 단위. */
const half = v => { const r = Math.round(v * 2) / 2; return r % 1 ? r.toFixed(1) : String(r); };
function fmtR(v, u){
  if(v == null || !u) return null;
  if(u === 'ml') return v >= 200 ? half(v / 200) + '컵' : half(v / 15) + '큰술';
  if(u === 'g')  return v >= 1000 ? half(v / 1000) + 'kg' : Math.max(1, Math.round(v)) + 'g';
  return half(v) + u;
}
function openRecipe(d, back){
  rDish = d; rBack = back || rBack; rTab = 'ing'; stepI = 0; ytNow = null; ytSeek = 0;
  rServ = d.servings || 2;
  const p = dishPic(d);
  $('rth').innerHTML = p ? `<img src="${p}" alt="">` : BOWL;
  $('rtitle').textContent = d.name;
  $('rtags').innerHTML = (d.vid ? ['유튜브'] : [d.kind, d.time, d.level]).filter(Boolean).map(t => `<i>${esc(t)}</i>`).join('');
  $('rseg').innerHTML = `<button data-t="ing">재료</button><button data-t="step">${d.vid ? '영상' : '만드는 법'}</button>`;
  paintMark(); paintTimer(); renderRecipe(); show('recipe');
}
const paintMark = () => $('rmark').classList.toggle('on', marks.has(rDish.name));

/* ── 요리 타이머 — 남은 시간을 세지 않고 `끝나는 시각`을 잡아 둔다. 돌아왔을 때 흘러간 만큼이 정확히 반영된다. */
let tEnd = 0, tId = null, tMin = 5, actx = null;
const PRESETS = [5, 15, 30, 45, 60];
const mmss = ms => { const t = Math.max(0, Math.ceil(ms / 1000));
  return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
function beep(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    [0, .45, .9].forEach(t => {
      const o = actx.createOscillator(), g = actx.createGain(), at = actx.currentTime + t;
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0, at);
      g.gain.linearRampToValueAtTime(.22, at + .02);
      g.gain.exponentialRampToValueAtTime(.001, at + .32);
      o.connect(g); g.connect(actx.destination);
      o.start(at); o.stop(at + .34);
    });
  }catch(e){}
}
/** 꾹 누르면 이어서 올라간다. 0.42초 뒤부터 0.09초마다. */
function hold(btn, fn){
  let wait, rep;
  const stop = () => { clearTimeout(wait); clearInterval(rep); };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); fn(); wait = setTimeout(() => { rep = setInterval(fn, 90); }, 420); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
}
function paintTimer(){
  const left = tEnd - Date.now(), on = tEnd > 0 && left > 0;
  $('rtime').classList.toggle('on', on);
  $('rtimet').textContent = on ? mmss(left) : '';
}
function tick(){ if(tEnd && Date.now() >= tEnd) return ringNow(); paintTimer(); }
function startTimer(min){
  tMin = min; tEnd = Date.now() + min * 60000;
  clearInterval(tId); tId = setInterval(tick, 250);
  try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === 'suspended') actx.resume(); }catch(e){}
  closeSheet(); paintTimer();
}
function stopTimer(){ tEnd = 0; clearInterval(tId); tId = null; paintTimer(); }
function ringNow(){
  stopTimer(); beep();
  if(navigator.vibrate) try{ navigator.vibrate([200, 120, 200, 120, 300]); }catch(e){}
  openSheet(`<div class="ring">
    <span class="rc2"><svg width="38" height="38" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="5.6"/><path d="M8 6.2V9l1.9 1.2M6.2 1.6h3.6"/></svg></span>
    <h4>시간이 다 되었어요!</h4>
    <p>${esc(rDish ? rDish.name : '')} · ${tMin}분</p></div>`);
}
function timerSheet(){
  const left = tEnd - Date.now();
  if(tEnd > 0 && left > 0){
    openSheet(`<h3>요리 타이머</h3><p class="sub">${tMin}분으로 맞춰 뒀어요. 다 되면 알려드릴게요.</p>
      <div class="tdial"><div class="tv" id="tv">${mmss(left)}</div></div>
      <button class="tgo stop" id="tstop">멈추기</button>`);
    const h = setInterval(() => { const l = tEnd - Date.now(), el = $('tv');
      if(!el || l <= 0) return clearInterval(h); el.textContent = mmss(l); }, 250);
    $('tstop').onclick = () => { stopTimer(); closeSheet(); toast('타이머를 멈췄어요'); };
    return;
  }
  openSheet(`<h3>요리 타이머</h3><p class="sub">화면을 끄면 소리가 안 울릴 수 있어요. 켜 두시는 게 확실합니다.</p>
    <div class="tdial">
      <button id="tm" aria-label="1분 줄이기">−</button>
      <div class="tv" id="tv">${String(tMin).padStart(2, '0')}:00</div>
      <button id="tp" aria-label="1분 늘리기">+</button>
    </div>
    <div class="tpre">${PRESETS.map(p => `<button data-m="${p}">${p}분</button>`).join('')}</div>
    <button class="tgo" id="tstart">시작</button>`);
  const paint = () => { $('tv').textContent = String(tMin).padStart(2, '0') + ':00';
    box.querySelectorAll('.tpre button').forEach(b => b.classList.toggle('on', +b.dataset.m === tMin)); };
  const step = d => () => { tMin = Math.min(120, Math.max(1, tMin + d)); paint(); };
  hold($('tm'), step(-1)); hold($('tp'), step(1));
  box.querySelectorAll('.tpre button').forEach(b => b.onclick = () => { tMin = +b.dataset.m; paint(); });
  $('tstart').onclick = () => startTimer(tMin);
  paint();
}
$('rtime').onclick = timerSheet;
$('rmark').onclick = () => {
  marks.has(rDish.name) ? marks.delete(rDish.name) : marks.add(rDish.name);
  saveMarks(); paintMark(); toast(marks.has(rDish.name) ? '저장했어요' : '저장을 지웠어요');
};

/* 영상 제어 — IFrame API 없이 postMessage로. `listening`을 보내면 플레이어가 infoDelivery로 현재 시각을 보내 준다.
   그게 안 오면 마지막으로 점프한 시각을 기준으로 10초 뒤로 간다. */
let ytNow = null, ytSeek = 0;
const ytCmd = (func, args) => { const f = $('ytf'); if(f) f.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: args || [] }), '*'); };
window.addEventListener('message', e => {
  if(!/youtube(-nocookie)?\.com$/.test(e.origin)) return;
  try{ const d = JSON.parse(e.data); if(d.event === 'infoDelivery' && d.info && d.info.currentTime != null) ytNow = d.info.currentTime; }catch(x){}
});
function ytSeekTo(t){ ytSeek = t; ytNow = t; ytCmd('seekTo', [t, true]); ytCmd('playVideo'); }

function srcBlock(d){
  if(d.vid) return `<div class="rsrc">레시피 · 유튜브 영상 · <a href="https://youtu.be/${esc(d.vid)}" target="_blank" rel="noopener">유튜브에서 보기</a></div>`;
  const pc = D.photos[d.name];
  return `<div class="rsrc">레시피 · ${esc(d.source || '')}` +
    (pc ? `<br>사진 · <a href="${esc(pc.u)}" target="_blank" rel="noopener">${esc(pc.t)}</a> · ${esc(pc.l)} · 위키미디어 공용` : '') + `</div>`;
}
/** 폴더 맥락(담기 모드로 훑다가 들어온 경우)에서만 `이 폴더에 담기`. */
function addBtn(){
  const f = browseFid && folders.find(x => x.id === browseFid);
  if(!f || has(f, keyOf(rDish.vid ? rDish : rDish.name))) return '';
  return `<button class="tgo radd" id="radd">${esc(f.name)}에 담기</button>`;
}
function bindAdd(){ const b = $('radd'); if(!b) return; b.onclick = () => {
  const f = folders.find(x => x.id === browseFid); f.dishes.push(rDish.vid ? rDish : rDish.name); saveF(); toast('담았어요'); renderRecipe(); }; }

function renderRecipe(){
  const d = rDish, base = d.servings || 2;
  [...$('rseg').children].forEach(b => b.classList.toggle('on', b.dataset.t === rTab));
  $('rpane').classList.toggle('stepping', rTab === 'step' && !d.vid);

  if(rTab === 'ing'){
    const groups = [];
    (d.ing || []).forEach(i => { const t = i.t || '재료'; let g = groups.find(x => x.t === t); if(!g) groups.push(g = { t, items: [] }); g.items.push(i); });
    $('rpane').innerHTML =
      `<div class="serv"><span class="sl">인분</span>
         <div class="servc"><span id="servn">${rServ}인분</span>
           <button class="servb" id="servm" aria-label="한 인분 줄이기">−</button>
           <button class="servb" id="servp" aria-label="한 인분 늘리기">+</button></div></div>` +
      (groups.length ? `<div class="ing">${groups.map(g => `<div class="igr">${esc(g.t)}</div>` + g.items.map(i => {
          const scaled = fmtR(i.v == null ? null : i.v / base * rServ, i.u);
          return `<div class="ir"><span>${esc(i.n)}</span><b class="${scaled ? '' : 'raw'}">${esc(scaled || i.q || '조금')}</b></div>`;
        }).join('')).join('')}</div>` : `<p style="margin:0;font-size:13px;color:var(--l-tx3)">아직 재료가 없어요. 적어 두면 장볼 것에 들어가요.</p>`) +
      (base !== rServ ? `<p style="margin:10px 2px 0;font-size:10.5px;color:var(--l-tx3)">레시피 기준 ${base}인분에서 ${rServ}인분으로 계산했어요. <b style="font-weight:700">적당량</b>처럼 양이 안 적힌 것은 그대로예요.</p>` : '') +
      (d.vid ? `<div class="rw"><button id="redit">재료 고치기</button></div>` : '') +
      addBtn() + srcBlock(d);
    $('servm').onclick = () => { rServ = Math.max(1, rServ - 1); renderRecipe(); };
    $('servp').onclick = () => { rServ = Math.min(12, rServ + 1); renderRecipe(); };
    if(d.vid) $('redit').onclick = () => ytForm({ name: d.name, vid: d.vid, url: 'https://youtu.be/' + d.vid, ing: d.ing || [], chapters: d.chapters || [] }, true);
    bindAdd();
    return;
  }

  if(d.vid){
    const ch = d.chapters || [];
    const org = /^https?:/.test(location.protocol) ? '&origin=' + encodeURIComponent(location.origin) : '';
    $('rpane').innerHTML =
      `<div class="yt"><iframe id="ytf" src="https://www.youtube-nocookie.com/embed/${esc(d.vid)}?enablejsapi=1${org}"
         allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>` +
      (ch.length ? `<div class="chs">${ch.map(c => `<button class="ch" data-t="${c.t}"><b>${mmss(c.t * 1000)}</b><span>${esc(c.label)}</span></button>`).join('')}</div>` : '') +
      `<div class="rw"><button id="back10">
         <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a5 5 0 1 0 1.5-3.6M3 2.5v3h3"/></svg>10초 뒤로</button></div>` +
      addBtn() + srcBlock(d);
    $('ytf').onload = () => $('ytf').contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*');
    box.querySelectorAll; $('rpane').querySelectorAll('.ch').forEach(b => b.onclick = () => ytSeekTo(+b.dataset.t));
    $('back10').onclick = () => ytSeekTo(Math.max(0, (ytNow != null ? ytNow : ytSeek) - 10));
    bindAdd();
    return;
  }

  const st = d.steps || [];
  if(!st.length){
    $('rpane').innerHTML = `<p style="font-size:13px;color:var(--l-tx3)">아직 만드는 법이 없어요.</p>` + addBtn() + srcBlock(d);
    bindAdd(); return;
  }
  const s = st[stepI];
  $('rpane').innerHTML =
    `<div class="scard"><div class="sb">
       <div class="snum">${stepI + 1} / ${st.length}</div>
       <div class="stx">${esc(s.d)}${s.t ? `<span class="stip">${esc(s.t)}</span>` : ''}</div>
     </div></div>
     <div class="grow"></div>
     ${addBtn()}${srcBlock(d)}
     <div class="sfoot">
       <div class="dots">${st.map((_, i) => `<i class="${i === stepI ? 'on' : ''}"></i>`).join('')}</div>
       <div class="snav">
         <button class="prev" id="sprev"${stepI ? '' : ' disabled'}>이전</button>
         <button class="next" id="snext">${stepI < st.length - 1 ? '다음' : '다 만들었어요'}</button>
       </div>
     </div>`;
  bindAdd();
  $('sprev').onclick = () => { if(stepI > 0){ stepI--; renderRecipe(); scrollTo(0, 0); } };
  // 마지막에서는 비활성 버튼으로 막아 두지 않는다. 다 만든 사람에게 필요한 건 나가는 길이다.
  $('snext').onclick = () => {
    if(stepI < st.length - 1){ stepI++; renderRecipe(); scrollTo(0, 0); return; }
    go(rBack); toast('맛있게 드세요');
  };
}
$('rseg').onclick = e => { const b = e.target.closest('button'); if(!b) return; rTab = b.dataset.t; renderRecipe(); scrollTo(0, 0); };
$('rback').onclick = () => go(rBack);

/* ── ⑤ 장볼 것 ───────────────────────────────────────────── */
let L = null;   // 지금 화면의 합산 결과
function renderList(){
  const f = folder(), ds = dishesOf(f), p = plan(ds, f.days), a = L = aggregate(ds, f.people);
  const done = doneBy[f.id] = doneBy[f.id] || {};
  const apart = ds.reduce((s, d) => s + (d.ing || []).filter(i => i.b).length, 0);
  $('lsub').textContent = `${f.name} · ${f.days === 1 ? '하루' : f.days + '일'} · 성인 ${f.people} · 요리 ${ds.length}가지 · 살 것 ${a.buyCount}가지`;
  $('ovl').style.display = a.overlaps.length ? '' : 'none';
  $('ovl').innerHTML = `<div class="k">이 재료들이 겹쳐요</div>
    <div class="tags">${a.overlaps.map(o => `<span class="tg">${esc(o.name)}<i>${o.used}끼</i></span>`).join('')}</div>
    <div class="sum"><span>따로 사면 <s>${apart}가지</s></span><span>·</span><span>한 번에 사면</span><b>${a.buyCount}가지</b></div>`;
  // 장보기가 두 번 이상이면 차수로 나눈다. 재료는 그 재료를 쓰는 첫 요리의 날이 속한 차수로.
  let secs = [{ groups: a.groups }];
  if(p.mode === 'days' && p.trips.length >= 2){
    const dayOf = {}; p.days.forEach(d => d.dishes.forEach(x => { if(dayOf[x.name] == null) dayOf[x.name] = d.i; }));
    const tripOf = it => { const day = Math.min(...it.where.map(w => dayOf[w] || 1)); let k = 0; p.trips.forEach((t, i) => { if(t <= day) k = i; }); return k; };
    secs = p.trips.map((t, k) => ({ title: `${k + 1}차 장보기`, sub: `${t}일`,
      groups: a.groups.map(g => ({ cat: g.cat, items: g.items.filter(it => tripOf(it) === k) })).filter(g => g.items.length) }));
  }
  $('cats').innerHTML = secs.map(sec => (sec.title ? `<div class="lsec">${sec.title}<span>${sec.sub}</span></div>` : '') +
    sec.groups.map(g => `
    <section class="cat">
      <h2><span class="ic"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" style="color:var(--ink)">${ICONS[g.cat] || ''}</svg></span>
        <span class="n">${esc(g.cat)}</span><span class="c">${g.items.length}가지</span></h2>
      ${g.items.map(it => `
        <button class="row${done[it.name] ? ' done' : ''}" data-n="${esc(it.name)}">
          <span class="nm">${esc(it.name)}</span>
          ${it.used >= 2 ? `<span class="ov">${it.used}끼</span>` : ''}
          <span class="qt">${esc(it.qty)}</span>
          <span class="ck">${CHECKI}</span>
        </button>`).join('')}
    </section>`).join('')).join('');
}
$('back').onclick = () => go('folder');
$('cats').onclick = e => { const r = e.target.closest('.row'); if(!r) return;
  const n = r.dataset.n, done = doneBy[fid]; done[n] = !done[n]; r.classList.toggle('done', done[n]); };

/** 공유 — 체크한 건 이미 산 것이니 빼고, 남은 것만 보낸다. 기기 공유 시트 → 클립보드 → 텍스트 상자 순으로 물러난다. */
function shareText(){
  const f = folder(), ds = dishesOf(f), done = doneBy[f.id] || {};
  const left = L.groups.map(g => ({ cat: g.cat, items: g.items.filter(it => !done[it.name]) })).filter(g => g.items.length);
  const n = left.reduce((a, g) => a + g.items.length, 0);
  const src = new Map(); ds.forEach(d => { const s = d.vid ? '유튜브' : d.source; src.set(s, (src.get(s) || 0) + 1); });
  const body = left.map(g => `[${g.cat}]\n` + g.items.map(it => `· ${it.name} ${it.qty}`).join('\n')).join('\n\n');
  return { n, text: `${f.name} — ${f.days === 1 ? '하루' : f.days + '일'} · 성인 ${f.people}\n살 것 ${n}가지\n\n${body}\n\n` +
    `요리 · ${ds.map(d => d.name).join(' · ')}\n레시피 출처 · ${[...src].map(([x, c]) => x + ' ' + c).join(' · ')}\n보글 · BOGL°` };
}
$('share').onclick = async () => {
  const { n, text } = shareText();
  if(!n) return toast('전부 담으셨어요');
  if(navigator.share){ try{ await navigator.share({ title: '장볼 것 ' + n + '가지', text }); return; }catch(e){ if(e.name === 'AbortError') return; } }
  try{ await navigator.clipboard.writeText(text); toast('장볼 것 ' + n + '가지 복사했어요'); return; }catch(e){}
  openSheet(`<h3>장볼 것 ${n}가지</h3><p class="sub">전체 선택해서 가져가세요. 체크한 건 빠져 있어요.</p><textarea readonly>${esc(text)}</textarea>`);
  box.querySelector('textarea').select();
};
$('find').onclick = () => {
  const done = doneBy[fid] || {};
  const items = L.groups.flatMap(g => g.items).filter(it => !done[it.name]);
  if(!items.length) return toast('전부 담으셨어요');
  openSheet(`<h3>쿠팡에서 찾기</h3><p class="sub">재료마다 검색으로 열려요. 상품을 저장해 두지 않아서 품절이나 단종으로 링크가 끊기지 않습니다.</p>` +
    items.map(it => `<a class="lk" target="_blank" rel="noopener" href="https://www.coupang.com/np/search?q=${encodeURIComponent(it.name)}">
      <span>${esc(it.name)}</span><span class="q">${esc(it.qty)}</span>${ARROW}</a>`).join(''));
};

/* ── 진입. 공유(share_target)나 `?u=` 로 유튜브 링크가 들어오면 폴더부터 고른다. */
(function entry(){
  renderHome();
  const q = new URLSearchParams(location.search);
  const raw = q.get('u') || q.get('url') || q.get('text') || '';
  if(!ytId(raw)) return;
  history.replaceState({}, '', location.pathname);
  const url = (raw.match(/https?:\/\/\S+/) || [raw])[0];
  const then = f => { fid = f.id; go('folder'); linkSheet(url); };
  folders.length ? chooseFolderSheet(then) : newFolderSheet(then);
})();
</script>
