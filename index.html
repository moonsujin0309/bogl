  .srch input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--cream);outline:none;padding:0}
  .srch input::placeholder{color:var(--d-tx3)}

  /* ── 홈 · 탐색 칩 + 그리드 ────────────────────── */
  .explore{display:flex;gap:2px;padding:10px 20px 0}
  .ec{flex:0 0 auto;width:66px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 4px}
  .ec .ep{width:40px;height:40px;border-radius:20px;background:var(--d-card2);overflow:hidden;border:2px solid transparent;
          display:flex;align-items:center;justify-content:center;color:var(--d-tx3)}
  .ec .ep img{display:block;width:100%;height:100%;object-fit:cover}
  .ec .ep svg{width:16px;height:16px}
  .ec .el{font-size:12px;font-weight:700;color:var(--d-tx3);white-space:nowrap}
  .ec.on .ep{border-color:var(--cream)}
  .ec.on .el{color:var(--cream)}
  /* 정렬. 칩보다 한 단 낮은 글줄로 둔다. */
  .sortrow{display:flex;gap:14px;padding:4px 26px 12px}
  .sortrow button{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--d-tx3);
                  padding:5px 0;white-space:nowrap;border-bottom:1.5px solid transparent}
  .sortrow button.on{color:var(--cream);border-bottom-color:var(--cream)}
  /* 사진이 주인공이다. 담기(+)와 레시피(사진·이름)는 모양이 다른 두 자리에 있다. */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 11px;
        padding:0 26px calc(28px + var(--sa-b))}
  #home.hasbar .grid{padding-bottom:calc(96px + var(--sa-b))}
  .card{display:flex;flex-direction:column;gap:8px}
  .card .thw{position:relative}
  .card .th{display:block;width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--d-card2);
            color:var(--d-tx3);position:relative}
  .card .th .bowl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .card .th .bowl svg{width:28px;height:28px}
  .card .th img{display:block;width:100%;height:100%;object-fit:cover}
  .card .mk2{position:absolute;top:8px;right:8px;width:25px;height:25px;border-radius:13px;
             background:var(--cream);color:var(--ink);display:flex;align-items:center;justify-content:center}
  .card .add{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:16px;
             background:var(--cream);color:var(--ink);display:flex;align-items:center;justify-content:center}
  .card .add::after{content:'';position:absolute;inset:-6px}
  .card.on .add{background:var(--ink);color:var(--cream)}
  .card .cb{display:block;width:100%}
  .card .cn{display:block;font-size:14px;font-weight:700;letter-spacing:-.035em;line-height:1.35;color:var(--cream);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .cm{display:block;font-size:12px;color:var(--d-tx3);margin-top:2px}
  .empty{padding:40px 26px;text-align:center;font-size:13px;color:var(--d-tx3)}
  /* 아래 바 — 현재 계획에 요리가 하나라도 있으면 올라온다. 통째로 버튼이다. */
  .cartbar{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;z-index:5;
           transform:translate(-50%,110%);transition:transform .22s;
           display:flex;align-items:center;gap:12px;height:calc(64px + var(--sa-b));padding:0 14px var(--sa-b) 26px;
           background:var(--cream);color:var(--ink);border-radius:18px 18px 0 0}
  .cartbar.on{transform:translate(-50%,0)}
  .cartbar .fp .cir{border-color:var(--cream);background:var(--l-thumb);color:var(--l-tx3)}
  .cartbar .ct{flex:1;min-width:0;font-size:14px;font-weight:900;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cartbar .cgo{display:flex;align-items:center;gap:6px;height:42px;padding:0 15px;border-radius:13px;
                background:var(--ink);color:var(--cream);font-size:13.5px;font-weight:900;white-space:nowrap;flex-shrink:0}

  /* ── 계획 ──────────────────────────────────────── */
  .drow{display:flex;gap:12px;padding:6px 26px 4px}
  .drow button{flex:0 0 auto;width:60px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .drow .cir{width:56px;height:56px;border-radius:28px}
  .drow .more .cir{border:1.5px dashed var(--d-line);background:none;color:var(--d-tx2)}
  /* `두부두루치기`가 잘리면 메뉴가 아니다. keep-all로 안 쪼개지므로 anywhere로 풀고 두 줄까지. */
  .drow span:last-child{font-size:12px;color:var(--d-tx2);text-align:center;line-height:1.25;width:100%;
             overflow-wrap:anywhere;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .set{display:flex;align-items:center;gap:9px;padding:10px 26px 0;flex-wrap:wrap}
  .set .lbl{min-width:60px}
  .dchips{display:flex;align-items:center;gap:3px}
  .dchips button{position:relative;width:32px;height:34px;border-radius:10px;background:var(--d-card2);color:var(--d-tx2);
                 font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .dchips button::after{content:'';position:absolute;inset:-6px}
  .dchips button.on{background:var(--cream);color:var(--ink)}
  .dchips .u{font-size:12px;color:var(--d-tx3);margin-left:4px}
  .dchips button.w{width:auto;padding:0 10px}
  /* 시작 날짜 — 네이티브 피커 그대로, 색만 다크 토큰 */
  .set input[type=date]{height:44px;padding:0 10px;border:0;border-radius:10px;background:var(--d-card2);color:var(--d-tx2);
        font:inherit;font-size:16px;font-weight:800;color-scheme:dark;-webkit-appearance:none;appearance:none;min-width:0}
  .drow button{position:relative}
  .drow .nd{position:absolute;top:0;right:3px;width:9px;height:9px;border-radius:5px;background:var(--cream);border:2px solid var(--d-bg)}
  .tdot{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--cream);margin-right:7px;vertical-align:middle}
  .plan{padding:12px 26px 4px;display:flex;flex-direction:column;gap:8px}
  .day{border-radius:16px;background:var(--d-card);padding:12px 14px}
  .day .dh{display:flex;align-items:center;font-size:11px;letter-spacing:.14em;color:var(--d-tx3);min-height:22px}
  .day .dh .tp{margin-left:auto;letter-spacing:0;font-weight:900;font-size:11px;
               color:var(--ink);background:var(--cream);padding:4px 8px;border-radius:7px}
  .day .dr{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;min-height:36px}
  .day .dr .cir{width:36px;height:36px;border-radius:18px}
  .day .dr .cir svg{width:16px;height:16px}
  .day .dr .dn{font-size:15px;font-weight:700;letter-spacing:-.03em;color:var(--cream);
               min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .day .dr em{font-style:normal;font-size:12px;color:var(--d-tx3);margin-left:auto;flex-shrink:0}
  .dp{padding:0 14px;font-size:12px;line-height:1.5;color:var(--d-tx2);margin-top:-2px}
  .rest{padding:2px 14px;font-size:12px;color:var(--d-tx3)}

  /* ── 레시피 (다크) ────────────────────────────
     모달로 두면 스크롤이 갇히고 길이가 안 나온다. 레시피는 페이지가 맞다.
     본문은 라이트 토큰으로 짜여 있으므로 이 블록에서 토큰만 갈아끼운다 —
     되돌리려면 아래 여덟 줄을 지우고 배경을 --l-bg로 되돌리면 끝이다. */
  #recipe{
    --l-bg:oklch(.215 .006 60); --l-card:oklch(.268 .006 60);
    --l-line:oklch(.352 .006 60); --l-thumb:oklch(.312 .006 60);
    --ink:oklch(.965 .008 85);      /* 반전 바탕이 크림이 된다 */
    --cream:oklch(.215 .006 60);    /* 반전 위의 글씨는 바탕색으로 */
    --l-tx2:oklch(.782 .008 70); --l-tx3:oklch(.622 .008 70);
    background:var(--l-bg);color:var(--ink)}
  .rtop{display:flex;align-items:center;justify-content:space-between;
        padding:calc(8px + var(--sa-t)) 16px 0}
  .rback,.rmark{width:44px;height:44px;border-radius:22px;color:var(--l-tx2);
         display:flex;align-items:center;justify-content:center}
  .rtr{display:flex;align-items:center;gap:2px}
  /* 남은 시간은 자리가 흔들리면 안 읽힌다. 숫자 폭을 고정한다. */
  .rtime{height:44px;min-width:44px;padding:0 11px;border-radius:22px;color:var(--l-tx2);
         display:flex;align-items:center;justify-content:center;gap:6px}
  .rtime b{font-size:13px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .rtime.on{background:var(--ink);color:var(--cream)}
  /* 타이머 설정 — 큰 숫자 하나와 ±, 그리고 자주 쓰는 시간 */
  .tdial{display:flex;align-items:center;justify-content:space-between;gap:14px;
         padding:6px 4px 14px}
  .tdial .tv{font-size:44px;font-weight:900;letter-spacing:-.05em;line-height:1;
             font-variant-numeric:tabular-nums;color:var(--ink)}
  .tdial button{width:46px;height:46px;border-radius:15px;background:var(--l-thumb);color:var(--ink);
                display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}
  .tpre{display:flex;gap:5px;padding-bottom:16px}
  .tpre button::after{content:'';position:absolute;inset:-3px}
  .tpre button{position:relative;flex:1;min-width:0;height:38px;padding:0 6px;border-radius:11px;
               background:var(--l-thumb);color:var(--l-tx2);font-size:12.5px;font-weight:800;
               display:flex;align-items:center;justify-content:center;white-space:nowrap}
  .tpre button.on{background:var(--ink);color:var(--cream)}
  .tgo{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:15px;
       background:var(--ink);color:var(--cream);font-size:15px;font-weight:900}
  .tgo.stop{background:var(--l-thumb);color:var(--l-tx2)}
  .tgo.in{background:var(--l-card);color:var(--l-tx2)}
  .ring{display:flex;flex-direction:column;align-items:center;gap:16px;padding:14px 0 22px;text-align:center}
  .ring .rc2{width:84px;height:84px;border-radius:42px;background:var(--ink);color:var(--cream);
             display:flex;align-items:center;justify-content:center}
  .ring h4{margin:0;font-size:19px;font-weight:900;letter-spacing:-.04em;color:var(--ink)}
  .ring p{margin:0;font-size:12.5px;color:var(--l-tx3)}
  .rmark.on{background:var(--ink);color:var(--cream)}
  .rhead{display:flex;align-items:center;gap:14px;padding:4px 26px 14px}
  .rth{width:62px;height:62px;border-radius:16px;overflow:hidden;background:var(--l-thumb);flex:0 0 auto;
       display:flex;align-items:center;justify-content:center;color:var(--l-tx3)}
  .rth img{display:block;width:100%;height:100%;object-fit:cover}
  .rht{min-width:0}
  .rtitle{margin:0;font-size:19px;font-weight:900;letter-spacing:-.045em;line-height:1.25;
          overflow-wrap:anywhere}
  .rtags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .rtags i{font-style:normal;font-size:12px;font-weight:700;color:var(--l-tx2);background:var(--l-card);
           border:1px solid var(--l-line);padding:5px 9px;border-radius:7px}
  /* 재료는 만드는 도중에도 언제든 돌아볼 수 있어야 한다. 그래서 화면에 붙여 둔다. */
  .rseg{position:sticky;top:0;z-index:3;display:flex;gap:6px;padding:9px 26px 10px;
        background:var(--l-bg);border-bottom:1px solid var(--l-line)}
  .rseg button{flex:1;height:42px;border-radius:12px;background:var(--l-card);
               border:1px solid var(--l-line);font-size:13px;font-weight:800;color:var(--l-tx2);
               display:flex;align-items:center;justify-content:center}
  .rseg button.on{background:var(--ink);border-color:var(--ink);color:var(--cream);font-weight:900}
  .rpane{flex:1;display:flex;flex-direction:column;padding:16px 26px 14px}
  .rpane.stepping{padding-bottom:0}
  /* 담기 버튼은 화면 아래 고정. 단계 화면의 이전·다음은 그 위에 얹힌다. */
  .rfoot{position:sticky;bottom:0;z-index:2;padding:8px 26px calc(14px + var(--sa-b));
         background:linear-gradient(to top,var(--l-bg) 74%,transparent)}
  .rpane.stepping .sfoot{bottom:calc(76px + var(--sa-b));padding-bottom:4px}
  .serv{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
  .serv .sl{font-size:11px;letter-spacing:.15em;color:var(--l-tx3)}
  .servc{display:flex;align-items:center;gap:9px;height:40px;padding:0 6px 0 14px;border-radius:12px;
         background:var(--l-card);border:1px solid var(--l-line);font-size:13.5px;font-weight:800}
  .servb{width:30px;height:30px;border-radius:9px;background:var(--l-thumb);color:var(--ink);
         display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1}
  .ing{background:var(--l-card);border-radius:16px;padding:4px 16px}
  .igr{font-size:11px;letter-spacing:.14em;color:var(--l-tx3);padding:13px 0 1px}
  .ir{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 0;
      border-bottom:1px solid var(--l-line);font-size:13.5px}
  .ing .ir:last-child{border-bottom:0}
  .ir b{font-weight:700;color:var(--l-tx2);font-size:12.5px;white-space:nowrap}
  .ir b.raw{font-weight:500;color:var(--l-tx3)}
  /* 만드는 법은 한 번에 한 단계만. 스무 문단을 한꺼번에 두면 어디까지 했는지 놓친다. */
  .scard{background:var(--l-card);border-radius:18px;overflow:hidden}
  .scard .sb{padding:17px 20px 20px}
  .scard .snum{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--l-tx3)}
  .scard .stx{margin-top:8px;font-size:15px;line-height:1.7;color:var(--ink)}
  .stip{display:block;margin-top:12px;padding:11px 13px;border-radius:10px;background:var(--l-thumb);
        font-size:12px;line-height:1.65;color:var(--l-tx3)}
  .sfoot{position:sticky;bottom:0;padding:10px 0 calc(10px + var(--sa-b));
         background:linear-gradient(to top,var(--l-bg) 74%,transparent)}
  .dots{display:flex;gap:5px;justify-content:center;padding:0 0 10px}
  .dots i{width:6px;height:6px;border-radius:3px;background:var(--l-line);transition:width .18s}
  .dots i.on{background:var(--ink);width:17px}
  .snav{display:flex;gap:9px}
  .snav button{flex:1;height:52px;border-radius:14px;font-size:14px;font-weight:900;
               display:flex;align-items:center;justify-content:center;gap:7px}
  .snav .prev{background:var(--l-card);border:1px solid var(--l-line);color:var(--l-tx2)}
  .snav .next{background:var(--ink);color:var(--cream)}
  .snav button[disabled]{opacity:.34}
  .rsrc{margin-top:26px;padding-top:15px;border-top:1px solid var(--l-line);
        font-size:12px;line-height:1.75;color:var(--l-tx3)}
  .rsrc a{text-decoration:underline;text-underline-offset:2px}
  /* 영상 요리 — 만드는 법 대신 영상. 단계를 누르면 그 자리로 간다. */
  .yt{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--l-thumb)}
  .yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .chs{margin-top:12px;background:var(--l-card);border-radius:16px;padding:4px 16px}
  .ch{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;border-bottom:1px solid var(--l-line);font-size:13.5px}
  .chs .ch:last-child{border-bottom:0}
  .ch b{font-size:12px;font-weight:900;color:var(--l-tx3);font-variant-numeric:tabular-nums;flex-shrink:0}
  .rw{display:flex;gap:8px;margin-top:12px}
  .rw button{flex:1;height:46px;border-radius:13px;background:var(--l-card);border:1px solid var(--l-line);
             color:var(--l-tx2);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}

  /* ── 장보기 목록 (라이트) ───────────────────── */
  #list{background:var(--l-bg);color:var(--ink)}
  .lhead{display:flex;align-items:center;gap:4px;padding:calc(14px + var(--sa-t)) 26px 10px}
  .back{width:44px;height:44px;margin-left:-13px;display:flex;align-items:center;justify-content:center;color:var(--l-tx2);flex-shrink:0}
  .lhead h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.045em}
  .lhead p{margin:3px 0 0;font-size:12px;color:var(--l-tx3);line-height:1.5}
  .lsec{display:flex;align-items:baseline;gap:6px;padding:12px 26px 8px;font-size:13px;font-weight:900;letter-spacing:-.03em}
  .lsec span{font-size:12px;font-weight:700;color:var(--l-tx3)}

  .ovl{margin:0 26px 10px;padding:15px 17px 13px;border-radius:18px;background:var(--ink);color:var(--cream)}
  .ovl .k{font-size:11px;letter-spacing:.14em;color:var(--d-tx3)}
  .ovl .tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
  .ovl .tg{display:flex;align-items:baseline;gap:4px;padding:6px 10px;border-radius:9px;background:oklch(.31 .008 60);
           font-size:12.5px;font-weight:700}
  .ovl .tg i{font-style:normal;font-size:11px;font-weight:900;color:var(--d-tx2)}
  .ovl .sum{display:flex;align-items:baseline;gap:7px;padding-top:12px;border-top:1px solid oklch(.35 .008 60);
            font-size:12px;color:var(--d-tx2);flex-wrap:wrap}
  .ovl .sum b{font-size:21px;font-weight:900;letter-spacing:-.04em;color:var(--cream)}
  .ovl .sum s{color:var(--d-tx3)}

  .cat{margin:0 26px 8px;border-radius:18px;background:var(--l-card);overflow:hidden}
  .cat h2{margin:0;display:flex;align-items:center;gap:10px;padding:12px 18px 9px;font-size:12.5px;font-weight:900}
  .cat h2 .ic{width:27px;height:27px;border-radius:9px;background:var(--l-thumb);
              display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .cat h2 .n{flex:1}
  .cat h2 .c{font-size:12px;font-weight:700;color:var(--l-tx3)}
  /* 긴 재료명(돼지고기 앞다리살)이 수량과 체크를 밀어내지 않게 이름만 줄인다. */
  .row{display:flex;align-items:center;gap:4px;width:100%;min-height:50px;padding:3px 14px 3px 17px;
       border-top:1px solid var(--l-line)}
  .row .nmb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:44px}
  .row .ckb{width:44px;height:44px;margin-right:-11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .row .nm{font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .ov{font-size:11px;font-weight:900;color:var(--ink);background:oklch(.93 .012 80);
           padding:3px 6px;border-radius:6px;white-space:nowrap;flex-shrink:0}
  .row .qt{font-size:13.5px;font-weight:900;color:var(--l-tx2);margin-left:auto;
           white-space:nowrap;flex-shrink:0}
  .row .ck{width:22px;height:22px;border-radius:11px;border:1.5px solid oklch(.87 .006 80);flex-shrink:0;
           display:flex;align-items:center;justify-content:center;color:transparent}
  .row.done .nm,.row.done .qt{color:var(--l-tx3);text-decoration:line-through}
  .row.done .ov{opacity:.35}
  .row.done .ck{background:var(--ink);border-color:var(--ink);color:var(--cream)}
  .have{margin:2px 26px 12px;font-size:12px;color:var(--l-tx3)}
  .have summary{min-height:44px;display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:700;list-style:none}
  .have summary::-webkit-details-marker{display:none}
  .have summary::before{content:'';width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;

<script>
/* 계산은 전부 plan.js — build.py가 여기 그대로 박는다. */
// 보글 · plan.js — 배치 · 매대 분류 · 재료 합산 · 유튜브 설명란 파싱.
// 브라우저에서는 build.py가 app.html에 인라인하고, node에서는 require로 읽는다 (test_plan.js).
// 화면 코드는 여기 없다. 여기 있는 것은 전부 순수 계산이다.

// ───────────────────────────────────────────── 매대 분류 (이마트몰 대분류)
const CATS = [
  ['정육 · 계란', ['쇠고기', '돼지', '갈비', '삼겹', '목살', '안심', '등심', '사태', '양지', '닭', '오리',
                 '계란', '베이컨', '햄', '소시지', '정육', '우둔', '차돌']],
  ['수산 · 건해산', ['갈치', '동태', '명태', '고등어', '조기', '오징어', '새우', '조개', '미역', '김',
                  '게', '낙지', '문어', '대구', '굴', '홍합', '바지락', '북어', '황태', '어묵', '멸치',

  ['우유 · 유제품', ['우유', '치즈', '버터', '생크림', '요구르트', '요거트', '연유']],
  ['쌀 · 잡곡', ['쌀', '찹쌀', '보리', '현미', '팥', '녹두', '수수', '기장', '가래떡', '떡']],
  ['라면 · 통조림', ['라면', '국수', '소면', '당면', '칼국수', '냉면', '스파게티', '통조림', '참치']],
  ['김치 · 반찬', ['김치', '깍두기', '장아찌', '젓갈']],
  ['장 · 양념 · 오일', ['고추장', '된장', '간장', '식초', '참기름', '들기름', '식용유', '설탕', '소금',

];
const CAT_ORDER = ['정육 · 계란', '수산 · 건해산', '채소 · 두부', '김치 · 반찬', '장 · 양념 · 오일',
                   '쌀 · 잡곡', '라면 · 통조림', '우유 · 유제품'];

function category(name){
  for(const [cat, keys] of CATS) if(keys.some(k => name.includes(k))) return cat;
  return '채소 · 두부';
}

// ───────────────────────────────────────────── 상할 때까지 며칠

            '다짐', '다진', '굴', '조개', '조갯살'];
const P30 = ['무', '당근', '감자', '양파', '마늘'];
const CAT30 = ['김치 · 반찬', '장 · 양념 · 오일', '쌀 · 잡곡', '라면 · 통조림'];

function perish(name){
  const cat = category(name);
  if(cat === '수산 · 건해산') return SEA_LONG.some(k => name.includes(k)) ? 30 : 1;
  if(CAT30.includes(cat)) return 30;
  if(P1.some(k => name.includes(k))) return 1;
  if(P30.some(k => name.includes(k))) return 30;
  return 7;
}

// ───────────────────────────────────────────── 수량 (build.py parse_qty 이식 — 같은 입력에 같은 결과)
const ML = { '컵': 200, '큰술': 15, 'T': 15, 't': 5, '작은술': 5, 'ml': 1, 'cc': 1, '리터': 1000, 'L': 1000 };
const G = { 'g': 1, 'kg': 1000, '그램': 1, '근': 600 };
const COUNT = ['개', '장', '뿌리', '마리', '쪽', '모', '단', '대', '포기', '알', '톨', '줄기',
               '통', '잎', '봉지', '봉', '공기', '줌', '송이', '덩어리', '자루', '판', '토막', '묶음', '팩', '캔'];
const VAGUE = ['약간', '적당량', '조금', '한줌', '기호에', '기호껏', '취향', '적당히', '넉넉히'];
// 한글 수사는 숫자로 바꾼 뒤 기존 규칙을 탄다. `두부`의 `두`를 2로 읽지 않게 뒤에 공백이나 단위가 와야 한다.
const KNUM = { '한두': 2, '두세': 3, '다섯': 5, '여섯': 6, '한': 1, '두': 2, '세': 3, '네': 4, '반': 0.5 };
const KNUM_RE = new RegExp('^(한두|두세|다섯|여섯|한|두|세|네|반)(?=\\s|$|' +
  Object.keys(ML).concat(Object.keys(G), COUNT).filter(u => /[ㄱ-힣]/.test(u)).join('|') + ')');

function parseQty(s){
  s = String(s || '').trim();
  if(!s || VAGUE.some(v => s.includes(v))) return null;
  s = s.replace(/½/g, '1/2').replace(/¼/g, '1/4').replace(/⅓/g, '1/3').replace(KNUM_RE, (m, k) => KNUM[k]);
  let m, val, unit;
  if((m = s.match(/^\s*(\d+)\s*과\s*(\d+)\s*\/\s*(\d+)\s*(.*)$/))){ val = +m[1] + m[2] / m[3]; unit = m[4]; }
  else if((m = s.match(/^\s*(\d+(?:\.\d+)?)\s*[~\-]\s*(\d+(?:\.\d+)?)\s*(.*)$/))){ val = Math.max(+m[1], +m[2]); unit = m[3]; }
  else if((m = s.match(/^\s*(\d+)\s*\/\s*(\d+)\s*(.*)$/))){ val = m[1] / m[2]; unit = m[3]; }
  else if((m = s.match(/^\s*(\d+(?:\.\d+)?)\s*(.*)$/))){ val = +m[1]; unit = m[2]; }
  else return null;
  unit = unit.trim() ? unit.trim().split(/\s+/)[0] : '개';
  unit = unit.replace(/[^\wㄱ-힣]/g, '') || '개';
  if(['kg', 'g', 'ml', 'cc', 'l'].includes(unit.toLowerCase())) unit = unit.toLowerCase();
  if(unit in ML) return [val * ML[unit], 'ml'];
  if(unit in G) return [val * G[unit], 'g'];
  for(const c of COUNT) if(unit.startsWith(c)) return [val, c];
  return [val, unit];
}

// 장볼 양이라 모자라지 않게 올림한다. 3.4개를 사러 갈 수는 없다.
function fmt(v, u){
  if(v == null || !u) return '조금';
  if(u === 'ml') return v >= 200 ? (Math.ceil(v / 100) / 2) + '컵' : Math.max(1, Math.ceil(v / 15 - 1e-9)) + '큰술';
  if(u === 'g')  return v >= 1000 ? (Math.ceil(v / 100) / 10) + 'kg' : (Math.ceil(v / 10) * 10) + 'g';
  return Math.ceil(v - 1e-9) + u;
}

// 단위가 여러 그룹으로 흩어지면 가장 자주 나온 그룹만 쓴다. 개수 단위는 전부 한 그룹이다.
function pickQty(sums, seen){
  const keys = Object.keys(sums);
  if(!keys.length) return null;
  const groups = {};
  for(const u of keys){ const g = (u === 'g' || u === 'ml') ? u : 'count'; groups[g] = groups[g] || {}; groups[g][u] = (groups[g][u] || 0) + sums[u]; }
  const hits = g => Object.keys(groups[g]).reduce((a, u) => a + (seen[u] || 0), 0);
  let top = null;
  for(const g in groups) if(top === null || hits(g) > hits(top)) top = g;
  const total = Object.values(groups[top]).reduce((a, b) => a + b, 0);
  let unit = top;
  if(top === 'count'){ unit = null; for(const u in groups.count) if(unit === null || (seen[u] || 0) > (seen[unit] || 0)) unit = u; }
  return { qty: fmt(total, unit), value: Math.round(total * 1000) / 1000, unit };
}

/** 폴더 요리들의 장볼 재료를 합산한다. b인 재료만, 인분은 people/servings로 환산. */
function aggregate(dishes, people){
  const agg = new Map();
  for(const d of dishes){
    const scale = people / (d.servings || 4);
    for(const i of d.ing || []){
      if(!i.b) continue;
      let a = agg.get(i.n);
      if(!a) agg.set(i.n, a = { sum: {}, units: {}, used: 0, where: [], by: [] });
      a.used++; a.where.push(d.name);
      const has = i.v != null && i.u;
      a.by.push({ dish: d.name, v: has ? i.v * scale : null, u: has ? i.u : null, q: i.q || '조금' });   // 올림 전 원값. 헤더(살 양)만 올림한다
      if(has){ a.sum[i.u] = (a.sum[i.u] || 0) + i.v * scale; a.units[i.u] = (a.units[i.u] || 0) + 1; }
    }
  }
  const by = {};
  [...agg.entries()].sort((x, y) => (y[1].used - x[1].used) || x[0].localeCompare(y[0], 'ko')).forEach(([n, a]) => {
    const got = pickQty(a.sum, a.units) || { qty: '조금', value: null, unit: null };
    (by[category(n)] = by[category(n)] || []).push({ name: n, qty: got.qty, value: got.value, unit: got.unit, used: a.used, where: a.where, by: a.by });
  });
  const groups = CAT_ORDER.filter(c => by[c]).map(c => ({ cat: c, items: by[c] }));
  const overlaps = [...agg.entries()].filter(([, a]) => a.used >= 2)
    .map(([n, a]) => ({ name: n, used: a.used, where: a.where }))
    .sort((x, y) => (y.used - x.used) || x.name.localeCompare(y.name, 'ko'));
  return { groups, overlaps, buyCount: agg.size };
}

// ───────────────────────────────────────────── 배치
const ROLE = { '부침': 'fresh', '구이': 'fresh', '밥': 'fresh', '만두/면류': 'fresh',
               '조림': 'ahead', '찜': 'ahead', '밑반찬/김치': 'ahead',   // 나물·생채는 전날에 가면 물이 난다 (2026-09-08)
               '국': 'soup', '찌개/전골/스튜': 'soup', '탕': 'soup' };
const role = d => ROLE[d.kind] || '';
// 하루 모드 슬롯. 사용자가 고른 when(ahead·day·fresh)이 kind 판정보다 앞선다. 며칠 모드에서는 안 쓴다.
const SLOT = { ahead: 0, day: 1, fresh: 2 };
const slotOf = d => d.when in SLOT ? SLOT[d.when] : role(d) === 'ahead' ? 0 : role(d) === 'fresh' ? 2 : 1;
const minOf = d => d.min && d.min < 999 ? d.min : 0;
const buyOf = d => (d.ing || []).filter(i => i.b).map(i => i.n);
const shared = (a, b) => { const s = new Set(buyOf(b)); return buyOf(a).filter(n => s.has(n)); };
// 잔재료는 밑작업으로 알릴 값어치가 없다. 대파·마늘까지 적으면 진짜 손질거리(가지·무)가 묻힌다. 배치 점수에는 그대로 쓴다.
const MINOR = ['고추', '붉은고추', '청고추', '대파', '쪽파', '마늘', '다진마늘', '다진파', '생강', '양파', '소금', '후추'];
const major = ns => ns.filter(n => !MINOR.some(k => n.includes(k)));
// 받침이 있으면 `은`, 없으면 `는`
const neun = w => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return (c >= 0 && c <= 11171 && c % 28 !== 0) ? '은' : '는'; };

// 앞쪽 날부터 하나씩 더. 7개 5일이면 2·2·1·1·1. 요리가 날보다 적으면 뒤쪽 날이 빈다.
function assign(perm, days){
  const out = []; let k = 0;
  for(let i = 0; i < days; i++){ const take = Math.ceil((perm.length - k) / (days - i)); out.push(perm.slice(k, k + take)); k += take; }
  return out;
}

// 1일에 한 번. 그 뒤로는 상하는 재료가 있는 날에 마지막 장보기로부터 너무 지났으면 한 번 더.
function tripsOf(byDay){
  const t = []; let last = 0;
  byDay.forEach((ds, i) => {
    const day = i + 1;
    const need = day === 1 || ds.some(d => buyOf(d).some(n => { const p = perish(n); return day - last > (p === 1 ? 2 : p); }));
    if(need){ t.push(day); last = day; }
  });
  return t;
}

function scoreOf(byDay){
  let s = tripsOf(byDay).length * 10;
  for(let i = 0; i + 1 < byDay.length; i++)
    if(byDay[i].some(d => role(d) === 'soup') && byDay[i + 1].some(d => role(d) === 'soup')) s += 3;
  const dayOf = []; byDay.forEach((ds, i) => ds.forEach(d => dayOf.push([d, i])));
  for(let a = 0; a < dayOf.length; a++) for(let b = a + 1; b < dayOf.length; b++)
    if(shared(dayOf[a][0], dayOf[b][0]).length) s += Math.abs(dayOf[a][1] - dayOf[b][1]);
  return s;
}

function* perms(arr){
  if(arr.length <= 1){ yield arr.slice(); return; }
  for(let i = 0; i < arr.length; i++){
    const rest = arr.slice(0, i).concat(arr.slice(i + 1));
    for(const p of perms(rest)) yield [arr[i], ...p];
  }
}
// 씨 고정 난수 — 같은 폴더면 다시 열어도 같은 배치가 나와야 한다.
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function* candidates(dishes){
  if(dishes.length <= 7){ yield* perms(dishes); return; }
  // ponytail: 8개 넘으면 표본 탐색. 전수는 40,320부터 체감된다
  yield dishes.slice();
  const r = rng(20260907);
  // Large playlists must not freeze the main thread. Bound pair comparisons.
  const attempts = dishes.length <= 12 ? 3000 : Math.max(1, Math.floor(80000 / (dishes.length * dishes.length)));
  for(let k = 0; k < attempts; k++){
    const p = dishes.slice();
    for(let i = p.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
    yield p;
  }
}

/** dishes: [{name, kind, min?, when?, ing:[{n,b}]}], days: 1~7, opts: {once} — 장보기 한 번에 */
function plan(dishes, days, opts){
  opts = opts || {};
  if(days <= 1){
    const slots = [{ label: '전날', dishes: [] }, { label: '당일 아침', dishes: [] }, { label: '먹기 직전', dishes: [] }];
    for(const d of dishes) slots[slotOf(d)].dishes.push(d);
    slots.forEach(s => s.dishes.sort((a, b) => minOf(b) - minOf(a)));   // 같은 칸에서는 오래 걸리는 것부터
    const prep = [];
    for(const a of slots[0].dishes) for(const o of slots[1].dishes.concat(slots[2].dishes)){
      const sh = major(shared(a, o));
      if(sh.length) prep.push({ day: 0, text: `${sh.join('·')}${neun(sh[sh.length - 1])} 전날 손질해 두면 당일 ${o.name}에 그대로 써요` });
    }
    return { mode: 'day', slots, prep };
  }
  let best = null, bestScore = Infinity;
  for(const p of candidates(dishes)){
    const byDay = assign(p, days), s = scoreOf(byDay);
    if(s < bestScore){ best = byDay; bestScore = s; }
  }
  // 한 번에 장보면 태그만 사라진다. 점수는 그대로라 상하는 재료는 이미 앞쪽 날에 가 있다.
  const trips = opts.once ? [1] : tripsOf(best);
  const prep = [];
  for(let i = 0; i + 1 < best.length; i++){
    const ings = new Set(), names = new Set();
    for(const a of best[i]) for(const b of best[i + 1]){ const sh = major(shared(a, b)); if(sh.length){ sh.forEach(n => ings.add(n)); names.add(b.name); } }
    if(ings.size) prep.push({ day: i + 1, text: `${[...ings].join('·')} 손질할 때 내일 ${[...names].join('·')} 것도 같이` });
  }
  return { mode: 'days', days: best.map((ds, i) => ({ i: i + 1, dishes: ds, trip: trips.includes(i + 1) })), trips, prep, score: bestScore };
}

// ───────────────────────────────────────────── 유튜브 설명란
const CHAP = /^\s*(?:(\d{1,2}):)?(\d{1,2}):(\d{2})\s*[-–—:]?\s*(.+)$/;
const ING_HEAD = /재료|Ingredients|준비물/i;
const STEP_HEAD = /만드는\s*법|조리|레시피|순서|\b(?:directions|instructions|method)\b/i;

// 한 줄을 `이름 / 수량`으로 가른다. 마지막 공백(또는 :) 뒤가 수량으로 읽히면 거기서, 아니면 그 앞 칸에서 한 번 더.
function splitLine(s){
  s = s.replace(/\([^)]*\)/g, ' ').trim().replace(/^[-•·*]+\s*/, '').replace(/^\d+[.)]\s+/, '').replace(/\s+/g, ' ');
  let cut = s.length;
  for(let k = 0; k < 2; k++){
    const i = Math.max(s.lastIndexOf(' ', cut - 1), s.lastIndexOf(':', cut - 1));
    if(i <= 0) break;
    const head = s.slice(0, i).replace(/[:\s]+$/, ''), tail = s.slice(i + 1).trim();
    const p = head && parseQty(tail);
    if(p) return { n: head, q: tail, v: p[0], u: p[1], b: 1 };
    cut = i;
  }
  return { n: s, q: '', b: 1 };
}

// `돼지고기 300g, 양파 1개`처럼 한 줄에 여럿이면 나눈다. 수량이 둘 이상 읽힐 때만 — `소금, 후추 약간`은 한 줄이다.
// `1/2모`의 `/`는 분수라 자르지 않는다.
function pushLine(line, ing){
  const parts = line.replace(/(\d)\/(\d)/g, '$1\u0001$2').split(/\s*[·,\/]\s*/)
    .map(s => s.replace(/\u0001/g, '/').trim()).filter(Boolean);   // lookbehind 없이 — iOS 16.4 미만은 lookbehind에서 파싱 자체가 죽는다
  const items = parts.length >= 2 ? parts.map(splitLine) : [];
  if(items.filter(i => i.q).length >= 2){ items.forEach(i => { if(i.n) ing.push(i); }); return; }
  const it = splitLine(line);
  if(it.n) ing.push(it);
}

function parseDesc(text){
  const chapters = [], ing = [];
  let inIng = false, blank = 0;
  for(const raw of String(text || '').split(/\r?\n/)){
    const m = raw.match(CHAP);
    if(m){ chapters.push({ t: (+(m[1] || 0)) * 3600 + (+m[2]) * 60 + (+m[3]), label: m[4].trim() }); inIng = false; continue; }
    const line = raw.replace(/\([^)]*\)/g, ' ');   // `(2인분 기준)` 같은 괄호는 뗀다
    // Bilingual descriptions repeat the same recipe. Prefer the Korean ingredient list.
    if(/\bingredients\b/i.test(line) && ing.some(i => /[가-힣]/.test(i.n))){ inIng = false; continue; }
    if(/https?:\/\/|구독|좋아요|협찬|광고|문의|인스타그램|instagram|copyright/i.test(line)){ inIng = false; continue; }
    if(!inIng){
      if(ING_HEAD.test(line)){ inIng = true; blank = 0;
        const rest = line.split(/[:：]/).slice(1).join(':').trim();   // `재료 : 돼지고기 300g, 양파 1개` — 같은 줄에 달린 재료
        if(rest) pushLine(rest, ing); }
      continue;
    }
    if(!line.trim()){ if(++blank >= 2) inIng = false; continue; }
    blank = 0;
    if(STEP_HEAD.test(line)){ inIng = false; continue; }
    if(/^\s*[\[【].*[\]】]\s*:?\s*$/.test(line)) continue;   // [양념] 같은 소제목
    pushLine(line, ing);
  }
  return { ing, chapters: [...new Map(chapters.map(c => [c.t, c])).values()].sort((a, b) => a.t - b.t) };
}

function youtubeURL(text){
  const raw = String(text || '').trim(), found = raw.match(/https?:\/\/[^\s<>]+/);
  try{
    const u = new URL(found ? found[0] : raw);
    return ['https:', 'http:'].includes(u.protocol) &&
      ['youtube.com', 'www.youtube.com', 'm.youtube.com', 'music.youtube.com', 'youtu.be', 'www.youtube-nocookie.com'].includes(u.hostname) ? u : null;
  }catch(e){ return null; }
}
function ytId(text){
  const u = youtubeURL(text); if(!u) return null;
  const paths = u.pathname.split('/').filter(Boolean);
  const id = u.hostname === 'youtu.be' ? paths[0] : u.pathname === '/watch' ? u.searchParams.get('v') :
    ['shorts', 'live', 'embed'].includes(paths[0]) ? paths[1] : null;
  return /^[\w-]{11}$/.test(id || '') ? id : null;
}
function ytList(text){ const u = youtubeURL(text), id = u && u.searchParams.get('list'); return /^[\w-]+$/.test(id || '') ? id : null; }

if(typeof module !== 'undefined') module.exports = { CATS, CAT_ORDER, category, perish, parseQty, fmt, pickQty, aggregate, plan, parseDesc, splitLine, ytId, ytList };

</script>

const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 저장. 서버가 없으니 이 기기에만 남는다. 시크릿 모드에서는 localStorage가 예외를 던지므로 감싼다.
   스키마(bogl.folders)는 그대로다 — 화면에서 `계획`이라 부를 뿐 코드는 folder다. */
const load = (k, d) => { try{ const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }catch(e){ return d; } };

/* ── 화면 전환. 바탕색·상태바 색도 같이 바꾼다. 레시피에서는 화면이 안 꺼지게 잡는다. */
let wl = null, lockGeneration = 0;
async function lockOn(){
  if(wl && !wl.released) return;
  const generation = ++lockGeneration;
  try{ const acquired = await navigator.wakeLock?.request('screen');
    if(generation !== lockGeneration || cur !== 'recipe'){ acquired?.release(); return; } wl = acquired;
  }catch(e){}
}
function lockOff(){ lockGeneration++; try{ wl && wl.release(); }catch(e){} wl = null; }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && cur === 'recipe') lockOn(); });

function show(id){
  if(cur === 'recipe' && id !== 'recipe'){ rememberRecipe(); destroyPlayer(); }
  cur = id;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id));
  const light = id === 'list';   // 밝은 화면은 장보기 목록 하나다.
  document.body.classList.toggle('light', light);
  const m = document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content', id === 'home' ? '#F3F2E9' : light ? '#f5f4f1' : '#2b2926');
  if(id === 'recipe') lockOn(); else lockOff();
  scrollTo(0, 0);
}

sheet.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ e.preventDefault(); closeSheet(); return; }
  if(e.key !== 'Tab') return;
  const els = [...box.querySelectorAll('button:not([disabled]),a[href],input,textarea,summary,[tabindex="0"]')].filter(el => el.getClientRects().length);
  const first = els[0], last = els[els.length - 1];
  if(!first){ e.preventDefault(); return; }
  if(e.shiftKey && (document.activeElement === first || document.activeElement === box)){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && (document.activeElement === last || document.activeElement === box)){ e.preventDefault(); first.focus(); }
});

function renderPlan(){
  const f = folder(); if(!f) return go('home');
  const ds = dishesOf(f), d0 = addDays(f.start, 0);
  $('pnamet').textContent = f.name;
  $('pdate').hidden = f.days !== 1;
  $('pdate').textContent = md(d0) + ' ' + WD[d0.getDay()];
  // 영상 요리인데 재료가 없으면 원형 오른쪽 위에 점. 시트 첫 줄이 이유를 말한다.
  $('pdishes').innerHTML = ds.map(d => `<button data-k="${esc(keyOf(d))}">${face(d)}${d.vid && !(d.ing || []).length ? '<i class="nd"></i>' : ''}<span>${esc(d.name)}</span></button>`).join('') +
    `<button class="more" id="pmore"><span class="cir">${PLUSI}</span><span>더 담기</span></button>`;
  $('pdays').innerHTML = [1, 2, 3, 4, 5, 6, 7].map(n => `<button class="${n === 1 ? 'w' : ''}${n === f.days ? ' on' : ''}" data-d="${n}" aria-label="${n === 1 ? '하루' : n + '일'}">${n === 1 ? '하루' : n}</button>`).join('') + `<span class="u">일</span>`;
  $('fp').textContent = f.people; $('fk').textContent = f.kids;
  $('pstart').value = f.start;
  $('ponce').classList.toggle('on', !!f.once); $('ponce').hidden = f.days === 1;   // 하루면 장보기는 어차피 한 번이다
  $('planbox').innerHTML = ds.length ? planHtml(planOf(f), f)
    : `<div class="emp"><p>아직 담긴 요리가 없어요</p><button id="gopick">요리 고르러 가기</button></div>`;
  $('goList').disabled = !ds.length;
}
/** 요리가 있는 날만 카드로. 밑작업은 카드 아래 한 줄. 빈 날은 마지막에 한 줄로만. */
function planHtml(p, f){
  // 하루 모드에서는 소요시간을 붙인다 — 같은 칸에서 무엇부터 할지. plan.js가 긴 것부터 정렬해 둔다.
  const row = d => `<button class="dr" data-k="${esc(keyOf(d))}">${face(d)}<span class="dn">${esc(d.name)}</span>${p.mode === 'day' && d.min ? `<em>${d.min}분</em>` : ''}</button>`;
  const card = (label, ds, tag, preps) => `<div class="day"><div class="dh"><span>${label}</span>${tag ? `<span class="tp">${tag}</span>` : ''}</div>${ds.map(row).join('')}</div>` +
    preps.map(x => `<div class="dp">${esc(x.text)}</div>`).join('');
  if(p.mode === 'day'){
    const first = p.slots[0];   // 장은 전날에. 전날 카드가 없으면 한 줄로만.
    return `<div class="plan">${first.dishes.length ? '' : '<div class="rest">장은 전날에</div>'}${p.slots.filter(s => s.dishes.length)
      .map(s => card(s.label, s.dishes, s === first ? '장보기' : '', s === first ? p.prep : [])).join('')}</div>`;
  }
  const used = p.days.filter(d => d.dishes.length);
  const tag = d => !d.trip ? '' : p.trips.length > 1 ? `${p.trips.indexOf(d.i) + 1}차 장보기` : '장보기';
  const label = d => { const dt = addDays(f.start, d.i - 1); return (ymd(dt) === ymd() ? '<i class="tdot"></i>오늘 · ' : '') + WD[dt.getDay()] + ' ' + md(dt); };
  return `<div class="plan">${used.map(d => card(label(d), d.dishes, tag(d), p.prep.filter(x => x.day === d.i))).join('')}
    ${used.length < p.days.length ? `<div class="rest">나머지 ${p.days.length - used.length}일은 비어 있어요</div>` : ''}</div>`;
}

/* ── 유튜브 ──────────────────────────────────────────────
   playlistItems.list(1 unit) · videos.list · playlists.list(제목 한 줄)만 부른다. search는 절대 안 부른다(100 units). */
const LIST_ERR = "재생목록을 못 읽었어요. 공개 상태가 '미등록'인지 확인해 주세요";
async function ytApi(path, params){
  const u = new URL('https://www.googleapis.com/youtube/v3/' + path);
  Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  u.searchParams.set('key', YTKEY);
  const controller = new AbortController(), timeout = setTimeout(() => controller.abort(), 12000);
  try{
    const r = await fetch(u, {signal:controller.signal});
    if(!r.ok) throw new Error('yt ' + r.status);
    return await r.json();
  }finally{ clearTimeout(timeout); }
}
/** 영상 제목 → 요리 이름. `[…]`·`(…)`·`|` 뒤·`#태그`를 뗀다. 다 떼서 비면 원래 제목. */
const cleanTitle = t => { t = String(t || ''); const s = t.replace(/\[[^\]]*\]|\([^)]*\)|【[^】]*】/g, ' ').split('|')[0].replace(/#\S+/g, ' ').replace(/\s+/g, ' ').trim(); return s || t.trim(); };
/** 재생목록 → 계획의 요리. 이미 재료를 고친 항목은 덮어쓰지 않고, 링크로 따로 담은 것은 남긴다.
    돌려주는 값은 설명란에 재료가 없는 영상 수. */
async function pullList(f){
  let items = [], token = '';
  for(let k = 0; k < 4; k++){   // 50개씩 최대 4쪽 = 200개. 1쪽 1 unit.
    const r = await ytApi('playlistItems', Object.assign({ part: 'snippet', maxResults: 50, playlistId: f.list }, token ? { pageToken: token } : {}));
    items = items.concat(r.items || []); token = r.nextPageToken;
    if(!token) break;
  }
  const old = new Map(f.dishes.filter(e => e.vid).map(e => [e.vid, e]));
  const fresh = items.map(it => {
    const s = it.snippet, vid = s.resourceId && s.resourceId.videoId;
    if(!vid || /^(Private|Deleted) video$/.test(s.title)) return null;
    const p = parseDesc(s.description), o = old.get(vid);
    return Object.assign({ name: cleanTitle(s.title), channel: s.videoOwnerChannelTitle || '', src: 'yt', vid, url: 'https://youtu.be/' + vid, servings: 2,
                           ing: p.ing, chapters: p.chapters, at: Date.now() },
                         o ? { servings: o.servings || 2, when: o.when } : {},
                         o && o.edited ? { name: o.name, ing: o.ing, edited: 1 } : {},
                         o && o.customChapters ? {chapters:o.chapters,customChapters:true} : {});
  }).filter(Boolean);
  const got = new Set(fresh.map(e => e.vid));
  f.dishes = f.dishes.filter(e => typeof e === 'string' || (e.link && !got.has(e.vid))).concat(fresh);
  f.at = Date.now(); f.truncated = !!token; saveF();
  return fresh.filter(e => !e.ing.length).length;
}
/** 유튜브 데이터는 30일 넘게 못 갖는다. 25일 지난 것은 계획을 열 때 다시 받는다. */
async function syncFolder(f){
  if(!YTKEY || !f) return false;
  const old = Date.now() - 25 * DAY;
  let changed = false;
  if(f.list && f.at < old){ await pullList(f); changed = true; }
  const stale = f.dishes.filter(e => e.vid && e.link && e.at < old);
  if(stale.length){
    const r = await ytApi('videos', { part: 'snippet', id: stale.map(e => e.vid).join(',') });
    r.items.forEach(v => { const e = stale.find(x => x.vid === v.id); if(!e) return;
      const p = parseDesc(v.snippet.description); if(!e.customChapters) e.chapters = p.chapters; e.at = Date.now(); e.expired = false;
      if(!e.edited){ e.name = cleanTitle(v.snippet.title); e.ing = p.ing; } });
    changed = true; saveF();
  }
  return changed;
}

/** 영상 하나를 현재 계획에 넣고 레시피 화면을 연다. 첫 저장(폼 없음)과 정리 폼 저장이 같이 쓴다. */

/* ── ③ 레시피 — 모달이 아니라 페이지다. 재료와 만드는 법(또는 영상)을 탭으로. */

/** 조리 분량은 소량을 0.5 단위로 반올림하지 않는다 (5ml ≠ 0.5큰술). */
const half = v => String(Math.round(v * 100) / 100);
function fmtR(v, u){
  if(v == null || !u) return null;
  if(u === 'ml') return v >= 200 ? half(v / 200) + '컵' : v < 15 ? half(v / 5) + '작은술' : half(v / 15) + '큰술';
  if(u === 'g')  return v >= 1000 ? half(v / 1000) + 'kg' : half(v) + 'g';
  return half(v) + u;
}
/** ctx: 계획에서 열었으면 인분을 그 계획의 먹을 사람으로. 홈에서 열면 레시피 기본 인분. */

const refreshingVideos = new Set();

/* ── 요리 타이머 — 남은 시간을 세지 않고 `끝나는 시각`을 잡아 둔다. 돌아왔을 때 흘러간 만큼이 정확히 반영된다. */
let tEnd = 0, tId = null, tMin = 5, actx = null;
const PRESETS = [5, 15, 30, 45, 60];
const mmss = ms => { const t = Math.max(0, Math.ceil(ms / 1000));
  return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
function beep(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    [0, .45, .9].forEach(t => {
      const o = actx.createOscillator(), g = actx.createGain(), at = actx.currentTime + t;
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0, at);
      g.gain.linearRampToValueAtTime(.22, at + .02);
      g.gain.exponentialRampToValueAtTime(.001, at + .32);
      o.connect(g); g.connect(actx.destination);
      o.start(at); o.stop(at + .34);
    });
  }catch(e){}
}
/** 꾹 누르면 이어서 올라간다. 0.42초 뒤부터 0.09초마다. */
function hold(btn, fn){
  let wait, rep;
  const stop = () => { clearTimeout(wait); clearInterval(rep); };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); fn(); wait = setTimeout(() => { rep = setInterval(fn, 90); }, 420); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
  btn.addEventListener('click', e => { if(e.detail === 0) fn(); });
}
function paintTimer(){
  const left = tEnd - Date.now(), on = tEnd > 0 && left > 0;
  $('rtime').classList.toggle('on', on);
  $('rtimet').textContent = on ? mmss(left) : '';
}
function tick(){ if(tEnd && Date.now() >= tEnd) return ringNow(); paintTimer(); }
function startTimer(min){
  tMin = min; tEnd = Date.now() + min * 60000;
  clearInterval(tId); tId = setInterval(tick, 250);
  try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === 'suspended') actx.resume(); }catch(e){}
  closeSheet(); paintTimer();
}
function stopTimer(){ tEnd = 0; clearInterval(tId); tId = null; paintTimer(); }
function ringNow(){
  stopTimer(); beep();
  if(navigator.vibrate) try{ navigator.vibrate([200, 120, 200, 120, 300]); }catch(e){}
  openSheet(`<div class="ring">
    <span class="rc2"><svg width="38" height="38" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="5.6"/><path d="M8 6.2V9l1.9 1.2M6.2 1.6h3.6"/></svg></span>
    <h4>시간이 다 되었어요!</h4>
    <p>${esc(rDish ? rDish.name : '')} · ${tMin}분</p></div>`);
}
function timerSheet(){
  const left = tEnd - Date.now();
  if(tEnd > 0 && left > 0){
    openSheet(`<h3>요리 타이머</h3><p class="sub">${tMin}분으로 맞춰 뒀어요. 다 되면 알려드릴게요.</p>
      <div class="tdial"><div class="tv" id="tv">${mmss(left)}</div></div>
      <button class="tgo stop" id="tstop">멈추기</button>`);
    const h = setInterval(() => { const l = tEnd - Date.now(), el = $('tv');
      if(!el || l <= 0) return clearInterval(h); el.textContent = mmss(l); }, 250);
    $('tstop').onclick = () => { stopTimer(); closeSheet(); toast('타이머를 멈췄어요'); };
    return;
  }
  openSheet(`<h3>요리 타이머</h3><p class="sub">화면을 끄면 소리가 안 울릴 수 있어요. 켜 두시는 게 확실합니다.</p>
    <div class="tdial">
      <button id="tm" aria-label="1분 줄이기">−</button>
      <div class="tv" id="tv">${String(tMin).padStart(2, '0')}:00</div>
      <button id="tp" aria-label="1분 늘리기">+</button>
    </div>
    <div class="tpre">${PRESETS.map(p => `<button data-m="${p}">${p}분</button>`).join('')}</div>
    <button class="tgo" id="tstart">시작</button>`);
  const paint = () => { $('tv').textContent = String(tMin).padStart(2, '0') + ':00';
    box.querySelectorAll('.tpre button').forEach(b => b.classList.toggle('on', +b.dataset.m === tMin)); };
  const step = d => () => { tMin = Math.min(120, Math.max(1, tMin + d)); paint(); };
  hold($('tm'), step(-1)); hold($('tp'), step(1));
  box.querySelectorAll('.tpre button').forEach(b => b.onclick = () => { tMin = +b.dataset.m; paint(); });
  $('tstart').onclick = () => startTimer(tMin);
  paint();
}

/* 공식 IFrame API. 플레이어는 재료/단계 탭 밖에서 한 번만 만든다. */
let player = null, playerReady = false, playerGeneration = 0, playerTicker = null, playerTimeout = null, ytNow = 0;
let checkedIngredients = new Set(), apiPromise = null;
function rememberRecipe(){
  if(!rDish) return;

function destroyPlayer(){
  playerGeneration++; clearInterval(playerTicker); clearTimeout(playerTimeout); playerTicker = null;
  try{ player?.destroy(); }catch(e){} player = null; playerReady = false;
  if($('cookmedia')) $('cookmedia').innerHTML = '';
}
function youtubeAPI(){
  if(window.YT?.Player) return Promise.resolve();
  if(apiPromise) return apiPromise;
  apiPromise = new Promise((resolve,reject) => {
    const script = document.createElement('script'), timer = setTimeout(() => reject(new Error('player timeout')),12000);
    window.onYouTubeIframeAPIReady = () => { clearTimeout(timer); resolve(); };
    script.src = 'https://www.youtube.com/iframe_api';
    script.onerror = () => { clearTimeout(timer); script.remove(); reject(new Error('player unavailable')); };
    document.head.appendChild(script);
  }).catch(e => { apiPromise = null; throw e; });
  return apiPromise;
}
function playerStatus(text){ const el = $('playerstatus'); if(el) el.textContent = text; }
function paintChapter(){
  const chapters = rDish?.chapters || [];
  const index = chapters.reduce((found,c,i) => c.t <= ytNow ? i : found, -1);
  document.querySelectorAll('#rpane .ch').forEach((el,i) => { el.classList.toggle('on', i === index); if(i === index) el.setAttribute('aria-current','step'); else el.removeAttribute('aria-current'); });

}
function ytSeekTo(time){
  if(!playerReady) return;
  ytNow = Math.max(0,time); player.seekTo(ytNow,true); player.playVideo(); paintChapter(); rememberRecipe();
}
async function mountPlayer(d){
  const generation = playerGeneration, start = ytNow;
  const org = /^https?:/.test(location.protocol) ? '&origin=' + encodeURIComponent(location.origin) : '';
  $('cookmedia').innerHTML = `<div class="yt"><iframe id="ytf" title="${esc(d.name)} — YouTube 영상" src="https://www.youtube-nocookie.com/embed/${esc(d.vid)}?enablejsapi=1&playsinline=1&start=${Math.floor(start)}${org}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
    <div class="player-tools"><button id="back10" disabled>10초 뒤로</button><button id="playpause" disabled>재생</button><button id="nextchapter" disabled>다음 단계</button></div>
    <div class="player-status"><span id="playerstatus" role="status">영상 준비 중…</span> · <a href="https://youtu.be/${esc(d.vid)}" target="_blank" rel="noopener">유튜브에서 열기</a></div>`;
  $('back10').onclick = () => ytSeekTo(ytNow - 10);

  $('nextchapter').onclick = () => { const next = (d.chapters || []).find(c => c.t > ytNow + 1); if(next) ytSeekTo(next.t); };
  const failure = () => {
    if(generation !== playerGeneration) return;
    playerReady = false; clearTimeout(playerTimeout);
    ['back10','playpause','nextchapter'].forEach(id => { if($(id)) $(id).disabled = true; });
    document.querySelectorAll('#rpane .ch').forEach(b => b.disabled = true);
    playerStatus('영상 연결을 확인해 주세요. 원본에서도 볼 수 있어요');
  };
  try{
    await youtubeAPI(); if(generation !== playerGeneration) return;
    playerTimeout = setTimeout(failure,15000);
    player = new YT.Player('ytf', {events:{
      onReady: e => {
        if(generation !== playerGeneration) return;
        clearTimeout(playerTimeout); playerReady = true;
        e.target.getIframe().setAttribute('title',d.name + ' — YouTube 영상');
        ['back10','playpause'].forEach(id => $(id).disabled = false);
        document.querySelectorAll('#rpane .ch').forEach(b => b.disabled = false);

        let ticks = 0;

    }});
  }catch(e){ failure(); }
}

  const apart = ds.reduce((s, d) => s + (d.ing || []).filter(i => i.b).length, 0);
  $('ltitle').textContent = `살 것 ${a.buyCount}가지`;
  $('lsub').textContent = `${f.name} · ${spanOf(f)} · ${peopleLabel(f)}`;
  const missing = ds.filter(d => !(d.ing || []).length);
  $('missing').innerHTML = missing.length ? `<div class="missing-ingredients"><b>재료 미입력 영상 ${missing.length}개는 목록에서 빠져 있어요.</b><br>${missing.map(d => `<button data-missing="${esc(keyOf(d))}">${esc(d.name)} 재료 적기</button>`).join('<br>')}</div>` : '';
  $('missing').querySelectorAll('[data-missing]').forEach(b => b.onclick = () => { const d = ds.find(d => keyOf(d) === b.dataset.missing); if(d) openRecipe(d,'list',true); });
  $('ovl').style.display = a.overlaps.length ? '' : 'none';
  $('ovl').innerHTML = `<div class="k">이 재료들이 겹쳐요</div>
    <div class="tags">${a.overlaps.map(o => `<span class="tg">${esc(o.name)}<i>${o.used}끼</i></span>`).join('')}</div>
    <div class="sum"><span>따로 사면 <s>${apart}가지</s></span><span>·</span><span>한 번에 사면</span><b>${a.buyCount}가지</b></div>`;
  // 장보기가 두 번 이상이면 차수로 나눈다. 재료는 그 재료를 쓰는 첫 요리의 날이 속한 차수로.
  let secs = [{ groups: a.groups }];
  if(p.mode === 'days' && p.trips.length >= 2){
    const dayOf = {}; p.days.forEach(d => d.dishes.forEach(x => { if(dayOf[x.name] == null) dayOf[x.name] = d.i; }));
    const tripOf = it => { const day = Math.min(...it.where.map(w => dayOf[w] || 1)); let k = 0; p.trips.forEach((t, i) => { if(t <= day) k = i; }); return k; };
    secs = p.trips.map((t, k) => ({ title: `${k + 1}차 장보기`, sub: `· ${t}일`,
      groups: a.groups.map(g => ({ cat: g.cat, items: g.items.filter(it => tripOf(it) === k) })).filter(g => g.items.length) }));
  }
  $('cats').innerHTML = secs.map(sec => (sec.title ? `<div class="lsec">${sec.title}<span>${sec.sub}</span></div>` : '') +
    sec.groups.map(g => `
    <section class="cat">
      <h2><span class="ic"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" style="color:var(--ink)">${ICONS[g.cat] || ''}</svg></span>
        <span class="n">${esc(g.cat)}</span><span class="c">${g.items.length}가지</span></h2>
      ${g.items.map(it => `
        <div class="row${done[it.name] ? ' done' : ''}">
          <button class="nmb" data-n="${esc(it.name)}" aria-label="${esc(it.name)} 요리별 양 보기">
            <span class="nm">${esc(it.name)}</span>
            ${it.used >= 2 ? `<span class="ov">${it.used}끼</span>` : ''}
            <span class="qt">${esc(it.qty)}</span>
          </button>
          <button class="ckb" data-n="${esc(it.name)}" aria-label="${esc(it.name)} 샀어요"><span class="ck">${CHECKI}</span></button>
        </div>`).join('')}
    </section>`).join('')).join('') +
    (have.length ? `<details class="have"><summary>집에 있다고 본 것 ${have.length}가지</summary><p>${have.map(esc).join(' · ')}</p></details>` : '');
}
$('back').onclick = () => go('plan');
// 체크 원은 체크, 이름 영역은 요리별 양. 둘은 다른 버튼이다.
$('cats').onclick = e => {
  const c = e.target.closest('.ckb');
  if(c){ const n = c.dataset.n, done = doneBy[fid]; done[n] = !done[n]; saveDone(); c.closest('.row').classList.toggle('done', done[n]); return; }
  const b = e.target.closest('.nmb'); if(b) ingSheet(b.dataset.n);
};
function ingSheet(n){
  const it = L.groups.flatMap(g => g.items).find(x => x.name === n); if(!it) return;
  openSheet(`<h3>${esc(it.name)} ${esc(it.qty)}</h3><p class="sub">요리마다 이만큼씩 들어가요. 살 양은 넉넉히 올림한 값이에요</p>` +
    it.by.map(b => `<div class="lk"><span>${esc(b.dish)}</span><span class="q">${esc(fmtR(b.v, b.u) || b.q)}</span></div>`).join(''));
}

/** 공유 — 체크한 건 이미 산 것이니 빼고, 남은 것만 보낸다. 기기 공유 시트 → 클립보드 → 텍스트 상자 순으로 물러난다. */
function shareText(){
  const f = folder(), ds = dishesOf(f), done = doneBy[f.id] || {};
  const left = L.groups.map(g => ({ cat: g.cat, items: g.items.filter(it => !done[it.name]) })).filter(g => g.items.length);
  const n = left.reduce((a, g) => a + g.items.length, 0);
  const src = new Map(); ds.forEach(d => { const s = d.vid ? '유튜브' : d.source; src.set(s, (src.get(s) || 0) + 1); });
  const body = left.map(g => `[${g.cat}]\n` + g.items.map(it => `· ${it.name} ${it.qty}`).join('\n')).join('\n\n');
  return { n, text: `${f.name} — ${spanOf(f)} · ${peopleLabel(f)}\n살 것 ${n}가지\n\n${body}\n\n` +
    `요리 · ${ds.map(d => d.name).join(' · ')}\n레시피 출처 · ${[...src].map(([x, c]) => x + ' ' + c).join(' · ')}\n보글 · BOGL°` };
}
$('share').onclick = async () => {
  const { n, text } = shareText();
  if(!n) return toast('전부 담으셨어요');
  if(navigator.share){ try{ await navigator.share({ title: '장볼 것 ' + n + '가지', text }); return; }catch(e){ if(e.name === 'AbortError') return; } }
  try{ await navigator.clipboard.writeText(text); toast('장볼 것 ' + n + '가지 복사했어요'); return; }catch(e){}
  openSheet(`<h3>장볼 것 ${n}가지</h3><p class="sub">전체 선택해서 가져가세요. 체크한 건 빠져 있어요.</p><textarea readonly>${esc(text)}</textarea>`);
  box.querySelector('textarea').select();
};
$('find').onclick = () => {
  const done = doneBy[fid] || {};
  const items = L.groups.flatMap(g => g.items).filter(it => !done[it.name]);
  if(!items.length) return toast('전부 담으셨어요');
  openSheet(`<h3>쿠팡에서 찾기</h3><p class="sub">재료마다 검색으로 열려요. 상품을 저장해 두지 않아서 품절이나 단종으로 링크가 끊기지 않습니다.</p>` +
    items.map(it => `<a class="lk" target="_blank" rel="noopener" href="https://www.coupang.com/np/search?q=${encodeURIComponent(it.name)}">
      <span>${esc(it.name)}</span><span class="q">${esc(it.qty)}</span>${ARROW}</a>`).join(''));
};

/* ── 진입. 공유(share_target)나 `?u=` 로 유튜브 링크가 들어오면 바로 링크 시트로 — 계획을 고르게 하지 않는다. */
(function entry(){
  renderHome();
  const q = new URLSearchParams(location.search);
  const raw = q.get('u') || q.get('url') || q.get('text') || '';
  if(!ytId(raw) && !ytList(raw)) return;
  history.replaceState({}, '', location.pathname);
  linkSheet((raw.match(/https?:\/\/\S+/) || [raw])[0]);
})();
</script>
