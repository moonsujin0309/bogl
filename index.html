 으깬다."},{"d":"찬밥, 양파, 당근, 실파, 두부를 섞고 콩가루와 계란을 넣은 뒤 소금과 후춧가루로 간을 맞춘다."},{"d":"프라이팬에 기름을 두르고 둥글게 지진다."}],"호박양파국":[{"d":"호박은 0.5cm 두께로 반달썰기한다."},{"d":"양파도 같은 굵기로 채썰어 둔다."},{"d":"두부는 크지않게 네모지게 썰어둔다."},{"d":"대파, 홍고추를 어슷하게 썰어둔다."},{"d":"기름을 두르지 않고 볶은 국멸치를 한소끔 끓인 물에 된장 한 큰술을 덩어리가 지지 않도록 잘 풀어준다."},{"d":"⑤가 끓기 시작하면 호박, 양파, 두부를 차례대로 넣어준다."}],"고등어양념구이":[{"d":"고등어를 머리, 꼬리와 내장을 제거하고 손질한 후, 포를 떠서 뼈를 발라낸다.","t":"양념장 : 간장 3큰술, 굵은 고춧가루 2큰술, 고운 고춧가루 1큰술, 대파 1개, 양파 1개, 실파 3~4뿌리, 홍고추 2개, 청고추 2개, 정종 2큰술, 생강 1개, 마늘 5개, 참기름 2작은술, 깨소금 1큰술, 물엿 2큰술"},{"d":"양념장을 만들어 고등어를 12시간 재운 후 석쇠에 굽는다."},{"d":"구울 때 양념장을 발라 가면서 굽는다."},{"d":"센 불에 구우면 생선이 완전히 익지 않으므로 중, 약불에 구워낸다."}],"김치볶음밥":[{"d":"김치는 1cm 크기로 썰고 햄, 양파, 감자도 1cm 정도의 크기로 잘게 썬다."},{"d":"프라이팬에 기름을 두르고 김치와 감자를 볶다가 햄과 양파를 넣고 볶아준다."},{"d":"양파가 어느 정도 익으면 밥을 넣고 펴듯이 볶아준다."},{"d":"소금과 후춧가루로 간을 맞추고 계란프라이를 얹어 낸다."}],"청국장찌개":[{"d":"쇠고기는 기름기 없는 것으로 얇게 저며 썰고 잘 익은 배추김치는 속을 털어내고 먹기 좋게 썬다."},{"d":"대파는 어슷썰고 무와 두부는 납작하게 썰어놓는다."},{"d":"냄비에 쇠고기, 김치, 무를 넣고 김치국물을 조금 넣어 볶다가 반 정도 익으면 물 4컵을 부어 끓인다."},{"d":"고기가 익으면 청국장을 풀고 끓을 때 다진 마늘을 넣는다."},{"d":"③을 뚝배기에 옮겨 담고 한소끔 끓이다가 대파와 두부를 넣는다."},{"d":"상에 내기 직전에 소금으로 간을 맞춘 뒤 불에서 내린다."}],"조기찜":[{"d":"조기는 비늘을 긁고 배를 갈라 내장과 아가미를 꺼내고 지느러미도 잘라 낸 다음 찬물에 씻는다."},{"d":"무와 감자는 큼직하게 썬다."},{"d":"양파는 한입 크기로 썰고 청고추, 홍고추, 대파는 어슷하게 썬다."},{"d":"마늘 2쪽은 얇게 썰고 나머지는 다진다. 손질된 채소에 고추장, 고춧가루, 생강즙, 참기름, 소금, 후춧가루를 넣어 섞는다."},{"d":"분량의 양념장을 만든다."},{"d":"냄비 바닥에 무와 감자, 조기를 넣고 준비한 양념장의 1/2과 물 1컵을 넣어 끓인다."}],"호박무침":[{"d":"둥근 호박을 반으로 잘라 속을 모두 긁어 파낸다."},{"d":"속을 파낸 호박을 가늘게 채쳐준다."},{"d":"끓는 물에 살짝 데쳐준다.","t":"호박을 데칠 때 소금을 넣어주면 녹색이 선명해 진다."},{"d":"데친 호박의 물기를 짜낸 후 큰 볼에 담는다."},{"d":"양파와 대파, 고추를 잘게 썰어 볼에 넣는다."},{"d":"호박이 담긴 볼에 양념을 넣고 잘 무쳐준다.","t":"취향에 따라 소금과 설탕의 양을 조절한다."}],"가지쇠고기볶음":[{"d":"가지는 반으로 가른 후 어슷하게 저며 썰고, 대파는 어슷하게 썬다."},{"d":"고추는 물에 헹궈 씨를 뺀 후 어슷하게 썬다."},{"d":"쇠고기는 기름이 적당하게 섞인 등심으로 준비해 얇게 저며 썬 후 청주, 후춧가루로 밑간한다."},{"d":"달군 프라이팬에 기름을 두르고 ②의 쇠고기를 넣어 볶는다."},{"d":"③의 쇠고기가 알맞게 익으면 기름을 넉넉하게 넣고 ①의 가지와 고추를 넣어 간장, 다진 파, 다진 마늘, 소금, 후춧가루로 간하여 볶는다."},{"d":"깨소금, 참기름으로 마무리한 뒤 접시에 담아낸다."}],"콩나물무밥":[{"d":"쌀은 씻어 건져 놓는다.","t":"* 돼지고기 양념장  간장 1큰술, 설탕 1작은술, 마늘 1작은술, 참기름약간, 후추약간"},{"d":"콩나물은 통통한 것으로 다듬어 씻어 놓는다."},{"d":"돼지고기는 살코기로 준비해 4~5㎝ 길이로 굵게 채썬다."},{"d":"무는 깨끗이 씻어서 폭 0.5㎝ 길이 4~5㎝ 길이로 굵게 채썬다."},{"d":"취나물은 끓는 물에 소금을 조금 넣고 데쳐서 찬물에 1시간 정도 담가 쓴맛을 우려낸다. 여러번 헹군 뒤 물기를 꼭 짜서 4㎝ 길이로 썬다."},{"d":"돼지고기에 양념을 해서 프라이팬에 볶아 놓는다."}],"부추잡채":[{"d":"양파, 홍고추, 청고추는 얇게 채를 썰어 준비한다."},{"d":"돼지고기는 얇게 채를 썰어 마늘, 생강, 굴소스, 깨소금을 넣고 양념해둔다."},{"d":"부추는 4cm 길이로 썰어 준비한다."},{"d":"재료가 준비되면 프라이팬에 기름을 두르고 양념한 돼지고기를 볶는다."},{"d":"돼지고기를 볶다가 양파, 고추를 넣고 소금을 뿌려 간을 한다."},{"d":"채소가 어느 정도 숨이 죽으면 준비한 부추를 넣어 살짝 볶은 후 참기름 한방울을 넣어 마무리한다."}],"버섯청국장찌개":[{"d":"팽이버섯은 뿌리 부분을 자른 뒤 작은 덩어리로 나누고, 느타리버섯은 끓는 물에 데쳐 물기를 꼭 짠 다음 먹기 좋은 크기로 쭉쭉 찢는다."},{"d":"양송이버섯은 깨끗이 씻어 밑동 끝의 지저분한 부분을 잘라내고 껍질을 벗긴 다음 모양을 살려 썬다."},{"d":"호박과 두부는 도톰하게 썰고, 굵은 파와 고추는 어슷하게 썰어서 씨를 털어낸다."},{"d":"뚝배기에 쌀뜨물을 부어 끓으면 청국장을 푼 다음 한소끔 끓인다."},{"d":"국물이 보글보글 끓으면 손질한 양송이버섯, 느타리버섯, 두부, 호박, 홍고추를 넣고 다시 한번 끓인다."},{"d":"청국장이 한소끔 끓으면 굵은 파, 청고추, 다진 마늘을 넣고 살짝 끓인 후 마지막에 팽이버섯을 넣고 불에서 내려 상에 낸다."}],"순두부찌개":[{"d":"바지락은 소금물에 담가 해감한다. 해감한 조개는 냄비에 물을 붓고 끓여 입이 벌어지면 조개는 건져내고 국물은 체에 걸러 놓는다.","t":"두부를 만드는 과정에서 콩의 단백질이 몽글몽글하게 응고되었을 때 압착하지 않고 그대로 먹는 것을 순두부라 한다"},{"d":"돼지고기는 기름을 떼서 저며썰고 배추김치는 속을 털어내고 잘게 썬다."},{"d":"양파는 반으로 갈라 채썰고 굵은 파는 어슷썬다."},{"d":"냄비에 기름을 두르고 김치, 돼지고기, 양파, 다진 마늘, 고춧가루를 넣어 볶다가 조갯국물을 넣고 끓인다."},{"d":"돼지고기와 김치가 익으면 뚝배기에 옮겨 담고 숟가락으로 순두부를 뚝뚝 떠 넣는다."},{"d":"바지락과 굵은 파를 넣고 한소끔 끓으면 소금, 후춧가루를 넣어 간을 맞춘다."}],"두부채소냉채":[{"d":"두부는 1cm 정도의 두께로 썰어 깨끗한 행주로 물기를 제거한 후 소금으로 약하게 간하여 프라이팬에 노릇하게 지져낸다."},{"d":"지져낸 두부는 열기를 식혀 냉장고에 차게 보관한다."},{"d":"쇠고기는 편육용으로 삶아 식힌다. (삶을 때는 쇠고기의 냄새를 없애기 위해 마늘, 통후추 등을 소량 넣어 준다)"},{"d":"양배추, 오이, 당근, 쇠고기, 두부는 길이 5cm, 넓이 2cm 정도의 막대모양으로 썬다."},{"d":"땅콩가루 1큰술, 식초 1큰술, 간장 1/2큰술, 갠겨자 1/2큰술, 황설탕 1/2큰술, 소금, 참기름약간을 믹서기에 넣고 곱게 갈아 땅콩겨자소스를 만들어 차게 보관해 둔다."},{"d":"접시에 위의 재료를 보기좋게 담은 후 땅콩겨자소스를 곁들여 낸다."}],"오징어볶음과소면":[{"d":"오징어는 배를 갈라 내장과 다리를 떼어낸 뒤, 겉면의 껍질을 위에서 아래로 벗긴다. 미끌거려서 잘 벗길 수 없으면 굵은 소금을 뿌리거나 종이 타월로 껍질을 붙잡고 벗기면 손쉽다."},{"d":"오징어를 깨끗이 씻은 뒤, 안쪽에 사선으로 교차되게 칼집을 촘촘히 넣은 후 폭 1cm, 길이 4cm 크기의 길쭉한 네모로 썬다."},{"d":"양파, 양배추, 당근은 굵게 채썰고 청고추, 홍고추는 어슷썰어 씨를 털어낸다."},{"d":"볼에 손질한 오징어와 채소를 담은 뒤, 매운 볶음 양념장을 넣어 간이 고루 배도록 주물러 10분 정도 재운다."},{"d":"팬을 달구어 기름을 두른 뒤, 양념한 오징어와 채소를 한꺼번에 넣어 센불에서 재빨리 볶는다."},{"d":"오징어가 솔방울 모양으로 오그라들면서 익으면 꺼낸 뒤, 그릇에 담고 통깨를 넉넉히 뿌린다."}],"잔치국수":[{"d":"찬물에 멸치를 넣고 끓여 멸칫국물을 우려내고 국간장이나 소금으로 간을 해 멸치장국을 만들어준다."},{"d":"쇠고기는 불고기양념을 해서 재워 두었다가 팬에 국물없이 볶아낸다."},{"d":"호박, 당근도 채썰어 소금 간을 해서 볶아주고 계란은 지단을 부쳐 채썬다."},{"d":"분량의 양념재료를 섞어 매콤한 양념장을 만들어준다."},{"d":"소면은 물에 삶아 건져서 찬물에 헹군 다음 1인분씩 사리지어 놓는다."},{"d":"국수대접에 사리지은 소면을 담고 멸치장국을 부어 준비한 고명을 골고루 얹고 양념장을 곁들여 낸다."}],"모듬전":[{"d":"(감자전) 감자는 깨끗하게 씻고 껍질을 벗겨 1/2은 곱게 채썰고, 1/2은 강판에 곱게 갈아 냉수에 15분정도 담가둔다."},{"d":"전분을 빼낸 ①을 고운 거즈에 싸서 꼭 짠 뒤 밀가루와 소금을 넣고 섞는다. 반죽이 되면 물을 조금씩 섞어주고 1cm 길이로 썬 부추도 같이 넣어 섞어준다."},{"d":"반죽에 소금과 참기름을 조금 넣어 간을 맞춘뒤 팬에 식용유를 조금 두르고 한 숟가락씩 떠서 5cm 정도의 크기로 둥글게 만든다. 불을 약하게 하여 노릇하게 지져낸다."},{"d":"(양파전) 양파는 껍질을 말끔히 벗긴 뒤 0.5cm 두께로 둥글게 썰고 쇠고기는 곱게 다져서 소금, 참기름, 후춧가루로 밑간한다."},{"d":"양파의 중심부를 떼어내 링 모양으로 만든 뒤 링의 안쪽에 밀가루를 살짝 바르고 양념한 쇠고기를 양파 가운데의 빈 곳에 채워 넣는다. 위로 올라오게 채우면 익으면서 더 많이 올라오게 되므로 약간 납작한 듯이 채우도록 한다."},{"d":"전체적으로 밀가루를 묻힌 뒤 털어내고 계란물에 담갔다가 건져내어 팬에 식용유를 두르고 지진다."}],"채소국수":[{"d":"오이는 두께 0.3cm x 폭 0.3cm, 길이 5cm로 채썰어 소금에 절였다가 물기를 짠다.","t":"**쇠고기, 표고버섯 양념장: 간장 2작은술, 설탕 1/2작은술, 다진 파 1/2작은술, 다진 마늘 1/2작은술, 후춧가루 약간, 깨소금 약간, 참기름 약간  **양념간장 : 고춧가루 1큰술, 간장 1큰술, 다진 마늘 1작은술, 다진 파 1작은술, 깨소금 약간, 참기름 약간      * 양념간장"},{"d":"쇠고기는 두께와 폭이 0.3cm, 길이 5cm로 썰어 양념한다."},{"d":"표고도 물에 불려 쇠고기와 같은 크기로 채썰어 양념한다."},{"d":"부추는 잘 씻어 5cm 길이로 잘라둔다."},{"d":"계란은 노른자와 흰자를 분리하여 지단을 붙이고 채썰어 둔다."},{"d":"번철에 오이, 표고, 쇠고기순으로 볶는다."}],"순대볶음":[{"d":"프라이팬에 기름을 두르고 다진 마늘을 볶다가 양파, 양배추를 볶는다."},{"d":"양배추에 기름이 돌면 분량의 양념과 쫄면 혹은 더운 물에 불린 당면을 넣고 볶는다."},{"d":"마지막으로 순대와 깻잎을 넣고 볶아낸다."}],"콩나물국밥":[{"d":"뚝배기에 한 사람이 먹을 만큼의 밥을 담고 콩나물은 씻어 삶아 밥이 덮일 만큼 수북이 얹는다."},{"d":"①위에 어슷썬 실파와 청고추, 결대로 찢은 장조림을 보기 좋게 둘러 얹고, 그 위에 잘게 썬 김치와 다진 마늘을 얹는다."},{"d":"재료를 넣은 뚝배기에 육수를 자작하게 부어 보글보글 끓이다가 상에 내기 직전에 살짝 구운 김을 비벼 얹고 생계란을 깨뜨려 얹은 다음 깨소금을 뿌린다."},{"d":"새우젓을 따로 곁들여 식성대로 간을 맞춰 먹는다."}],"김치적":[{"d":"김치는 소를 털어내고 줄기만 길이 8cm, 너비 2cm로 썰어 참기름을 고루 묻힌다."},{"d":"쇠고기는 도톰하게 포를 떠 잔칼질하여 김치보다 약간 길게 썬다."},{"d":"표고버섯은 1cm 폭으로 썰고 도라지는 삶아서 반으로 갈라 참기름과 소금으로 무친다."},{"d":"준비된 재료를 꼬치에 꽂아 밀가루를 묻힌 후 계란물을 묻혀 기름에 지진다."}],"갈치조림":[{"d":"갈치를 깨끗이 손질하여 알맞은 크기로 잘라 놓는다.","t":"양념장 만들기 : 간장 2큰술, 굵은고춧가루 2큰술, 고운고춧가루 1큰술, 설탕 1큰술, 물엿 2큰술, 다진생강 2작은술, 다진마늘 1큰술, 정종 1큰술, 된장 2작은술, 후춧가루 약간, 소금 약간"},{"d":"채소는 길이 4~5cm, 두께 2.5cm 정도로 얇게 썰어 보기 좋게 놓는다."},{"d":"그 위에 생선을 얹고 양념장을 뿌려 중, 약불에 끓인다."},{"d":"끓인 후, 홍고추와 청고추로 장식한다."}],"매운가지볶음":[{"d":"가지를 깨끗하게 씻어 반으로 갈라 어슷썰기를 한다."},{"d":"양파는 채 썰고, 대파와 고추는 어슷하게 썬다."},{"d":"달궈진 팬에 양파를 반투명 해질 때 까지 볶다가 가지와 양념을 넣고 볶는다."},{"d":"가지가 거의 익어 가면 고추와 대파를  넣어 볶아준다."}],"양송이버섯죽":[{"d":"찹쌀을 2시간 정도 불린다."},{"d":"양송이버섯은 껍질을 벗기고 모양을 살려서 썬다."},{"d":"호박, 당근, 실파, 깻잎은 깨끗이 씻은 후 3㎝ 길이로 채썬다."},{"d":"불린 찹쌀은 방망이로 쌀알이 1/2정도가 되도록 부순다."},{"d":"냄비에 참기름을 두르고 ④를 볶다가 물을 붓고 끓인다."},{"d":"쌀알이 퍼지면 썰어 놓은 채소를 넣고 한번 더 끓여 소금으로 간한다."}],"참치김치찌개":[{"d":"김치는 속을 털어내고 4cm 길이 정도로 썬다."},{"d":"참치는 체에 밭쳐 기름기를 제거한다."},{"d":"양파, 대파, 홍고추, 청고추는 적당하게 어슷썬다."},{"d":"두부는 0.5cm 두께로 져며낸다."},{"d":"냄비에 참기름을 두르고 김치, 양파를 볶다가 물을 넣는다."},{"d":"⑤가 한소끔 끓으면 참치를 넣어준다."}],"찬밥전":[{"d":"양파, 당근은 곱게 다지고 청, 홍고추는 씨를 제거한 후 곱게 다지고 실파는 송송 썬다."},{"d":"참치는 체에 밭쳐 기름을 제거한 후 곱게 으깨어 놓는다."},{"d":"유리볼에 찬밥과 다진 양파, 당근, 청, 홍고추, 실파와 분량의 계란물, 밀가루, 소금, 후춧가루를 넣어 재료들이 잘 섞이도록 반죽을 한다."},{"d":"후라이팬에 기름을 두르고 뜨거워지면 ③을 한 수저씩 떠 놓는다."},{"d":"④를 둥글게 모양을 만들어 앞 뒤로 노릇하게 지진다."}],"주먹밥":[{"d":"다진 쇠고기는 분량의 양념을 한 뒤 프라이팬에 식용유를 두르고 볶아낸다."},{"d":"토마토는 8등분하여 두고 당근과 피망을 잘게 다진다."},{"d":"당근과 피망을 쇠고기와 함께 볶다가 밥을 넣고 볶으면서 소금과 후춧가루로 간을 한다."},{"d":"하트모양 틀에 볶아낸 밥을 60g씩 떠서 채운 뒤 모양을 만들어 떼어낸다."},{"d":"도시락 밑에 상추를 깔고 밥을 담아 사이사이에 토마토를 놓은 뒤 가운데에 파슬리를 올린다."}],"김치동그랑땡":[{"d":"김치는 곱게 다진다."},{"d":"감자는 삶아서 체에 내리고 두부는 물기를 짠 뒤 으깬다."},{"d":"당근,피망은 다진다."},{"d":"준비된 재료에 밀가루, 계란, 다진마늘, 소금, 후춧가루를 섞는다."},{"d":"프라이팬에 식용유를 두르고 반죽을 한 숟가락씩 떠서 노릇하게 지진다."}],"달래굴파전":[{"d":"달래는 깨끗이 손질하여 3cm 길이로 썰어둔다."},{"d":"굴은 껍질을 제거하고 소금물에 살살 비벼 씻은 후 깨끗한 물에 헹구어 물기를 제거한다."},{"d":"청, 홍고추는 얇고 둥글게 썰어 물에 씻어 씨를 털어낸다."},{"d":"큰 볼에 밀가루 1컵, 계란 1개, 물 2/3컵을 넣어 밀가루가 응어리지지 않게 잘 섞는다."},{"d":"4번 반죽에 손질한 달래, 굴, 고추, 실파 등을 넣어 잘 섞은 후 소금으로 간을 심심하게 맞춘다."},{"d":"팬에 기름을 넉넉히 두르고 ⑤의 재료를 한숟가락씩 펴서 평평하게 지져낸다."}],"닭가슴살해파리샐러드":[{"d":"닭가슴살은 끓는물에 삶은 뒤 손으로 먹기좋게 찢어놓는다."},{"d":"해파리는 소금기를 씻어내고 끓는물에 삶아서 찬물에 식힌 후 설탕 2큰술, 소금 약간, 식초 2큰술, 물 8큰술을 섞어  담가둔다."},{"d":"홍고추, 청고추는 잘게 썰어놓는다."},{"d":"그릇에 물 3큰술, 식초 4큰술, 참기름 1작은술, 간장 1작은술, 소금 약간, 설탕 2큰술, 꿀 2큰술, 홍고추, 청고추를 넣고 잘 섞어 소스를 만든다."},{"d":"오이와 레몬은 편으로 얇게 썰어놓는다."},{"d":"④의 소스에 찢어놓은 닭가슴살과 해파리를 묻힌 후 접시에 오이를 깔고 그 위에 담아낸다."}],"대대로닭칼국수":[{"d":"날콩가루(50g)를 곱게 갈아 밀가루와 합하여 반죽을 한 후 젖은 면보에 싸둔다."},{"d":"닭과 닭발, 통파, 생강을 넣어 무르게 끓인 닭육수를 준비한다."},{"d":"①의 반죽을 밀가루를 뿌려가면서 얇게 밀어 돌돌만 후 곱게 채썬다."},{"d":"채썬 반죽은 밀가루를 뿌린 쟁반에 둔다."},{"d":"②의 닭이 익으면 건져 뼈를 발라내고 닭살은 찢어둔다."},{"d":"①의 콩가루보다는 굵게 갈은 콩을 ⑤의 닭살과 섞는다.(콩가루 50g)"}],"붉은갓동치미":[{"d":"무는 1cm x 3cm 정도로 썰어 굵은 소금에 1시간정도 절인다. 썰고 남은 자투리는 버리지 않는다."},{"d":"붉은 갓은 무와 같은 길이로 썰어 씻어둔다."},{"d":"절인 무는 씻은 다음 물기를 빼 놓는다."},{"d":"물 2.5리터를 미리 준비한다."},{"d":"배 1/4개, 양파, 마늘, 생강, 자투리 무를 물 약간과 함께 넣고 믹서에 곱게 간다."},{"d":"체에 고운 보자기를 놓고 ②를 놓고 물로 거른다."}],"전어회무침":[{"d":"전어는 비늘을 제거하고 머리, 지느러미, 꼬리, 내장을 깨끗이 제거한다.","t":"전어는 비늘과 내장, 피를 완전히 제거하면 비린내가 전혀 나지 않으니 깨끗이 제거한다."},{"d":"손질한 전어를 흐르는 물에 깨끗이 씻은 후 물기를 완전히 제거한다."},{"d":"무는 가늘게 채썰고, 미나리는 5cm 길이로 자른다."},{"d":"양파는 굵게 채썰고 청고추는 어슷썬다."},{"d":"콩가루, 고춧가루, 식초, 고추장, 다진 마늘, 설탕을 넣어 양념장을 만든다."},{"d":"②의 전어를 통채 먹기좋은 크기로 썬 후 ③과 ④를 넣고 ⑤의 양념장을 넣고 무친다."}],"해장라면":[{"d":"배추김치는 속을 털어 1cm 폭으로 송송 썰고 표고버섯은 미지근한 물에 불린 후 가늘게 채썬다."},{"d":"콩나물은 깨끗이 씻어 건지고, 당근은 껍질을 벗겨 가늘게 채썰고 대파, 홍고추, 청고추는 어슷썬다."},{"d":"햄은 5cm 길이로 가늘게 채썰고, 게맛살은 5cm 길이로 잘라 손으로 가늘게 찢는다."},{"d":"끓는 물에 라면과 당근, 콩나물을 넣고 뚜껑을 덮어 끓이다 한소끔 끓으면 라면수프와 고춧가루를 풀고 햄, 게맛살, 파, 고추, 다진 마늘을 넣고 뜸들인다."},{"d":"재료가 다 익으면 그릇에 담아 낸다."}],"오징어삼겹살볶음":[{"d":"옥수수통조림은 체에 받쳐 물기를 빼놓는다."},{"d":"오징어는 깨끗이 씻어 껍질을 벗기고, 몸통에 안쪽으로 사선으로 칼집을 넣는다."},{"d":"삼겹살은 먹기 좋은 크기로 썰어 놓는다."},{"d":"실파는 4cm 길이로 썰어 놓고, 청고추, 홍고추는 송송 썰어 놓으며 양파는 채썰어 놓는다."},{"d":"위의 재료를 모두 섞고 양념을 분량대로 넣어 버무려주고, 프라이팬에 물기 없이 볶아 낸다."}],"가지된장찜":[{"d":"가지는 길이 5cm 정도로 토막내어 반으로 잘라 소금물에 절여 물기를 제거한다."},{"d":"물기를 제거한 가지에 밀가루를 솔솔 뿌려둔다."},{"d":"냄비에 식용유를 두르고 다진 돼지고기를 볶아준다."},{"d":"잘게 썬 멸치, 양파, 청고추, 홍고추, 파, 마늘을 ③과 같이 볶다가 된장, 물을 넣어준다."},{"d":"④가 끓기 시작하면 ①의 가지를 넣고 뚜껑을 덮어 간이 충분히 배도록 오래 찐 후 마지막에 참기름을 넣어 향을 낸다."}],"골뱅이무침":[{"d":"골뱅이는 체에 밭쳐 물기를 뺀 다음 먹기 좋게 반으로 썬다.","t":"무침 요리의 맛은 바로 양념에 있다.  우리나라 무침 요리의 대표격인 나물류에 들어가는 양념으로는 대개 간장, 참기름, 깨소금, 파, 마늘, 설탕, 후춧가루등이 있다.  양념을 넣는 순서도 중요하지만, 더욱 중요한 점은 맛이 진한 참기름과 후춧가루는 맨 나중에 넣어야 다"},{"d":"오이는 두께 0.5cm 통으로 썬다."},{"d":"대파와 당근은 두께 0.2cm, 가로x세로 0.2cm X 4cm 로 썬다."},{"d":"양파는 두께 0.5cm로 채썬다."},{"d":"샐러리는 두께 0.2cm 통으로 썬다."},{"d":"양념 재료를 섞어둔다."}],"갈치무조림":[{"d":"갈치는 토막내 비늘을 벗기고 칼집을 넣어 준비하며, 대파와 홍고추는 어슷썰고, 마늘은 편썰어 준비한다."},{"d":"무는 큼직하게 나박썰어 냄비 바닥에 깔아 준비한다."},{"d":"그릇에 분량의 양념 재료를 넣고 준비한 파와 마늘을 고루 섞는다."},{"d":"냄비에 깔아 둔 무 위에 갈치를 얹고, 그 위에 ③의 양념장을 얹어 물을 자작하게  부어 끓인다."},{"d":"15분간 끓이다가 국물이 졸아들면 뚜껑을 열고 파와 고추를 넣은 후 참기름을 넣어 불에서 내린다."}],"나박김치":[{"d":"무는 나박썰기하고 배추는 속대만 골라 무와 같은 크기로 썰고 따로 소금에 절인다. 30분 정도 절인 뒤 한 번 뒤집어 준다.","t":"나복저(蘿 菹)라고도 한다. 무를 얄팍하고 네모지게 썰어서 소금에 절였다가 건져서 고춧가루로 빨갛게 물들인 다음, 파 ·마늘 ·생강 등의 양념을 넣고 미나리와 실고추를 썰어 넣어 익히면 무의 알싸한 맛이 국물에 베어 청량감을 맛볼 수 있다."},{"d":"미나리는 씻어 3cm 길이로 자르고 홍고추는 반으로 갈라 씨를 털고 채썬다."},{"d":"굵은 파, 생강, 마늘도 곱게 채썬다."},{"d":"큰 그릇에 물 20컵을 붓고 고춧가루 1/3컵을 거즈에 싸서 물에 담가 흔들어 고춧가루 물을 만든 뒤 소금간을 한다."},{"d":"절여진 배추와 무에 채썬 파, 마늘, 생강, 홍고추, 미나리를 섞어 고루 버무린다."},{"d":"잘 버무려진 나박김치를 항아리에 먼저 담고 삼삼하게 간을 한 김칫국을 부어 숙성시킨다."}],"김치수제비":[{"d":"냄비에 물을 붓고 멸치, 다시마를 넣어 끓기 시작하면 다시마는 건져내고 20분정도 멸치 물을 우려낸다."},{"d":"김치는 속을 털어낸 후 물기를 제거한 후 한 입 크기로 썰어놓는다."},{"d":"감자, 양파, 청고추, 대파는 적당히 먹기 좋게 썰어놓는다."},{"d":"밀가루에 계란, 식용유, 소금, 물을 넣고 수제비 반죽을 한다."},{"d":"①번 장국에 김치를 넣고 끓인 후 채소를 넣고 다시 끓어오르면 수제비를 떠서 넣는다."},{"d":"⑤번이 어느 정도 끓기 시작하면 간장으로 간을 맞춘다."}],"김치두부쌈":[{"d":"김치는 얇게 썰어둔다."},{"d":"두부는 끓는물에 데쳐 삼각모양으로 0.8cm 두께로 썰어 놓는다."},{"d":"돼지고기는 가제에 싸서 끓는물에 대파, 생강, 소금을 넣고 삶은 후 알맞게 썬다."},{"d":"접시에 돼지고기를 깔고, 두부를 돌려 담은 후 김치를 얹어 보기좋게 준비한다."},{"d":"쌈채소와 쌈장을 곁들이면 더욱 좋다."}],"제육겨자쌈":[{"d":"돼지고기 안심을 준비하여 대파, 통후추, 양파 등을 넣고 삶는다.","t":"**돼지고기는 냄새가 많이 나기때문에 향신료나 채소등을 넣어 삶아준다. 양겨자 대신 겨자가루를 물에 개어 대신 넣어주어도 좋다."},{"d":"당근, 양파, 깻잎은 5cm 정도로 채썰어 놓는다."},{"d":"양겨자 1/2큰술, 설탕 1/2작은술, 소금 약간, 식초 1/4 작은술로 양념장을 만들어 ②번을 섞어준다."},{"d":"삶은 돼지고기는 한 입 크기로 준비하여 ③의 채소를 넣어 마주보게 한다.(샌드위치모양으로 겹쳐지게 한다.)"}],"별미밥":[{"d":"다진 쇠고기는 간장 1큰술, 설탕 1/2작은술, 마늘 1작은술, 후춧가루, 참기름에 양념하여 프라이팬에 기름을 두르고 볶아 놓는다."},{"d":"콩나물은 꼬리를 떼고 깨끗이 다듬어 끓는 소금물에 데친다."},{"d":"당근은 껍질을 벗겨 곱게 채썰고 미나리도 같은 길이로 잘라 뜨거운 프라이팬에 기름을 두르고 소금 간을 하며 볶는다."},{"d":"유부는 끓는 물에 데쳐 기름을 빼고 채썰어 소금, 참기름에 무쳐 놓는다."},{"d":"고슬하게 지은 밥을 그릇에 적당히 담아, 볶아 놓은 모든 재료를 색 맞추어 올리고 분량의 양념 재료를 넣어 양념장을 곁들여 낸다."}],"콩나물잡채":[{"d":"깨끗이 다듬은 콩나물은 냄비에 안치고 소금을 조금 넣은 후 물 1컵을 붓고 삶는다. 7분 정도 지나면 체에 밭쳐 물기를 뺀다."},{"d":"물에 불린 표고와 쇠고기는 채썰어 갖은 양념(간장, 설탕, 다진 파, 마늘, 후춧가루, 깨소금) 한다."},{"d":"미나리는 다듬어 5cm 길이로 썰어 놓는다."},{"d":"양파와 당근은 채썰어 소금에 절여놓고 계란은 풀어 지단을 부쳐 채썬다."},{"d":"당근, 미나리를 각각 볶아내고 양념해둔 표고와 쇠고기도 볶는다."},{"d":"삶은 콩나물에 참기름 1/2큰술과 소금으로 무친다."}],"맑은대구탕":[{"d":"토막 낸 생대구를 깨끗한 물에 한번 씻은 후 체에 밭쳐 물기를 뺀다.","t":"* 대구를 넣어 끓어오르기 시작하면 국물에서 불순물이 나오므로 가끔씩 제거해준다.  * 오래 끓이면 ？은맛이 나오기 때문에 다시마를 넣고 오래 끓이지 않도록 한다."},{"d":"마늘은 다지고 대파, 홍고추, 청고추는 어슷하게 썰고 두부는 적당한 크기로 썰어 준비한다."},{"d":"냄비에 물 3컵을 담아 다시마를 넣고 살짝 한번 끓인 후 가쓰오브시를 넣어 10분 후에 걸른 후 국물을 우려낸다."},{"d":"③의 국물이 끓어오르기 시작하면 ①의 손질한 대구를 넣어 한소끔 끓인 후 소금으로 간을 맞춘다."},{"d":"대구의 시원한 맛이 어느정도 우러나오면 두부, 마늘, 홍고추, 청고추, 팽이버섯, 미나리 등을 넣어 마무리 한다."}],"동치미막국수":[{"d":"쇠고기는 채썰어 분량의 재료로 갖은양념하여 약간 재웠다가 팬에 볶는다."},{"d":"오이는 가늘게 채썰어 소금에 절였다가 물기를 꼭 짜고 살짝 볶아 식힌다."},{"d":"동치미무는 반달모양으로 얄팍하게 썰어 깨소금과 참기름으로 무친다."},{"d":"국수는 넉넉한 끓는 물에 삶아 찬물에 헹구어 건져 1인분씩 사리지어 놓는다."},{"d":"그릇에 국수를 담고 고기채, 오이채, 동치미무, 계란지단채, 붉은 고추채를 얹어 동치미 국물을 가만히 붓는다"}],"명란젓찌개":[{"d":"마늘은 얇게 편으로 썰고, 무는 1.5cm x 1.5cm 크기로 나박썰기 하고, 두부도 같은 크기로 썰어 둔다.","t":"**명란은 익으면 표피가 줄어들고 단단해지므로 반드시 칼집을 넣어 사용한다. 명란을 끓일 때 강한 불에서 끓이면 알이 터지고 딱딱해지므로 중간불에서 끓인다. 명란 자체에서 맛있는 국물이 베어나오도록 불을 끄고 10~20분쯤 둔 다음 소금으로 간을 맏춘다(시중에서 판매"},{"d":"명란은 길이로 칼집을 낸 뒤 3~4등분한다."},{"d":"홍고추와 대파는 어슷 썰어 놓는다."},{"d":"뚝배기에 무, 마늘, 물을 넣고 끓이다가 무가 익으면 불을 줄이고 두부를 먼저 넣은 뒤 명란을 넣는다."},{"d":"중간불에서 가열하다 명란의 속이 하얗게 익으면 불을 끄고 뚜껑을 덮은 채 그대로 둔다."},{"d":"먹기 직전에 고추와 간장, 파, 소금을 넣고 한소끔 더 끓여낸다."}],"닭꼬치구이":[{"d":"닭은 중간크기의 것으로 골라서 깨끗이 씻은 후 뼈는 남기고 살을 발라 준비한다."},{"d":"닭고기살에 잔칼집을 넣어 고기가 덜 오그라지게 한 다음 소금, 후추를 약간 뿌린다."},{"d":"프라이팬에 식용유를 두르고 뜨거워지면 닭살을 넣고 앞뒤로 눌러서 살짝 지져낸다."},{"d":"냄비에 간장, 설탕, 청주, 생강즙, 다시물을 넣어 끓여 약간 걸쭉하게 한다."},{"d":"④의 냄비에 지져서 기름을 뺀 닭을 집어넣고 은근히 윤기나게 익힌다."},{"d":"닭이 어느정도 익어가면 대파도 4㎝ 길이로 썰어 살짝 익힌다."}],"돼지갈비찜":[{"d":"돼지갈비는 기름기를 떼어내고 손질하여 칼집을 충분히 내 찬물에 담가 핏물을 빼준다."},{"d":"홍고추는 배를 갈라 씨를 털어내어 어슷썰고 감자와 당근, 무를 밤톨 크기로 썰어 가장자리를 둥글려준다."},{"d":"큰 그릇에 분량의 양념 재료를 섞어 양념장을 만들어 ①의 갈비에 재워놓는다."},{"d":"프라이팬에 기름을 넉넉히 두르고 홍고추를 볶아 고추기름을 낸 후 재운 갈비를 앞뒤로 노릇하게 지진다."},{"d":"④에 감자, 무, 당근을 넣고 뒤적이면서 돼지갈비가 잠길 정도로 물을 부어, 뚜껑을 덮고 끓이다가 갈비가 익을 무렵 고추장과 고춧가루를 넣고 윤기나게 조려낸다."}],"떡볶이":[{"d":"가래떡은 단단할 때 어슷썰어 준비한다."},{"d":"소시지는 가로, 세로  칼집을 넣어서 준비하고 양파, 피망은 넓적하게 썰고 대파는 어슷썬다."},{"d":"물이 끓으면 떡을 넣고 고추장과 양념 재료를 넣어 자작하게 조린다."},{"d":"③에 ②의 준비한 야채를 넣고 숨이 죽을 정도로만 조려 상에 낸다."}],"떡잡채":[{"d":"흰떡은 6cm 길이, 0.5cm 폭으로 채썰어 참기름과 간장을 섞어 만든 유장으로 골고루 버무려 놓는다."},{"d":"쇠고기는 불고기용으로 준비하여 채썰어 고기 양념을 한다."},{"d":"양파, 피망, 당근도 손질하여 흰 떡과 같은 길이로 가늘게 채썬다."},{"d":"팬에 기름을 넉넉히 두르고 뜨겁게 달군 다음 양념한 고기를 넣어 볶다가 채소와 김치를 넣고 함께 볶는다."},{"d":"고기와 채소가 거의 익으면 흰 떡을 넣어 고루 섞으면서 볶다가 참기름을 두르고 통깨를 훌훌 뿌린다."}],"오징어찌개":[{"d":"오징어는 내장을 제거하고 껍질을 벗긴 뒤 0.5㎝ 두께의 링 모양으로 썬다."},{"d":"쇠고기는 0.2㎝ 두께로 채썬 뒤 간장, 후춧가루로 밑간을 한다."},{"d":"풋고추, 홍고추, 대파는 어슷썬다."},{"d":"냄비에 물을 붓고 ②의 쇠고기를 넣어 끓으면 양념 재료를 넣어 간을 맞춘다."},{"d":"④에 오징어, 풋고추, 홍고추, 대파를 넣어 끓인다."}],"열무김치냉면":[{"d":"열무는 다듬어 소금에 절여둔다."},{"d":"냄비에 물 1컵과 찹쌀가루 2큰술을 넣고 나무주걱으로 저어가며 약불에서 찹쌀풀을 쑨다."},{"d":"볼에 물 4컵과 고춧가루 4큰술을 풀고 찹쌀풀을 넣어 간을 맞춘다."},{"d":"③에 절인 열무와 어슷썬 고추, 채썬 파, 마늘, 생강을 넣고 버무려 열무김치를 담아 익힌다."},{"d":"알맞게 익은 열무김치에 식초, 설탕, 소금으로 간을 맞추어 차게 둔다."},{"d":"냉면을 삶아 그릇에 담고 열무김치를 부은 다음 겨자 갠 것을 곁들인다."}],"동태찌개":[{"d":"동태는 비늘을 긁고 내장을 제거한 후 5cm 길이로 토막 낸다."},{"d":"무는 0.5cm 두께로 나박썰고 애호박은 도톰하게 반달썬다."},{"d":"청고추, 홍고추, 대파는 어슷썬다."},{"d":"두부는 1cm x 4cm x 3cm 크기로 썬다."},{"d":"냄비에 물 또는 육수를 붓고 고추장을 풀어 끓으면 무와 동태를 넣은 뒤 남은 재료를 모두 넣고 끓이면서 소금으로 간을 맞춘다."}],"두부굴찌개":[{"d":"두부는 가로 2cm, 세로 3cm, 두께 0.5cm로 썬다."},{"d":"굴은 굵은 소금물에 흔들어 씻어 건지고 양송이버섯은 0.5cm 두께로 썬다."},{"d":"가는 파는 3cm 길이로 썬다."},{"d":"청고추, 홍고추는 반으로 갈라 채썰고 마늘은 다진다."},{"d":"냄비에 물을 넣고 끓이다가 소금을 약간 넣은 뒤 두부와 굴을 넣어 계속 끓인다."},{"d":"⑤에 양송이버섯, 가는 파, 청고추, 홍고추를 넣는다."}],"해물밥전":[{"d":"새우는 막새우를 준비하여 잘 씻어 물기를 빼고 잘게 썬다. 오징어는 배를 갈라 내장을 손질하고 껍질을 벗겨내어 잘게 썬다.","t":"**해물과 야채는 일단 한 번 볶은 다음 섞는다.  해물과 야채를 손질하여 기름 두른 팬에 한번 볶아낸 다음 밀가루와 달걀을 넣으면 재료들이 잘 섞여 전을 부치기가 좋다. 반죽의 농도는 숟가락으로 들어올렸을 때 재료들이 천천히 흘러내릴 정도가 알맞다."},{"d":"양파와 당근은 손질하여 오징어와 비슷한 크기로 입자 있게 잘게 썰고, 실파는 송송 썬다."},{"d":"팬에 기름을 두르고 새우, 오징어, 양파, 당근, 실파를 넣고 소금, 후춧가루로 간하여 중불에서 약간 익을 정도로 볶는다."},{"d":"고슬고슬하게 지어진 밥을 준비하여 볶은 재료를 넣고 소금, 깨소금, 참기름으로 간을 맞춘 다음 밀가루를 잘 섞고 계란을 깨뜨려 넣어 끈기가 나게 섞는다."},{"d":"팬에 기름을 넉넉히 두르고 뜨겁게 달구어지면 해물밥을 한 스푼씩 떠넣어 둥글납작하게 완자 모양을 만들어 앞 뒤로 노릇하게 지진다."},{"d":"간장에 식초, 다진 파, 마늘, 통깨, 송송 썬 실파를 넣어 초간장을 만들어 곁들인다."}],"두부알찜":[{"d":"두부는 멍울이 지지 않도록 체에 내려 소금 약간과 조미술을 뿌린다."},{"d":"유리볼에 계란과 다시물을 섞고 소금, 조미술, 간장으로 간을 한 후 고운 체에 걸러 알끈 등을 제거한다."},{"d":"생표고버섯은 기둥을 채썰고 모시조개는 소금물에 담가 해감 시킨 후 살짝 데치고 새우는 내장을 제거한 후 삶아 껍질을 벗긴다. 은행도 끓는물에 데쳐 껍질을 벗긴다."},{"d":"②에 체에 내린 두부를 넣어 서로 잘 섞이도록 저어준다."},{"d":"찜그릇에 속재료를 넣고 계란물을 부어 은박지로 뚜껑을 만들어 덮고 김 오른 찜통에 13분 정도 쪄 부드럽게 먹는다."}],"알탕":[{"d":"명란은 붉은 빛을 띠는 싱싱한 것으로 준비해 찬물에 살살 씻어 헹군 다음 체에 밭쳐 물기를 뺀다."},{"d":"쇠고기는 기름기 없는 연한 살코기만 골라 가늘게 채썬 후 간장, 다진 파, 다진 마늘, 참기름, 깨소금을 넣고 무친다."},{"d":"무는 2cm x 2cm 크기로 납작썰고 콩나물은 뿌리를 다듬어 씻고, 대파, 홍고추는 어슷썰며 쑥갓과 대파는 씻어 5cm 길이로 썬다."},{"d":"분량의 간장에 고춧가루, 다진 마늘, 생강즙, 청주, 소금, 후춧가루를 넣고 골고루 섞어 양념장을 만든다."},{"d":"뚝배기를 뜨겁게 달구어 밑간한 쇠고기와 납작썬 무를 넣고 볶다가 어느 정도 익으면 물 4컵을 붓고 양념장을 고루 풀어 넣는다."},{"d":"국물에 명란과 콩나물을 넣고 끓이다가 미나리, 쑥갓, 고추, 대파를 넣고 조금 더 끓여 향을 돋군다."}],"생태국":[{"d":"생태는 씻어 내장을 빼고 비늘을 긁은 뒤 다시 씻어 5cm 길이로 토막내어 소금을 살짝 뿌려둔다."},{"d":"콩나물은 뿌리를 떼고 무는 0.5cm 두께로 얄팍하게 나박썬다. 붉은 고추는 어슷썰어 씨를 털고 미나리는 줄기만 4cm 길이로 썬다."},{"d":"마지막에 씻은 쌀뜨물을 받아 냄비에 붓고 센불에서 끓이다가 손질한 생태를 넣는다."},{"d":"국물이 끓어 생태가 익으면 무와 콩나물을 넣고 뚜껑을 덮은채 한소끔 끓인다."},{"d":"거의 끓었을 때 붉은 고추와 다진 마늘, 미나리를 넣고 소금과 후춧가루로 간 한 뒤 더 끓이다가 미나리가 살짝 숨이 죽으면 불에서 내린다."}],"쇠고기완자찜":[{"d":"두부는 물기를 짠 후 곱게 으깨어 다진쇠고기와 섞는다."},{"d":"①에 소금, 후춧가루, 깨소금, 참기름을 넣어 양념한다."},{"d":"②를 치대어 직경 3㎝ 크기의 완자를 빚는다."},{"d":"밤은 껍질을 까서 물에 담가놓고 무, 당근은 밤 크기로 썰어 끓는 물에 데친다."},{"d":"분량의 재료를 섞어 양념장을 만든다."},{"d":"냄비에 양념장을 넣어 끓어오르면 완자를 넣는다."}],"콩나물비빔밥":[{"d":"쌀, 보리등은 깨끗이 씻어 고슬고슬하게 밥을 짓는다."},{"d":"당근, 오이는 5cm 길이로 채썰어서 굵은 소금 한 숟가락에 절여 물기를 꼭 짜서 기름에 볶아낸다."},{"d":"콩나물은 꼬리를 떼고 물에 살짝 데쳐낸다."},{"d":"다진쇠 고기는 분량의 양념장 재료를 넣고 양념하여 기름에 볶아낸다."},{"d":"분량의 밥 위에 데친 콩나물, 볶은 오이, 볶은 당근, 볶은 쇠고기를 보기좋게 담는다."},{"d":"간장, 참기름, 깨소금, 후춧가루, 다진 파, 마늘 등을 섞어 양념장을 만든다."}],"사골우거지탕":[{"d":"사골은 찬물에 담가 핏물을 뺀 후 냄비에 물을 붓고 끓이다가 첫 물은 따라버리고 다시 물을 부어 끓인다."},{"d":"사태는 덩어리째 핏물을 뺀 후 ①에 같이 넣고 푹 익힌다."},{"d":"우거지는 끓는 물에 소금을 넣고 푹 삶은 후 찬물에 담가 냄새를 우려낸 뒤 물기를 꼭 짜고 5cm 폭으로 썰고 고기는 건져서 얄팍하게 저민다."},{"d":"③에 된장, 마늘을 넣어 골고루 무친다."},{"d":"뽀얗게 우러난 사골 국물을 4컵 정도 냄비에 넣고 ④를 넣어 한소끔 끓으면 어슷하게 파, 고추를 넣고 소금으로 간을 맞춘 다음 고춧가루를 조금 넣는다."}],"갈비찜":[{"d":"갈비는 토막내어 기름기를 제거하고 찬물에 30분 정도 담가 핏물을 빼서 준비하고, 냄비에 갈비가 잠길 정도로 물을 부어 대파를 흰 뿌리째 넣고 삶는다."},{"d":"삶은 갈비를 식혀 고루 칼집을 넣어두고 삶아낸 물은 육수로 쓴다."},{"d":"당근과 무는 밤톨 만하게 썰어 가장자리가 둥글게 모양 내고, 밤은 껍질을 깨끗이 벗겨낸다."},{"d":"은행은 달구어진 프라이팬에 기름을 두르고 살짝 볶아낸 후 거즈로 닦아 껍질을 벗겨내고, 표고버섯은 채썰며 계란은 흰자와 노른자를 분리하여 지단을 부쳐 준비한다."},{"d":"배는 강판에 갈아서 준비해두고, 배를 비롯한 분량의 양념 재료를 모두 넣고 고루 섞는다."},{"d":"냄비에 삶아둔 갈비를 안치고 ⑤의 양념장을 1/2 분량만 끼얹은 후 ②에서 나온 육수 1컵을 부어 끓이다가 갈비가 익고 국물이 졸아들면 남은 양념장을 넣고 준비해둔 밤, 무, 당근, 표고버섯을 넣고 푹 끓인다."}],"낙지볶음":[{"d":"낙지는 소금으로 문질러 씻은 후 끓는 물에 살짝 데친다."},{"d":"양파와 고추는 굵게 채썰고 대파는 4cm 길이로 썬다."},{"d":"분량의 양념 재료를 섞어 양념장을 만든다."},{"d":"데친 낙지에 ③을 넣고 고루 섞어 버무린다."},{"d":"달군 프라이팬에 야채와 낙지를 넣고 센불에서 재빨리 볶는다."},{"d":"마지막으로 참기름과 깨소금을 뿌려 마무리한다."}],"열무김치":[{"d":"열무와 무는 흐르는 물에 깨끗이 씻어 다듬어 4~5cm 길이로 썬다. 큰 그릇에 열무와 풋배추를 섞이지 않게 넣고 소금을 뿌려 1시간 정도 절인다."},{"d":"실파는 4cm 길이로 썰고 청고추는 어슷썰고 씨를 대충 털어낸다."},{"d":"냄비에 10컵의 물을 붓고 밀가루 2큰술을 넣어 중불에서 풀을 쑤어 식혀 놓는다."},{"d":"홍고추는 물에 불려 반으로 가르거나 어슷썰어 씨를 털어내고 분마기에 조금씩 넣어 방망이로 곱게 갈아 놓는다."},{"d":"식힌 밀가루풀에 분량의 물을 붓고 곱게 간 홍고추, 다진 마늘, 생강, 청고추를 넣는다."},{"d":"국물을 준비한 뒤 싱거우면 소금으로 간한다."}],"버섯두부찌개":[{"d":"두부는 모양이 으깨지지 않도록 씻어 도톰하고 납작하게 썰어 준비하고 잘 익은 김치는 속을 털어내고 송송 썰어 준비한다."},{"d":"느타리버섯은 적당한 굵기로 잘라놓고 생표고 팽이버섯도 먹기 좋게 준비한다."},{"d":"돼지고기는 잘게 썰고 양파는 채썰어 준비한다."},{"d":"청고추, 대파는 어슷하게 썰어놓고 마늘, 생강은 다진다."},{"d":"냄비에 참기름을 두르고 돼지고기, 김치, 양파를 달달 볶다가 물을 넣어 한소끔 끓인다."},{"d":"고춧가루 1큰술, 국간장 1큰술, 다진 양파, 다진 마늘, 깨소금, 어슷썬 청고추를 섞어 양념장을 만든다."}],"계란말이주먹밥":[{"d":"다시마는 마른 행주로 닦은 후 냄비 바닥에 깔아 쌀을 넣어 고슬하게 밥을 짓고, 다시마를 빼낸 후 분량의 배합초를 넣어 버무려 식힌다."},{"d":"볼에 계란을 풀고 소금간을 한 뒤 프라이팬에 식용유를 두르고 계란 지단을 부친다."},{"d":"지단이 식으면 가로 x 세로가 20cm x 20cm 정도가 되도록 자른다."},{"d":"표고버섯을 불린 다음 얇게 채썰고, 오이는 돌려깎기한 후 껍질 부분만 채를 썰고, 당근은 곱게 채썰어 각각 볶은 후 소금으로 간을 한다."},{"d":"미나리는 잎을 떼고 끓는 소금물에 데친다."},{"d":"계란 지단 위에 밥을 펴고 볶아 둔 표고버섯, 오이, 당근을 올리고 김밥 말듯이 말아준 후 데친 미나리로 한입 크기 마다 묶어서 썬다."}],"화양적":[{"d":"쇠고기는 힘줄 없는 부위를 사용한다. 길이 6cm, 너비 1cm, 두께 0.4cm로 자른 다음, 칼집을 넣는다. 분량의 양념 재료로 양념장을 만들어 1/2 분량에 재웠다가 프라이팬에 익힌다."},{"d":"마른 표고버섯은 따뜻한 물에 불린 뒤 기둥을 떼어낸다. 표고버섯, 도라지, 당근, 오이는 너비 1cm, 길이 5cm, 두께 0.4cm로 자른다."},{"d":"표고버섯은 남은 양념장에 버무린다."},{"d":"도라지는 소금에 비벼 씻은 다음 헹구어낸다."},{"d":"프라이팬에 식용유를 두르고 표고버섯, 도라지, 당근, 오이를 각각 볶아내면서 소금과 참기름으로 간을 해준다."},{"d":"산적꼬치에 준비된 재료를 색 맞추어 꽂은 다음 잣가루를 뿌려낸다."}],"대구탕":[{"d":"대구는 내장과 지느러미를 손질하여 5cm 정도의 크기로 토막내어 소금물에 씻는다."},{"d":"콩나물은 꼬리를 제거하고 무는 두껍지 않게 은행잎모양으로 썰어둔다."},{"d":"홍고추, 청고추는 어슷하게 썰어 물에 한번 씻고 미나리는 5cm 정도의 길이로 썰어둔다."},{"d":"냄비에 다시마 우려낸물을 담고 무와 콩나물을 넣어 시원한 맛을 우려낸다."},{"d":"고춧가루 2큰술, 고추장 1큰술, 소금, 후춧가루, 다진 마늘, 다진 생강, 새우젓을 넣어 양념장을 만든다."},{"d":"④의 국물에 대구를 넣어 한소끔 끓인 후 양념장을 넣는다."}],"우거지된장찌개":[{"d":"우거지는 깨끗이 다듬어 끓는 물에 푹 삶은 뒤 찬물에 담가 냄새를 뺀다.","t":"말린 시래기일 경우에는 오래 삶은 후 물을 갈지 말고 그대로 두어 충분히 불렸다가 맑은 물이 나올 때까지 여러 번 헹구어 사용한다. 충분히 우려낸 후 물기를 꼭 짜고 3cm 길이로 썰어놓는다."},{"d":"쇠고기는 기름기가 많은 것으로 골라 먹기 좋은 크기로 얄팍하게 저며 썬다."},{"d":"청고추와 홍고추는 꼭지를 딴 뒤 송송 썰어 씨와 함께 다져놓는다. 파는 어슷썰고 마늘과 생강은 곱게 다진다."},{"d":"그릇에 물기를 뺀 ①을 넣고 된장 4큰술과 다진 마늘, 식용유 1큰술을 넣어 무친다."},{"d":"냄비에 기름을 두르고 쇠고기를 넣어 볶다가 무쳐놓은 우거지를 넣고 함께 볶은 후 쌀뜨물을 붓고 약불에서 은근히 끓인다."},{"d":"찌개가 끓으면 다진 청고추와 홍고추, 어슷썬 파를 넣고 간장으로 심심하게 간을 맞춘다."}]},"photos":{"양파전":{"t":"Spring Onion Pancake - SOJU 2024-06-02.jpg","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Spring_Onion_Pancake_-_SOJU_2024-06-02.jpg"},"북어국":{"t":"Bugeo-guk 2.jpg","l":"CC BY-SA 2.0 kr","u":"https://commons.wikimedia.org/wiki/File:Buge <style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  :root{
    --d-bg:oklch(.215 .006 60); --d-card:oklch(.268 .006 60); --d-card2:oklch(.312 .006 60);
    --d-line:oklch(.352 .006 60); --d-tx2:oklch(.782 .008 70); --d-tx3:oklch(.622 .008 70);
    --cream:oklch(.965 .008 85);
    --l-bg:oklch(.968 .004 80); --l-card:#fff; --l-line:oklch(.925 .005 80);
    --l-thumb:oklch(.953 .005 80); --ink:oklch(.215 .008 60);
    --l-tx2:oklch(.485 .01 60); --l-tx3:oklch(.67 .01 60);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* 아이폰 기준: 100vh는 주소창 때문에 튀므로 dvh를 쓰고, 노치·홈바는 safe-area로 피한다. */
  :root{ --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px) }
  html,body{overscroll-behavior-y:none}
  /* 바탕은 현재 화면 색을 따라간다. 밝은 회색으로 두면 좌우 끝과
     스크롤 바운스에서 흰 띠가 비친다. */
  html{background:var(--d-bg)}
  body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
       -webkit-font-smoothing:antialiased;background:var(--d-bg);
       text-size-adjust:100%;-webkit-text-size-adjust:100%}
  body.light{background:var(--l-bg)}
  html:has(body.light){background:var(--l-bg)}
  a{color:inherit;text-decoration:none}
  .app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
  .view{display:none;min-height:100dvh;flex-direction:column}
  .view.on{display:flex}
  .mk{font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:-.045em;line-height:1}
  .deg{font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:0;line-height:1}
  button{font:inherit;border:0;background:none;padding:0;cursor:pointer;color:inherit;text-align:left}
  .grow{flex:1}

  /* ── 고르기 (다크) ───────────────────────────── */
  #pick{background:var(--d-bg);color:var(--cream)}
  .top{display:flex;align-items:center;gap:10px;padding:calc(14px + var(--sa-t)) 26px 6px}
  .tabs{display:flex;gap:22px;padding:0 26px;border-bottom:1px solid var(--d-line);margin-bottom:12px}
  /* 탭은 눌리는 것이므로 44px 세로 영역을 확보한다 */
  .tab{font-size:14.5px;font-weight:500;letter-spacing:-.03em;color:var(--d-tx3);
       height:42px;display:flex;align-items:center;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{font-weight:900;color:var(--cream);border-bottom-color:var(--cream)}
  /* 아치는 위쪽 반지름이 가로폭의 절반이다. 그래서 높이가 폭의 0.66은 돼야
     반원 아래에 사각 부분이 남아 아치로 읽힌다. 5:4로 두면 반원이 다 먹는다. */
  /* 아치에는 이 조합의 대표 요리 한 장만 건다. 화면에서 제일 큰 자리라
     여러 장으로 쪼개면 무엇을 만드는 건지가 안 읽힌다. 대표는 build.py가 고른다. */
  .arch{margin:0 26px 12px;aspect-ratio:3/2;border-radius:999px 999px 18px 18px;
        overflow:hidden;background:var(--d-card)}
  .arch img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
  /* 대표 요리 사진이 없는 조합에서만 쓰는 대비책. 상차림 스톡 사진이라 아래쪽을 보여준다. */
  .arch.stock img{object-position:center 62%}
  .badge{font-size:9.5px;letter-spacing:.16em;color:var(--d-tx3);padding:0 26px;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 제목은 한 줄로 앉힌다. 좁으면 글자만 조금 줄어들고 줄바꿈은 하지 않는다. */
  .title{font-size:clamp(19px,5.7vw,23px);font-weight:900;line-height:1.25;letter-spacing:-.045em;
         padding:6px 26px 12px;white-space:nowrap}
  .dishrow{display:flex;justify-content:space-between;padding:0 22px 4px;gap:2px;width:100%}
  .dish{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0}
  /* 아치가 "무엇을 만드는지"를 보여주면, 이 줄은 "이름"을 맡는다. 이름이 읽혀야 메뉴다. */
  .dish .cir{width:54px;height:54px;border-radius:27px;background:var(--d-card);
             display:flex;align-items:center;justify-content:center;color:var(--d-tx3);flex-shrink:0}
  .dish .cir.ph{overflow:hidden}
  .dish .cir.ph img{display:block;width:100%;height:100%;object-fit:cover}
  /* 한 줄로 두면 `두부두루치기`·`된장채소수제비`가 잘린다. 이름이 안 읽히면 메뉴가 아니다.
     한국어 긴 낱말은 keep-all로 안 쪼개지므로 anywhere로 풀고 두 줄까지 준다. */
  .dish span{font-size:10.5px;color:var(--d-tx2);text-align:center;line-height:1.25;
             overflow-wrap:anywhere;width:100%;overflow:hidden;
             display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .more{display:flex;align-items:center;gap:5px;padding:8px 26px 10px;font-size:11px;color:var(--d-tx3);
        min-height:34px}
  .rule{height:1px;background:var(--d-line);margin:0 26px}
  .count{display:flex;align-items:baseline;gap:9px;padding:12px 26px 10px}
  .count .strike{font-size:12px;color:var(--d-tx3);text-decoration:line-through}
  /* 살 것 숫자는 이 화면의 답이 아니라 근거다. 답은 위의 요리다.
     26px일 때는 화면에서 제일 큰 것이 숫자였다 — 그게 뒤집기 전 상태다. */
  .count .big{font-size:19px;font-weight:900;letter-spacing:-.045em;line-height:1}
  .ppl{display:flex;align-items:center;gap:9px;padding:0 26px 8px;flex-wrap:wrap}
  .lbl{font-size:10px;letter-spacing:.16em;color:var(--d-tx3);white-space:nowrap}
  .chip{display:flex;align-items:center;gap:8px;height:36px;padding:0 5px 0 12px;border-radius:11px;
        background:var(--d-card2);font-size:12.5px;font-weight:700}
  .chip b{font-weight:500;color:var(--d-tx3);min-width:14px;text-align:center}
  .step{width:26px;height:26px;border-radius:8px;background:oklch(.40 .008 60);color:var(--cream);
        display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1}
  .dials{display:flex;gap:8px;padding:0 26px}
  /* 좁은 화면에서 한 줄로 두면 "아무렇게나 고르면"이 잘린다. 라벨을 위로 올린다. */
  .dial{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
        min-height:50px;flex:1;min-width:0;padding:7px 6px;
        border-radius:15px;background:var(--d-card);font-size:10.5px;color:var(--d-tx3);text-align:center}
  .dial b{font-size:14px;font-weight:900;color:var(--cream);letter-spacing:-.02em}
  /* 하단 버튼은 화면에 붙여 둔다. 목록이 길어져도 밀려나지 않게. */
  .footD{position:sticky;bottom:0;padding:12px 26px calc(16px + var(--sa-b));
         background:linear-gradient(to top,var(--d-bg) 68%,transparent)}
  .footRow{display:flex;gap:9px}
  .cta{display:flex;align-items:center;justify-content:center;gap:9px;flex:1;min-width:0;
       width:100%;height:56px;border-radius:15px;
       background:var(--cream);color:var(--ink);font-size:16px;font-weight:900;letter-spacing:-.02em}
  /* 조합 고르기는 부속이다. 1순위(크림 CTA)는 화면당 하나라 여기는 카드색으로 가라앉힌다. */
  .alt{display:flex;align-items:center;justify-content:center;gap:7px;height:56px;padding:0 15px;
       border-radius:15px;background:var(--d-card);color:var(--d-tx2);
       font-size:13px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
  .alt b{color:var(--cream);font-weight:900;font-size:12px}

  /* ── 모든 요리 (다크) ─────────────────────────
     고르기 화면은 "조합 하나"를 보여주지만 여기는 "낱낱을 훑는" 자리라 형식이 아예 다르다.
     레시피 앱 문법 그대로 2열 썸네일 그리드 + 분류 칩. */
  #browse{display:none;flex-direction:column;flex:1;min-height:0}
  #pick.browsing #browse{display:flex}
  #pick.browsing .arch,#pick.browsing .badge,#pick.browsing .title,#pick.browsing .dishrow,
  #pick.browsing .more,#pick.browsing .rule,#pick.browsing .count,#pick.browsing .ppl,
  #pick.browsing .dials,#pick.browsing .footD,#pick.browsing .grow{display:none}
  /* 섹션 머리. 왼쪽에 굵은 제목, 오른쪽에 곁들이는 값. */
  .sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:16px 26px 11px}
  .sec h2{margin:0;font-size:17px;font-weight:900;letter-spacing:-.045em;color:var(--cream)}
  .sec .side{font-size:11.5px;color:var(--d-tx3);white-space:nowrap}
  /* 탐색 카드 — 글자 왼쪽, 사진 오른쪽. 세 줄로 쌓고 가로로 흐른다. */
  .explore{display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:8px;
           padding:0 26px 4px;overflow-x:auto;scrollbar-width:none}
  .explore::-webkit-scrollbar{display:none}
  .ec{display:flex;align-items:center;justify-content:space-between;gap:6px;width:152px;height:54px;
      padding-left:14px;border-radius:13px;background:var(--d-card);overflow:hidden}
  .ec .el{font-size:12.5px;font-weight:800;letter-spacing:-.03em;color:var(--cream);
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ec .ep{width:58px;height:54px;flex:0 0 auto;background:var(--d-card2)}
  .ec .ep img{display:block;width:100%;height:100%;object-fit:cover}
  .ec.on{background:var(--cream)}
  .ec.on .el{color:var(--ink)}
  /* 정렬. 칩보다 한 단 낮은 글줄로 둔다 — 분류를 고르는 탐색 카드와 위계가 겹치면 안 된다. */
  .sortrow{display:flex;gap:14px;padding:0 26px 12px;overflow-x:auto;scrollbar-width:none}
  .sortrow::-webkit-scrollbar{display:none}
  .sortrow button{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--d-tx3);
                  padding:5px 0;white-space:nowrap;border-bottom:1.5px solid transparent}
  .sortrow button.on{color:var(--cream);border-bottom-color:var(--cream)}
  /* 사진이 주인공이다. 제목은 사진 아래 굵게 두 줄, 곁들이는 값은 태그로. */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 11px;
        padding:0 26px calc(28px + var(--sa-b))}
  .card{display:flex;flex-direction:column;gap:9px}
  .card .th{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--d-card)}
  .card .mk2{position:absolute;top:8px;right:8px;width:25px;height:25px;border-radius:13px;
             background:var(--cream);color:var(--ink);display:flex;align-items:center;justify-content:center}
  .card .th img{display:block;width:100%;height:100%;object-fit:cover}
  .card .cn{font-size:14px;font-weight:700;letter-spacing:-.035em;line-height:1.35;color:var(--cream);
            overflow-wrap:anywhere;overflow:hidden;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .card .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:-2px}
  .card .tg2{font-size:10.5px;font-weight:600;color:var(--d-tx2);background:var(--d-card2);
             padding:4px 8px;border-radius:6px;white-space:nowrap}
  .empty{padding:40px 26px;text-align:center;font-size:13px;color:var(--d-tx3)}

  /* ── 레시피 (다크) ────────────────────────────
     모달로 두면 스크롤이 갇히고 길이가 안 나온다. 레시피는 페이지가 맞다.
     2026-08-25 다크로 바꿨다(사용자 요청). `하는 화면은 밝다`는 규칙에서 벗어나지만,
     고르기→훑기→레시피가 한 흐름이라 중간에 흰 화면이 끼는 게 더 튀었다.
     본문은 라이트 토큰으로 짜여 있으므로 이 블록에서 토큰만 갈아끼운다 —
     되돌리려면 아래 여덟 줄을 지우고 배경을 --l-bg로 되돌리면 끝이다. */
  #recipe{
    --l-bg:oklch(.215 .006 60); --l-card:oklch(.268 .006 60);
    --l-line:oklch(.352 .006 60); --l-thumb:oklch(.312 .006 60);
    --ink:oklch(.965 .008 85);      /* 반전 바탕이 크림이 된다 */
    --cream:oklch(.215 .006 60);    /* 반전 위의 글씨는 바탕색으로 */
    --l-tx2:oklch(.782 .008 70); --l-tx3:oklch(.622 .008 70);
    background:var(--l-bg);color:var(--ink)}
  /* 요리를 이미 고르고 들어온 화면이다. 맨 위에 큰 사진을 다시 거는 건 자리 낭비라
     이름 옆 작은 썸네일로 줄였다(2026-08-25 사용자 교정). */
  .rtop{display:flex;align-items:center;justify-content:space-between;
        padding:calc(8px + var(--sa-t)) 16px 0}
  .rback,.rmark{width:44px;height:44px;border-radius:22px;color:var(--l-tx2);
         display:flex;align-items:center;justify-content:center}
  .rtr{display:flex;align-items:center;gap:2px}
  /* 남은 시간은 자리가 흔들리면 안 읽힌다. 숫자 폭을 고정한다. */
  .rtime{height:44px;min-width:44px;padding:0 11px;border-radius:22px;color:var(--l-tx2);
         display:flex;align-items:center;justify-content:center;gap:6px}
  .rtime b{font-size:13px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .rtime.on{background:var(--ink);color:var(--cream)}
  /* 타이머 설정 — 큰 숫자 하나와 ±, 그리고 자주 쓰는 시간 */
  .tdial{display:flex;align-items:center;justify-content:space-between;gap:14px;
         padding:6px 4px 14px}
  .tdial .tv{font-size:44px;font-weight:900;letter-spacing:-.05em;line-height:1;
             font-variant-numeric:tabular-nums;color:var(--ink)}
  .tdial button{width:46px;height:46px;border-radius:15px;background:var(--l-thumb);color:var(--ink);
                display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}
  /* 폭을 똑같이 나눠 줄을 꽉 채운다 — 감기지도 않고 오른쪽에 남는 여백도 없다. */
  .tpre{display:flex;gap:5px;padding-bottom:16px}
  .tpre button{flex:1;min-width:0;height:38px;padding:0 6px;border-radius:11px;
               background:var(--l-thumb);color:var(--l-tx2);font-size:12.5px;font-weight:800;
               display:flex;align-items:center;justify-content:center;white-space:nowrap}
  .tpre button.on{background:var(--ink);color:var(--cream)}
  .tgo{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border-radius:15px;
       background:var(--ink);color:var(--cream);font-size:15px;font-weight:900}
  .tgo.stop{background:var(--l-thumb);color:var(--l-tx2)}
  /* 다 됐을 때 — 큰 시계 하나와 한 줄. 이 순간에 읽을 것은 그것뿐이다. */
  .ring{display:flex;flex-direction:column;align-items:center;gap:16px;padding:14px 0 22px;text-align:center}
  .ring .rc2{width:84px;height:84px;border-radius:42px;background:var(--ink);color:var(--cream);
             display:flex;align-items:center;justify-content:center}
  .ring h4{margin:0;font-size:19px;font-weight:900;letter-spacing:-.04em;color:var(--ink)}
  .ring p{margin:0;font-size:12.5px;color:var(--l-tx3)}
  /* 저장은 색이 아니라 반전으로 알린다 — 이 앱에 유채색은 사진뿐이다. */
  .rmark.on{background:var(--ink);color:var(--cream)}
  .rhead{display:flex;align-items:center;gap:14px;padding:4px 26px 14px}
  .rth{width:62px;height:62px;border-radius:16px;overflow:hidden;background:var(--l-thumb);flex:0 0 auto}
  .rth img{display:block;width:100%;height:100%;object-fit:cover}
  .rht{min-width:0}
  .rtitle{margin:0;font-size:19px;font-weight:900;letter-spacing:-.045em;line-height:1.25;
          overflow-wrap:anywhere}
  .rtags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .rtags i{font-style:normal;font-size:11px;font-weight:700;color:var(--l-tx2);background:var(--l-card);
           border:1px solid var(--l-line);padding:5px 9px;border-radius:7px}
  /* 재료는 만드는 도중에도 언제든 돌아볼 수 있어야 한다. 그래서 화면에 붙여 둔다. */
  .rseg{position:sticky;top:0;z-index:3;display:flex;gap:6px;padding:9px 26px 10px;
        background:var(--l-bg);border-bottom:1px solid var(--l-line)}
  .rseg button{flex:1;height:42px;border-radius:12px;background:var(--l-card);
               border:1px solid var(--l-line);font-size:13px;font-weight:800;color:var(--l-tx2);
               display:flex;align-items:center;justify-content:center}
  .rseg button.on{background:var(--ink);border-color:var(--ink);color:var(--cream);font-weight:900}
  /* 내용이 화면보다 짧으면 sticky는 붙을 데가 없어 흐름 자리에 그대로 앉는다.
     남는 높이를 pane이 먹고 .sfoot을 margin-top:auto로 밀어야 길든 짧든 같은 자리다. */
  .rpane{flex:1;display:flex;flex-direction:column;padding:16px 26px calc(30px + var(--sa-b))}
  /* 만드는 법에서는 아래 여백을 .sfoot이 들고 있다. pane에도 두면 짧은 단계와 긴 단계의
     버튼 위치가 그 여백만큼(25px) 어긋난다. */
  .rpane.stepping{padding-bottom:0}
  /* 인분 조절. 레시피 기준 인분에서 늘리고 줄이면 분량이 따라 바뀐다. */
  .serv{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
  .serv .sl{font-size:10px;letter-spacing:.15em;color:var(--l-tx3)}
  .servc{display:flex;align-items:center;gap:9px;height:40px;padding:0 6px 0 14px;border-radius:12px;
         background:var(--l-card);border:1px solid var(--l-line);font-size:13.5px;font-weight:800}
  .servb{width:30px;height:30px;border-radius:9px;background:var(--l-thumb);color:var(--ink);
         display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1}
  .ing{background:var(--l-card);border-radius:16px;padding:4px 16px}
  .igr{font-size:10px;letter-spacing:.14em;color:var(--l-tx3);padding:13px 0 1px}
  .ir{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 0;
      border-bottom:1px solid var(--l-line);font-size:13.5px}
  .ing .ir:last-child{border-bottom:0}
  .ir b{font-weight:700;color:var(--l-tx2);font-size:12.5px;white-space:nowrap}
  .ir b.raw{font-weight:500;color:var(--l-tx3)}
  /* 만드는 법은 한 번에 한 단계만. 스무 문단을 한꺼번에 두면 어디까지 했는지 놓친다. */
  .scard{background:var(--l-card);border-radius:18px;overflow:hidden}
  .scard .si{aspect-ratio:4/3;background:var(--l-thumb)}
  .scard .si img{display:block;width:100%;height:100%;object-fit:cover}
  .scard .sb{padding:17px 20px 20px}
  .scard .snum{font-size:10.5px;font-weight:900;letter-spacing:.14em;color:var(--l-tx3)}
  .scard .stx{margin-top:8px;font-size:15px;line-height:1.7;color:var(--ink)}
  .stip{display:block;margin-top:12px;padding:11px 13px;border-radius:10px;background:var(--l-thumb);
        font-size:12px;line-height:1.65;color:var(--l-tx3)}
  /* 글이 길든 짧든 넘김 버튼은 늘 같은 자리에 있어야 한다. 흐름에 두면 카드 높이를 따라 오르내린다. */
  .sfoot{position:sticky;bottom:0;padding:10px 0 calc(10px + var(--sa-b));
         background:linear-gradient(to top,var(--l-bg) 74%,transparent)}
  .dots{display:flex;gap:5px;justify-content:center;padding:0 0 10px}
  .dots i{width:6px;height:6px;border-radius:3px;background:var(--l-line);transition:width .18s}
  .dots i.on{background:var(--ink);width:17px}
  .snav{display:flex;gap:9px}
  .snav button{flex:1;height:52px;border-radius:14px;font-size:14px;font-weight:900;
               display:flex;align-items:center;justify-content:center;gap:7px}
  .snav .prev{background:var(--l-card);border:1px solid var(--l-line);color:var(--l-tx2)}
  .snav .next{background:var(--ink);color:var(--cream)}
  .snav button[disabled]{opacity:.34}
  .rsrc{margin-top:26px;padding-top:15px;border-top:1px solid var(--l-line);
        font-size:10.5px;line-height:1.75;color:var(--l-tx3)}
  .rsrc a{text-decoration:underline;text-underline-offset:2px}

  /* ── 장보기 목록 (라이트) ───────────────────── */
  #list{background:var(--l-bg);color:var(--ink)}
  .lhead{display:flex;align-items:center;gap:4px;padding:calc(14px + var(--sa-t)) 26px 10px}
  .back{width:44px;height:44px;margin-left:-13px;display:flex;align-items:center;justify-content:center;color:var(--l-tx2)}
  .lhead h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.04em}
  .lhead p{margin:3px 0 0;font-size:11.5px;color:var(--l-tx3)}

  .ovl{margin:0 26px 10px;padding:15px 17px 13px;border-radius:18px;background:var(--ink);color:var(--cream)}
  .ovl .k{font-size:10.5px;letter-spacing:.14em;color:var(--d-tx3)}
  .ovl .tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
  .ovl .tg{display:flex;align-items:baseline;gap:4px;padding:6px 10px;border-radius:9px;background:oklch(.31 .008 60);
           font-size:12.5px;font-weight:700}
  .ovl .tg i{font-style:normal;font-size:11px;font-weight:900;color:var(--d-tx2)}
  .ovl .sum{display:flex;align-items:baseline;gap:7px;padding-top:12px;border-top:1px solid oklch(.35 .008 60);
            font-size:12px;color:var(--d-tx2);flex-wrap:wrap}
  .ovl .sum b{font-size:21px;font-weight:900;letter-spacing:-.04em;color:var(--cream)}
  .ovl .sum s{color:var(--d-tx3)}

  .cat{margin:0 26px 8px;border-radius:18px;background:var(--l-card);overflow:hidden}
  .cat h2{margin:0;display:flex;align-items:center;gap:10px;padding:12px 18px 9px;font-size:12.5px;font-weight:900}
  .cat h2 .ic{width:27px;height:27px;border-radius:9px;background:var(--l-thumb);
              display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .cat h2 .n{flex:1}
  .cat h2 .c{font-size:11px;font-weight:700;color:var(--l-tx3)}
  /* 긴 재료명(돼지고기 앞다리살)이 수량과 체크를 밀어내지 않게 이름만 줄인다. */
  .row{display:flex;align-items:center;gap:8px;width:100%;min-height:50px;padding:6px 14px 6px 17px;
       border-top:1px solid var(--l-line)}
  .row .nm{font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .ov{font-size:10px;font-weight:900;color:var(--ink);background:oklch(.93 .012 80);
           padding:3px 6px;border-radius:6px;white-space:nowrap;flex-shrink:0}
  .row .qt{font-size:13.5px;font-weight:900;color:var(--l-tx2);margin-left:auto;
           white-space:nowrap;flex-shrink:0}
  .row .ck{width:22px;height:22px;border-radius:11px;border:1.5px solid oklch(.87 .006 80);flex-shrink:0;
           display:flex;align-items:center;justify-content:center;color:transparent}
  .row.done .nm,.row.done .qt{color:var(--l-tx3);text-decoration:line-through}
  .row.done .ov{opacity:.35}
  .row.done .ck{background:var(--ink);border-color:var(--ink);color:var(--cream)}
  .bar{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 26px calc(14px + var(--sa-b));
       background:linear-gradient(to top,var(--l-bg) 68%,transparent)}
  .b1{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;height:54px;border-radius:14px;
      background:var(--ink);color:var(--cream);font-size:15px;font-weight:900;white-space:nowrap}
  .b2{display:flex;align-items:center;justify-content:center;gap:7px;height:54px;padding:0 15px;border-radius:14px;
      border:1.5px solid oklch(.87 .006 80);color:var(--l-tx2);font-size:13.5px;font-weight:700;
      white-space:nowrap;flex-shrink:0}

  /* ── 시트 · 토스트 ─────────────────────────── */
  .sheet{position:fixed;inset:0;background:oklch(.2 .01 60/.55);display:none;align-items:flex-end;z-index:9}
  .sheet.on{display:flex}
  .sheet .box{width:100%;max-width:480px;margin:0 auto;background:var(--l-card);color:var(--ink);
              border-radius:22px 22px 0 0;padding:20px 20px calc(20px + var(--sa-b));
              max-height:82dvh;overflow:auto;-webkit-overflow-scrolling:touch}
  .sheet h3{margin:0 0 4px;font-size:17px;font-weight:900}
  .sheet .sub{margin:0 0 14px;font-size:11.5px;color:var(--l-tx3);line-height:1.6}
  .sheet textarea{width:100%;height:170px;border:1px solid var(--l-line);border-radius:12px;padding:12px;
                  font:inherit;font-size:12.5px;line-height:1.7;resize:none;background:var(--l-bg);color:var(--ink)}
  .lk{display:flex;align-items:center;gap:10px;width:100%;padding:13px 4px;border-bottom:1px solid var(--l-line);font-size:14px}
  .lk .q{margin-left:auto;font-size:11px;color:var(--l-tx3)}
  .rc{display:flex;align-items:flex-start;gap:11px;padding:12px 4px;border-bottom:1px solid var(--l-line)}
  .rc .no{width:20px;font-size:11px;font-weight:900;color:var(--l-tx3);padding-top:2px}
  .rc .nm{font-size:14.5px;font-weight:700}
  .rc .mt{font-size:10.5px;color:var(--l-tx3);margin-top:3px;line-height:1.5;word-break:break-word}
  .rc .mt .cr{text-decoration:underline;text-underline-offset:2px}

<script>
const D = JSON.parse(document.getElementById('bogl-data').textContent);
let si = 0, people = D.sets[0].people, done = {};
// `모든 요리` 탭 상태. 조합 축과 달리 세트가 아니라 요리 낱낱을 훑는다.
let browsing = false, catKey = '전체', sortKey = '가나다';
/** 정렬. 재료·단계·시간은 `적을수록 쉬운 것`이라 전부 오름차순이다. */
const SORTS = {
  '가나다':      c => c.name,
  '재료 적은 순': c => [(c.ing || []).length, c.name],
  '단계 적은 순': c => [((D.recipes || {})[c.name] || []).length || 99, c.name],
  '시간 짧은 순': c => [c.min || 999, c.name],
};
/** 저장한 요리. 서버가 없으니 이 기기에만 남는다 — 폰을 바꾸면 사라진다.
 *  시크릿 모드에서는 localStorage가 예외를 던지므로 감싼다. */
const MARKS = 'bogl.marks';
let marks = new Set();
try { marks = new Set(JSON.parse(localStorage.getItem(MARKS) || '[]')); } catch(e){}
const saveMarks = () => { try { localStorage.setItem(MARKS, JSON.stringify([...marks])); } catch(e){} };
const MARKI = '<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.4h8v11.2L8 10.6l-4 3z"/></svg>';
const $ = id => document.getElementById(id);
const set = () => D.sets[si];

/** 축(탭)마다 조합이 여러 개다. 탭은 축 하나에 하나만 두고, `다른 조합` 시트가 그 안에서 고른다.
 *  a.i는 그 축에서 마지막으로 보던 조합이라, 탭을 오갔다 와도 보던 자리로 돌아온다. */
const AXES = [];
D.sets.forEach((s, i) => { if(!AXES.some(a => a.type === s.type)) AXES.push({type: s.type, label: s.tabLabel, i}); });
const axis = () => AXES.find(a => a.type === set().type);
const siblings = () => D.sets.reduce((a, s, i) => (s.type === set().type && a.push(i), a), []);

const ICONS = {
  '정육 · 계란':'<path d="M2.6 10.6c0-3.9 3.2-6.8 7.4-6.8s7.4 2.9 7.4 6.8c0 2.2-1.5 3.6-3.6 3.6H6.2c-2.1 0-3.6-1.4-3.6-3.6z" fill="currentColor"/><ellipse cx="10" cy="10.2" rx="2.5" ry="1.9" fill="var(--l-thumb)"/>',
  '수산 · 건해산':'<path d="M2.6 10c2.4-3.2 5.4-4.8 8.2-4.8 3.2 0 5.4 2.1 6.2 4.8-.8 2.7-3 4.8-6.2 4.8-2.8 0-5.8-1.6-8.2-4.8z" fill="currentColor"/><circle cx="12.6" cy="8.9" r=".95" fill="var(--l-thumb)"/>',
  '채소 · 두부':'<path d="M10 17.2c0-4.8 2.9-8.2 6.8-8.7-.4 5.2-3 8.1-6.8 8.7z" fill="currentColor"/><path d="M10 17.2c0-4-2.3-6.9-5.8-7.5.3 4.4 2.5 6.7 5.8 7.5z" fill="currentColor" opacity=".55"/><path d="M10 17.6v-3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
  '김치 · 반찬':'<path d="M2.8 8.4h14.4l-1.2 5.8a2 2 0 0 1-2 1.6H6a2 2 0 0 1-2-1.6z" fill="currentColor"/><rect x="4.6" y="4.2" width="10.8" height="2.6" rx="1.3" fill="currentColor" opacity=".5"/>',
  '장 · 양념 · 오일':'<path d="M8.3 2.8h3.4v2.5l2.1 3.1v8a1.4 1.4 0 0 1-1.4 1.4H7.6a1.4 1.4 0 0 1-1.4-1.4v-8l2.1-3.1z" fill="currentColor"/><rect x="6.2" y="10.4" width="7.6" height="3.2" fill="var(--l-thumb)"/>',
  '쌀 · 잡곡':'<path d="M4.6 7.4h10.8l1 8.4a1.6 1.6 0 0 1-1.6 1.8H5.2a1.6 1.6 0 0 1-1.6-1.8z" fill="currentColor"/><path d="M7.4 7.4c0-2 1.2-3.2 2.6-3.2s2.6 1.2 2.6 3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>',
  '라면 · 통조림':'<rect x="5.4" y="4.6" width="9.2" height="12.4" rx="1.5" fill="currentColor"/><rect x="5.4" y="7.6" width="9.2" height="2.6" fill="var(--l-thumb)"/>',
  '우유 · 유제품':'<path d="M5.6 7.6h8.8v8.6a1.3 1.3 0 0 1-1.3 1.3H6.9a1.3 1.3 0 0 1-1.3-1.3z" fill="currentColor"/><path d="M5.6 7.6L10 3.2l4.4 4.4z" fill="currentColor" opacity=".55"/>'
};
// 지금은 임시 사진(HERO)이 빈자리를 메우고 있어 쓰이지 않는다. 그걸 걷어내면 다시 이 글리프로 돌아온다.
const BOWL = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 11h18l-1.7 7.3a3 3 0 0 1-2.9 2.3H7.6a3 3 0 0 1-2.9-2.3z" fill="currentColor"/><ellipse cx="12" cy="11" rx="9" ry="2.3" fill="currentColor" opacity=".45"/></svg>';
// 요리 사진. 없는 요리는 그릇 글리프로 남는다.
const PHOTO = {"가지쇠고기볶음":"img/d001.jpg","갈치무조림":"img/d002.jpg","갈치조림":"img/d003.jpg","계란말이주먹밥":"img/d004.jpg","고등어양념구이":"img/d005.jpg","김치두부쌈":"img/d006.jpg","김치볶음밥":"img/d007.jpg","김치수제비":"img/d008.jpg","나박김치":"img/d009.jpg","닭가슴살해파리샐러드":"img/d010.jpg","닭꼬치구이":"img/d011.jpg","동태찌개":"img/d012.jpg","돼지갈비찜":"img/d013.jpg","된장찌개":"img/d014.jpg","된장채소수제비":"img/d015.jpg","두부두루치기":"img/d016.jpg","두부알찜":"img/d017.jpg","맑은대구탕":"img/d018.jpg","매운가지볶음":"img/d019.jpg","버섯청국장찌개":"img/d020.jpg","부추잡채":"img/d021.jpg","북어국":"img/d022.jpg","사골우거지탕":"img/d023.jpg","쇠고기완자찜":"img/d024.jpg","순대볶음":"img/d025.jpg","양송이버섯죽":"img/d026.jpg","양파전":"img/d027.jpg","열무김치냉면":"img/d028.jpg","오징어볶음과소면":"img/d029.jpg","오징어찌개":"img/d030.jpg","잔치국수":"img/d031.jpg","제육겨자쌈":"img/d032.jpg","조기찜":"img/d033.jpg","청국장찌개":"img/d034.jpg","콩나물국밥":"img/d035.jpg","콩나물무밥":"img/d036.jpg","콩나물잡채":"img/d037.jpg","호박무침":"img/d038.jpg"};
// 사진이 하나도 없는 조합에서만 쓴다. 지금은 어느 조합에나 최소 두 장은 있다.
const HERO = 'img/hero.jpg';
/** ⚠ 임시 — 사진이 없는 13가지에 상차림 스톡 사진을 대신 건다(2026-08-25).
 *  느낌을 보려고 넣은 것이고, 그 요리의 사진이 아니다. 진짜 사진이 붙으면 이 함수를
 *  `PHOTO[n] || ''`로 되돌리고 없는 자리는 다시 그릇 글리프로 둔다. */
const dishPic = n => PHOTO[n] || HERO;
const dishFace = n => `<span class="cir ph"><img src="${dishPic(n)}" alt=""></span>`;
// `4가지`보다 `네 가지`가 읽힌다. 열 이상은 숫자로 둔다.
const KO = ['', '한', '두', '세', '네', '다섯', '여섯', '일곱', '여덟', '아홉'];
/** 받침이 있으면 `과`, 없으면 `와`. `조기찜와`처럼 나가면 한국어가 아니다. */
const gwa = w => { const c = (w || '').charCodeAt((w || '').length - 1) - 0xAC00;
  return (c >= 0 && c <= 11171 && c % 28 !== 0) ? '과' : '와'; };
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 파이썬 build.py의 fmt()와 같은 규칙. 장볼 양이라 모자라지 않게 올림한다.
function fmt(v, u){
  if(v == null || !u) return '조금';
  if(u === 'ml') return v >= 200 ? (Math.ceil(v/100)/2) + '컵' : Math.max(1, Math.round(v/15)) + '큰술';
  if(u === 'g')  return v >= 1000 ? (Math.ceil(v/100)/10) + 'kg' : (Math.ceil(v/10)*10) + 'g';
  return Math.ceil(v - 1e-9) + u;
}
const qtyOf = it => it.value == null ? '조금' : fmt(it.value / set().people * people, it.unit);
const usedOf = n => (set().overlaps.find(o => o.name === n) || {}).used || 0;

/** 출처는 레시피마다 다를 수 있다. 세트 전체가 한 곳인 것처럼 뭉뚱그리지 않는다. */
function sourceCounts(){
  const m = new Map();
  set().dishes.forEach(d => m.set(d.source, (m.get(d.source) || 0) + 1));
  return [...m.entries()];
}

function renderPick(){
  const s = set();
  $('tabs').innerHTML = AXES.map(a =>
    `<button class="tab${!browsing && a.type===s.type?' on':''}" data-i="${a.i}">${esc(a.label)}</button>`).join('')
    + `<button class="tab${browsing?' on':''}" data-b="1">모든 요리</button>`;
  $('pick').classList.toggle('browsing', browsing);
  // 조합 화면 요소는 전부 숨겨져 있으니 그릴 이유가 없다.
  if(browsing) return renderBrowse();
  $('again').style.display = s.vn > 1 ? '' : 'none';
  $('againN').textContent = s.vi + '/' + s.vn;
  // 아치는 이 조합의 대표 요리 한 장. 누구를 대표로 볼지는 build.py가 정해 `hero`로 준다.
  const hero = s.hero && PHOTO[s.hero];
  const arch = $('arch');
  arch.className = hero ? 'arch' : 'arch stock';
  arch.innerHTML = hero
    ? `<img src="${hero}" alt="${esc(s.hero)}">`
    : `<img src="${HERO}" alt="차려진 한식 밥상">`;
  $('badge').textContent = s.badge;
  $('title').textContent = s.title;
  $('dishes').innerHTML = s.dishes.slice(0, 5).map(d =>
    `<span class="dish">${dishFace(d.name)}<span>${esc(d.name)}</span></span>`).join('') +
    (s.dishes.length > 5 ? `<span class="dish"><span class="cir" style="background:var(--d-card2);font-size:13px;font-weight:900;color:var(--d-tx2)">+${s.dishes.length-5}</span><span>더 있어요</span></span>` : '');
  $('dishmore').innerHTML = `요리 ${s.dishes.length}가지 · 조리법과 출처 보기
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>`;
  $('apart').textContent = '재료 ' + s.apart + '가지';
  $('buy').textContent = s.buyCount;
  $('pp').textContent = people;
  $('dials').innerHTML =
    `<div class="dial">겹치는 재료 <b>${s.overlaps.length}가지</b></div>` +
    `<div class="dial">아무렇게나 고르면 <b>${s.randomAvg}가지</b></div>`;
}

/** 모든 요리 — 조합과 상관없이 요리 낱낱을 훑고 눌러서 레시피를 본다.
 *  탐색 카드는 분류만이 아니라 난이도·시간도 섞는다. 고르는 이유가 그것뿐이 아니다. */
const catMatch = (c, cat) =>
  cat.f === 'all' || (cat.f === 'mark' && marks.has(c.name))
  || (cat.f === 'bucket' && c.bucket === cat.v)
  || (cat.f === 'level' && c.level === cat.v) || (cat.f === 'maxmin' && c.min <= cat.v);

/** 저장한 것이 있을 때만 맨 앞에 세운다. 빈 칸을 눌러 아무것도 없는 화면을 보여줄 이유가 없다. */
const catList = () => (marks.size
  ? [{ label: '저장한 요리', f: 'mark', n: marks.size, pic: [...marks][0] }] : [])
  .concat(D.cats || []);

function renderBrowse(){
  const cats = catList();
  const cur = cats.find(c => c.label === catKey) || cats[0];   // 고르던 묶음이 사라졌으면 맨 앞으로
  catKey = cur.label;
  const items = (D.catalog || []).filter(c => catMatch(c, cur));
  $('explore').innerHTML = cats.map(c => `
    <button class="ec${c.label === catKey ? ' on' : ''}" data-b="${esc(c.label)}">
      <span class="el">${esc(c.label)}</span>
      <span class="ep">${c.pic && PHOTO[c.pic] ? `<img src="${PHOTO[c.pic]}" alt="">` : ''}</span>
    </button>`).join('');
  $('gtitle').textContent = cur.f === 'all' ? '모든 요리' : cur.label;
  $('gcount').textContent = `${items.length}가지 · 눌러서 만드는 법 보기`;
  $('sortrow').innerHTML = Object.keys(SORTS).map(k =>
    `<button class="${k === sortKey ? 'on' : ''}" data-s="${esc(k)}">${esc(k)}</button>`).join('');
  const skey = SORTS[sortKey] || SORTS['가나다'];
  items.sort((a, b) => { const x = skey(a), y = skey(b);
    return Array.isArray(x) ? (x[0] - y[0]) || String(x[1]).localeCompare(y[1], 'ko')
                            : String(x).localeCompare(String(y), 'ko'); });
  $('grid').innerHTML = items.length ? items.map(c => `
    <button class="card" data-n="${esc(c.name)}">
      <span class="th"><img src="${dishPic(c.name)}" alt="">${marks.has(c.name) ? `<i class="mk2">${MARKI}</i>` : ''}</span>
      <span class="cn">${esc(c.name)}</span>
      <span class="tags"><i class="tg2">${esc(c.time)}</i><i class="tg2">${esc(c.level)}</i></span>
    </button>`).join('') : `<div class="empty" style="grid-column:span 2">여기엔 아직 요리가 없어요</div>`;
}
$('explore').onclick = e => { const b = e.target.closest('.ec'); if(!b) return;
  catKey = b.dataset.b; renderBrowse(); scrollTo(0, 0); };
$('sortrow').onclick = e => { const b = e.target.closest('button'); if(!b) return;
  sortKey = b.dataset.s; renderBrowse(); };
$('grid').onclick  = e => { const c = e.target.closest('.card'); if(!c) return; openRecipe(c.dataset.n); };

/** 레시피 분량. 장보기와 달리 올림하지 않는다 — 사러 갈 양이 아니라 넣을 양이다.
 *  0.5 단위로 떨어뜨린다. `2.3개`보다 `2.5개`가 부엌에서 쓸 수 있는 숫자다. */
const half = v => { const r = Math.round(v * 2) / 2; return r % 1 ? r.toFixed(1) : String(r); };
function fmtR(v, u){
  if(v == null || !u) return null;
  if(u === 'ml') return v >= 200 ? half(v / 200) + '컵' : half(v / 15) + '큰술';
  if(u === 'g')  return v >= 1000 ? half(v / 1000) + 'kg' : Math.max(1, Math.round(v)) + 'g';
  return half(v) + u;
}

/** 요리 하나의 레시피 — 모달이 아니라 페이지다.
 *  재료와 만드는 법을 탭으로 갈라 두는 이유: 만드는 도중에 재료를 다시 봐야 한다.
 *  탭 줄은 화면에 붙어 있어 몇 단계째든 한 번에 돌아간다. */
let rName = null, rServ = 2, rTab = 'ing', stepI = 0;

function openRecipe(name){
  rName = name; rTab = 'ing'; stepI = 0;
  const c = (D.catalog || []).find(x => x.name === name) || {};
  rServ = c.servings || 2;
  $('rimg').src = dishPic(name); $('rimg').alt = name;
  $('rtitle').textContent = name;
  $('rtags').innerHTML = [c.kind, c.time, c.level].filter(Boolean)
    .map(t => `<i>${esc(t)}</i>`).join('');
  paintMark(); paintTimer();
  renderRecipe(); show('recipe'); scrollTo(0, 0);
}

const paintMark = () => $('rmark').classList.toggle('on', marks.has(rName));

/* ── 요리 타이머 ─────────────────────────────────────────────
   화면을 끄거나 다른 앱으로 가면 브라우저가 타이머를 늦추거나 소리를 막는다.
   그래서 남은 시간을 초 단위로 세지 않고 `끝나는 시각`을 잡아 둔다 —
   돌아왔을 때 흘러간 만큼이 정확히 반영된다. */
let tEnd = 0, tId = null, tMin = 5, actx = null;
const PRESETS = [5, 15, 30, 45, 60];   // 칩은 성큼성큼, 사이 값은 ±를 꾹 눌러 맞춘다
const mmss = ms => { const t = Math.max(0, Math.ceil(ms / 1000));
  return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };

function beep(){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    [0, .45, .9].forEach(t => {
      const o = actx.createOscillator(), g = actx.createGain(), at = actx.currentTime + t;
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0, at);
      g.gain.linearRampToValueAtTime(.22, at + .02);
      g.gain.exponentialRampToValueAtTime(.001, at + .32);
      o.connect(g); g.connect(actx.destination);
      o.start(at); o.stop(at + .34);
    });
  }catch(e){}
}

/** 꾹 누르면 이어서 올라간다. 5분을 40분으로 올리는 데 35번을 누르게 할 수는 없다.
 *  0.42초 뒤부터 0.09초마다 — 먼저 한 번은 바로 반응해야 눌린 느낌이 난다. */
function hold(btn, fn){
  let wait, rep;
  const stop = () => { clearTimeout(wait); clearInterval(rep); };
  btn.addEventListener('pointerdown', e => {
    e.preventDefault(); fn();
    wait = setTimeout(() => { rep = setInterval(fn, 90); }, 420);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
}

function paintTimer(){
  const left = tEnd - Date.now();
  const on = tEnd > 0 && left > 0;
  $('rtime').classList.toggle('on', on);
  $('rtimet').textContent = on ? mmss(left) : '';
}

function tick(){
  if(tEnd && Date.now() >= tEnd) return ringNow();
  paintTimer();
}

function startTimer(min){
  tMin = min;
  tEnd = Date.now() + min * 60000;
  clearInterval(tId); tId = setInterval(tick, 250);
  beep0();                      // 소리를 여기서 깨워 둔다. 다 됐을 때는 손을 안 대고 있다.
  sheet.classList.remove('on');
  paintTimer();
}
// 소리는 사용자가 누른 그 순간에만 열 수 있다. 시작 버튼에서 미리 열어 두고 바로 닫는다.
function beep0(){ try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if(actx.state === 'suspended') actx.resume(); }catch(e){} }

function stopTimer(){ tEnd = 0; clearInterval(tId); tId = null; paintTimer(); }

function ringNow(){
  stopTimer(); beep();
  if(navigator.vibrate) try{ navigator.vibrate([200, 120, 200, 120, 300]); }catch(e){}
  openSheet(`<div class="ring">
    <span class="rc2"><svg width="38" height="38" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="5.6"/><path d="M8 6.2V9l1.9 1.2M6.2 1.6h3.6"/></svg></span>
    <h4>시간이 다 되었어요!</h4>
    <p>${esc(rName || '')} · ${tMin}분</p></div>`);
}

/** 시계를 누르면 열린다. 돌고 있으면 남은 시간과 멈추기, 아니면 시간 고르기. */
function timerSheet(){
  const left = tEnd - Date.now();
  if(tEnd > 0 && left > 0){
    openSheet(`<h3>요리 타이머</h3>
      <p class="sub">${tMin}분으로 맞춰 뒀어요. 다 되면 알려드릴게요.</p>
      <div class="tdial"><div class="tv" id="tv">${mmss(left)}</div></div>
      <button class="tgo stop" id="tstop">멈추기</button>`);
    const h = setInterval(() => { const l = tEnd - Date.now();
      const el = document.getElementById('tv');
      if(!el || l <= 0) return clearInterval(h);
      el.textContent = mmss(l); }, 250);
    $('tstop').onclick = () => { stopTimer(); sheet.classList.remove('on'); toast('타이머를 멈췄어요'); };
    return;
  }
  openSheet(`<h3>요리 타이머</h3>
    <p class="sub">화면을 끄면 소리가 안 울릴 수 있어요. 켜 두시는 게 확실합니다.</p>
    <div class="tdial">
      <button id="tm" aria-label="1분 줄이기">−</button>
      <div class="tv" id="tv">${String(tMin).padStart(2, '0')}:00</div>
      <button id="tp" aria-label="1분 늘리기">+</button>
    </div>
    <div class="tpre">${PRESETS.map(p =>
      `<button data-m="${p}">${p}분</button>`).join('')}</div>
    <button class="tgo" id="tstart">시작</button>`);

  // ± 를 누를 때마다 시트를 다시 그리면 누르고 있던 버튼이 사라져 길게 누르기가 끊긴다.
  // 숫자와 칩 표시만 바꾼다.
  const paint = () => {
    $('tv').textContent = String(tMin).padStart(2, '0') + ':00';
    box.querySelectorAll('.tpre button').forEach(b =>
      b.classList.toggle('on', +b.dataset.m === tMin));
  };
  const bump = d => () => { tMin = Math.min(120, Math.max(1, tMin + d)); paint(); };
  hold($('tm'), bump(-1));
  hold($('tp'), bump(1));
  box.querySelectorAll('.tpre button').forEach(b =>
    b.onclick = () => { tMin = +b.dataset.m; paint(); });
  $('tstart').onclick = () => startTimer(tMin);
  paint();
}
$('rtime').onclick = timerSheet;
$('rmark').onclick = () => {
  if(marks.has(rName)) marks.delete(rName); else marks.add(rName);
  saveMarks(); paintMark();
  toast(marks.has(rName) ? '저장했어요' : '저장을 지웠어요');
};

function srcBlock(c, pc){
  return `<div class="rsrc">레시피 · ${esc(c.source || '')}` +
    (pc ? `<br>사진 · <a href="${esc(pc.u)}" target="_blank" rel="noopener">${esc(pc.t)}</a> · ${esc(pc.l)} · 위키미디어 공용`
        : `<br>사진 · 이 요리의 사진이 아직 없어 임시로 다른 사진을 걸어 두었어요`) + `</div>`;
}

function renderRecipe(){
  const c = (D.catalog || []).find(x => x.name === rName) || {};
  const st = (D.recipes || {})[rName] || [];
  const pc = (D.photos || {})[rName];
  const base = c.servings || 2;
  [...$('rseg').children].forEach(b => b.classList.toggle('on', b.dataset.t === rTab));
  $('rpane').classList.toggle('stepping', rTab === 'step');

  if(rTab === 'ing'){
    const groups = [];
    (c.ing || []).forEach(i => {
      let g = groups.find(x => x.t === i.t);
      if(!g) groups.push(g = { t: i.t, items: [] });
      g.items.push(i);
    });
    $('rpane').innerHTML =
      `<div class="serv">
         <span class="sl">인분</span>
         <div class="servc"><span id="servn">${rServ}인분</span>
           <button class="servb" id="servm" aria-label="한 인분 줄이기">−</button>
           <button class="servb" id="servp" aria-label="한 인분 늘리기">+</button></div>
       </div>
       <div class="ing">${groups.map(g => `<div class="igr">${esc(g.t)}</div>` + g.items.map(i => {
          const scaled = fmtR(i.v == null ? null : i.v / base * rServ, i.u);
          return `<div class="ir"><span>${esc(i.n)}</span>` +
                 `<b class="${scaled ? '' : 'raw'}">${esc(scaled || i.q || '조금')}</b></div>`;
        }).join('')).join('')}</div>` +
      (base !== rServ ? `<p style="margin:10px 2px 0;font-size:10.5px;color:var(--l-tx3)">레시피 기준 ${base}인분에서 ${rServ}인분으로 늘려 계산했어요. <b style="font-weight:700">적당량</b>처럼 양이 안 적힌 것은 그대로예요.</p>` : '') +
      srcBlock(c, pc);
    $('servm').onclick = () => { rServ = Math.max(1, rServ - 1); renderRecipe(); };
    $('servp').onclick = () => { rServ = Math.min(12, rServ + 1); renderRecipe(); };
    return;
  }

  if(!st.length){
    $('rpane').innerHTML = `<p style="font-size:13px;color:var(--l-tx3)">아직 만드는 법이 없어요.</p>` + srcBlock(c, pc);
    return;
  }
  const s = st[stepI];
  $('rpane').innerHTML =
    `<div class="scard">
       <div class="si"><img src="${dishPic(rName)}" alt=""></div>
       <div class="sb">
         <div class="snum">${stepI + 1} / ${st.length}</div>
         <div class="stx">${esc(s.d)}${s.t ? `<span class="stip">${esc(s.t)}</span>` : ''}</div>
       </div>
     </div>
     <div class="grow"></div>
     ${srcBlock(c, pc)}
     <div class="sfoot">
       <div class="dots">${st.map((_, i) => `<i class="${i === stepI ? 'on' : ''}"></i>`).join('')}</div>
       <div class="snav">
         <button class="prev" id="sprev"${stepI ? '' : ' disabled'}>이전</button>
         <button class="next" id="snext">${stepI < st.length - 1 ? '다음' : '다 만들었어요'}</button>
       </div>
     </div>`;
  $('sprev').onclick = () => { if(stepI > 0){ stepI--; renderRecipe(); scrollTo(0, 0); } };
  // 마지막에서는 비활성 버튼으로 막아 두지 않는다. 다 만든 사람에게 필요한 건 나가는 길이다.
  $('snext').onclick = () => {
    if(stepI < st.length - 1){ stepI++; renderRecipe(); scrollTo(0, 0); return; }
    show('pick'); renderPick(); scrollTo(0, 0); toast('맛있게 드세요');
  };
}

$('rseg').onclick = e => { const b = e.target.closest('button'); if(!b) return;
  rTab = b.dataset.t; renderRecipe(); scrollTo(0, 0); };
// 레시피에서 저장을 껐다 켰다 하고 나오면 목록이 달라져 있다. 다시 그리지 않으면 옛 화면이 남는다.
$('rback').onclick = () => { show('pick'); renderPick(); scrollTo(0, 0); };

function renderList(){
  const s = set();
  $('lsub').textContent = `성인 ${people} · 요리 ${s.dishes.length}가지 · 살 것 ${s.buyCount}가지`;
  $('ovl').innerHTML = `
    <div class="k">이 재료들이 겹쳐요</div>
    <div class="tags">${s.overlaps.map(o =>
      `<span class="tg">${esc(o.name)}<i>${o.used}끼</i></span>`).join('')}</div>
    <div class="sum"><span>따로 사면 <s>${s.apart}가지</s></span><span>·</span><span>한 번에 사면</span><b>${s.buyCount}가지</b></div>`;
  $('cats').innerHTML = s.groups.map(g => `
    <section class="cat">
      <h2><span class="ic"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" style="color:var(--ink)">${ICONS[g.cat]||''}</svg></span>
        <span class="n">${esc(g.cat)}</span><span class="c">${g.items.length}가지</span></h2>
      ${g.items.map(it => { const u = usedOf(it.name); return `
        <button class="row${done[it.name]?' done':''}" data-n="${esc(it.name)}">
          <span class="nm">${esc(it.name)}</span>
          ${u >= 2 ? `<span class="ov">${u}끼</span>` : ''}
          <span class="qt">${qtyOf(it)}</span>
          <span class="ck"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 5"/></svg></span>
        </button>`; }).join('')}
    </section>`).join('');
}

/** 화면이 바뀌면 바탕색과 상태바 색도 같이 바꾼다. 안 그러면 좌우 끝과
 *  스크롤 바운스에서 반대 색이 비친다. */
function show(id){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id));
  const light = id === 'list';   // 밝은 화면은 장보기 목록 하나다. 고르기·훑기·레시피는 어둡다.
  document.body.classList.toggle('light', light);
  const m = document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content', light ? '#f5f4f1' : '#2b2926');
}
let tt;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1900); }

const sheet = $('sheet'), box = $('sheetbox');
sheet.onclick = e => { if(e.target === sheet) sheet.classList.remove('on'); };
function openSheet(html){
  box.innerHTML = '<div class="sxbar"><button class="sx" aria-label="닫기">' +
    '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>' + html;
  box.querySelector('.sx').onclick = () => sheet.classList.remove('on');
  sheet.classList.add('on'); box.scrollTop = 0;
}

$('tabs').onclick = e => { const b = e.target.closest('.tab'); if(!b) return;
  if(b.dataset.b){ browsing = true; renderPick(); scrollTo(0, 0); return; }
  browsing = false; si = +b.dataset.i; people = set().people; done = {};
  renderPick(); scrollTo(0, 0); };
/** 조합 고르기 — 하나씩 넘기면 3번이 좋았는데 7번까지 가버렸을 때 되돌아갈 수가 없다.
 *  전부 펼쳐 두고 한 번에 고른다. 먹을 사람은 그대로 두고(축이 같으면 인원도 같은 맥락)
 *  체크만 비운다 — 조합이 바뀌면 재료가 달라진다. */
function pickCombo(next){
  si = next; axis().i = si; done = {}; renderPick();
  sheet.classList.remove('on'); scrollTo(0, 0);
}
$('again').onclick = () => {
  const ix = siblings();
  openSheet(`<h3>조합 ${ix.length}가지</h3>
    <p class="sub">재료가 가장 많이 겹치는 순서예요. 무엇을 고르든 아무렇게나 고를 때보다 적게 삽니다.</p>` +
    ix.map(i => { const s = D.sets[i]; return `
      <button class="rc${i===si?' now':''}" data-i="${i}">
        <div class="no">${s.vi}</div>

          <div class="mt">살 것 ${s.buyCount}가지<br>${s.dishes.map(d => esc(d.name)).join(' · ')}</div></div>
      </button>`; }).join(''));

};
$('minus').onclick = () => { people = Math.max(1, people - 1); renderPick(); };
$('plus').onclick  = () => { people = Math.min(12, people + 1); renderPick(); };
$('go').onclick    = () => { renderList(); show('list'); scrollTo(0, 0); };
$('back').onclick  = () => { show('pick'); scrollTo(0, 0); };
$('cats').onclick  = e => { const r = e.target.closest('.row'); if(!r) return;
  const n = r.dataset.n; done[n] = !done[n]; r.classList.toggle('done', done[n]); };

/** 조합에 든 요리 목록. 누르면 그 요리의 레시피 페이지로 간다.
 *  전에는 여기서 펼침으로 조리법을 보여줬는데, 레시피를 읽는 길이 둘이면 헷갈린다.
 *  읽는 자리는 레시피 페이지 하나로 모은다. */
const ARROW = '<svg class="ar" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>';
function dishSheet(){
  openSheet(
  `<h3>요리 ${set().dishes.length}가지</h3>
   <p class="sub">눌러서 만드는 법을 봅니다. 출처는 레시피마다 답니다 — 다른 곳 레시피를 더해도 이 목록에 그대로 드러나요.</p>` +
  set().dishes.map((d, i) => `

$('dishes').onclick = dishSheet;
$('dishmore').onclick = dishSheet;

/** 공유 — 체크한 건 이미 산 것이니 빼고, 남은 것만 보낸다.
 *  기기 공유 시트 → 클립보드 → 텍스트 상자 순으로 물러난다. */
function shareText(){
  const s = set();
  const left = s.groups.map(g => ({ cat: g.cat, items: g.items.filter(it => !done[it.name]) }))
                       .filter(g => g.items.length);
  const n = left.reduce((a, g) => a + g.items.length, 0);
  const body = left.map(g => `[${g.cat}]\n` +
      g.items.map(it => `· ${it.name} ${qtyOf(it)}`).join('\n')).join('\n\n');
  return {
    n,
    text: `${s.title.replace(/\n/g, ' ')} — 성인 ${people}\n살 것 ${n}가지\n\n${body}\n\n` +
          `요리 · ${s.dishes.map(d => d.name).join(' · ')}\n` +
          `레시피 출처 · ${sourceCounts().map(([x, c]) => x + ' ' + c).join(' · ')}\n보글 · BOGL°`
  };
}
$('share').onclick = async () => {
  const { n, text } = shareText();
  if(!n) return toast('전부 담으셨어요');
  if(navigator.share){
    try { await navigator.share({ title: '장볼 것 ' + n + '가지', text }); return; } catch(e){ if(e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(text); toast('장볼 것 ' + n + '가지 복사했어요'); return; } catch(e){}
  openSheet(`<h3>장볼 것 ${n}가지</h3><p class="sub">전체 선택해서 가져가세요. 체크한 건 빠져 있어요.</p>
             <textarea readonly>${esc(text)}</textarea>`);
  box.querySelector('textarea').select();
};

$('find').onclick = () => {
  const items = set().groups.flatMap(g => g.items).filter(it => !done[it.name]);
  if(!items.length) return toast('전부 담으셨어요');
  openSheet(`<h3>쿠팡에서 찾기</h3>
    <p class="sub">재료마다 검색으로 열려요. 상품을 저장해 두지 않아서 품절이나 단종으로 링크가 끊기지 않습니다.</p>` +
    items.map(it => `<a class="lk" target="_blank" rel="noopener"
        href="https://www.coupang.com/np/search?q=${encodeURIComponent(it.name)}">
        <span>${esc(it.name)}</span><span class="q">${qtyOf(it)}</span>
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></a>`).join(''));
};

renderPick();
</script>
