가늘게 채쳐준다."},{"d":"끓는 물에 살짝 데쳐준다.","t":"호박을 데칠 때 소금을 넣어주면 녹색이 선명해 진다."},{"d":"데친 호박의 물기를 짜낸 후 큰 볼에 담는다."},{"d":"양파와 대파, 고추를 잘게 썰어 볼에 넣는다."},{"d":"호박이 담긴 볼에 양념을 넣고 잘 무쳐준다.","t":"취향에 따라 소금과 설탕의 양을 조절한다."}],"가지쇠고기볶음":[{"d":"가지는 반으로 가른 후 어슷하게 저며 썰고, 대파는 어슷하게 썬다."},{"d":"고추는 물에 헹궈 씨를 뺀 후 어슷하게 썬다."},{"d":"쇠고기는 기름이 적당하게 섞인 등심으로 준비해 얇게 저며 썬 후 청주, 후춧가루로 밑간한다."},{"d":"달군 프라이팬에 기름을 두르고 ②의 쇠고기를 넣어 볶는다."},{"d":"③의 쇠고기가 알맞게 익으면 기름을 넉넉하게 넣고 ①의 가지와 고추를 넣어 간장, 다진 파, 다진 마늘, 소금, 후춧가루로 간하여 볶는다."},{"d":"깨소금, 참기름으로 마무리한 뒤 접시에 담아낸다."}],"청국장찌개":[{"d":"쇠고기는 기름기 없는 것으로 얇게 저며 썰고 잘 익은 배추김치는 속을 털어내고 먹기 좋게 썬다."},{"d":"대파는 어슷썰고 무와 두부는 납작하게 썰어놓는다."},{"d":"냄비에 쇠고기, 김치, 무를 넣고 김치국물을 조금 넣어 볶다가 반 정도 익으면 물 4컵을 부어 끓인다."},{"d":"고기가 익으면 청국장을 풀고 끓을 때 다진 마늘을 넣는다."},{"d":"③을 뚝배기에 옮겨 담고 한소끔 끓이다가 대파와 두부를 넣는다."},{"d":"상에 내기 직전에 소금으로 간을 맞춘 뒤 불에서 내린다."}],"콩나물무밥":[{"d":"쌀은 씻어 건져 놓는다.","t":"* 돼지고기 양념장  간장 1큰술, 설탕 1작은술, 마늘 1작은술, 참기름약간, 후추약간"},{"d":"콩나물은 통통한 것으로 다듬어 씻어 놓는다."},{"d":"돼지고기는 살코기로 준비해 4~5㎝ 길이로 굵게 채썬다."},{"d":"무는 깨끗이 씻어서 폭 0.5㎝ 길이 4~5㎝ 길이로 굵게 채썬다."},{"d":"취나물은 끓는 물에 소금을 조금 넣고 데쳐서 찬물에 1시간 정도 담가 쓴맛을 우려낸다. 여러번 헹군 뒤 물기를 꼭 짜서 4㎝ 길이로 썬다."},{"d":"돼지고기에 양념을 해서 프라이팬에 볶아 놓는다."}],"부추잡채":[{"d":"양파, 홍고추, 청고추는 얇게 채를 썰어 준비한다."},{"d":"돼지고기는 얇게 채를 썰어 마늘, 생강, 굴소스, 깨소금을 넣고 양념해둔다."},{"d":"부추는 4cm 길이로 썰어 준비한다."},{"d":"재료가 준비되면 프라이팬에 기름을 두르고 양념한 돼지고기를 볶는다."},{"d":"돼지고기를 볶다가 양파, 고추를 넣고 소금을 뿌려 간을 한다."},{"d":"채소가 어느 정도 숨이 죽으면 준비한 부추를 넣어 살짝 볶은 후 참기름 한방울을 넣어 마무리한다."}],"조기찜":[{"d":"조기는 비늘을 긁고 배를 갈라 내장과 아가미를 꺼내고 지느러미도 잘라 낸 다음 찬물에 씻는다."},{"d":"무와 감자는 큼직하게 썬다."},{"d":"양파는 한입 크기로 썰고 청고추, 홍고추, 대파는 어슷하게 썬다."},{"d":"마늘 2쪽은 얇게 썰고 나머지는 다진다. 손질된 채소에 고추장, 고춧가루, 생강즙, 참기름, 소금, 후춧가루를 넣어 섞는다."},{"d":"분량의 양념장을 만든다."},{"d":"냄비 바닥에 무와 감자, 조기를 넣고 준비한 양념장의 1/2과 물 1컵을 넣어 끓인다."}],"매운가지볶음":[{"d":"가지를 깨끗하게 씻어 반으로 갈라 어슷썰기를 한다."},{"d":"양파는 채 썰고, 대파와 고추는 어슷하게 썬다."},{"d":"달궈진 팬에 양파를 반투명 해질 때 까지 볶다가 가지와 양념을 넣고 볶는다."},{"d":"가지가 거의 익어 가면 고추와 대파를  넣어 볶아준다."}],"호박양파국":[{"d":"호박은 0.5cm 두께로 반달썰기한다."},{"d":"양파도 같은 굵기로 채썰어 둔다."},{"d":"두부는 크지않게 네모지게 썰어둔다."},{"d":"대파, 홍고추를 어슷하게 썰어둔다."},{"d":"기름을 두르지 않고 볶은 국멸치를 한소끔 끓인 물에 된장 한 큰술을 덩어리가 지지 않도록 잘 풀어준다."},{"d":"⑤가 끓기 시작하면 호박, 양파, 두부를 차례대로 넣어준다."}],"김치볶음밥":[{"d":"김치는 1cm 크기로 썰고 햄, 양파, 감자도 1cm 정도의 크기로 잘게 썬다."},{"d":"프라이팬에 기름을 두르고 김치와 감자를 볶다가 햄과 양파를 넣고 볶아준다."},{"d":"양파가 어느 정도 익으면 밥을 넣고 펴듯이 볶아준다."},{"d":"소금과 후춧가루로 간을 맞추고 계란프라이를 얹어 낸다."}],"오징어볶음과소면":[{"d":"오징어는 배를 갈라 내장과 다리를 떼어낸 뒤, 겉면의 껍질을 위에서 아래로 벗긴다. 미끌거려서 잘 벗길 수 없으면 굵은 소금을 뿌리거나 종이 타월로 껍질을 붙잡고 벗기면 손쉽다."},{"d":"오징어를 깨끗이 씻은 뒤, 안쪽에 사선으로 교차되게 칼집을 촘촘히 넣은 후 폭 1cm, 길이 4cm 크기의 길쭉한 네모로 썬다."},{"d":"양파, 양배추, 당근은 굵게 채썰고 청고추, 홍고추는 어슷썰어 씨를 털어낸다."},{"d":"볼에 손질한 오징어와 채소를 담은 뒤, 매운 볶음 양념장을 넣어 간이 고루 배도록 주물러 10분 정도 재운다."},{"d":"팬을 달구어 기름을 두른 뒤, 양념한 오징어와 채소를 한꺼번에 넣어 센불에서 재빨리 볶는다."},{"d":"오징어가 솔방울 모양으로 오그라들면서 익으면 꺼낸 뒤, 그릇에 담고 통깨를 넉넉히 뿌린다."}],"두부채소냉채":[{"d":"두부는 1cm 정도의 두께로 썰어 깨끗한 행주로 물기를 제거한 후 소금으로 약하게 간하여 프라이팬에 노릇하게 지져낸다."},{"d":"지져낸 두부는 열기를 식혀 냉장고에 차게 보관한다."},{"d":"쇠고기는 편육용으로 삶아 식힌다. (삶을 때는 쇠고기의 냄새를 없애기 위해 마늘, 통후추 등을 소량 넣어 준다)"},{"d":"양배추, 오이, 당근, 쇠고기, 두부는 길이 5cm, 넓이 2cm 정도의 막대모양으로 썬다."},{"d":"땅콩가루 1큰술, 식초 1큰술, 간장 1/2큰술, 갠겨자 1/2큰술, 황설탕 1/2큰술, 소금, 참기름약간을 믹서기에 넣고 곱게 갈아 땅콩겨자소스를 만들어 차게 보관해 둔다."},{"d":"접시에 위의 재료를 보기좋게 담은 후 땅콩겨자소스를 곁들여 낸다."}],"버섯청국장찌개":[{"d":"팽이버섯은 뿌리 부분을 자른 뒤 작은 덩어리로 나누고, 느타리버섯은 끓는 물에 데쳐 물기를 꼭 짠 다음 먹기 좋은 크기로 쭉쭉 찢는다."},{"d":"양송이버섯은 깨끗이 씻어 밑동 끝의 지저분한 부분을 잘라내고 껍질을 벗긴 다음 모양을 살려 썬다."},{"d":"호박과 두부는 도톰하게 썰고, 굵은 파와 고추는 어슷하게 썰어서 씨를 털어낸다."},{"d":"뚝배기에 쌀뜨물을 부어 끓으면 청국장을 푼 다음 한소끔 끓인다."},{"d":"국물이 보글보글 끓으면 손질한 양송이버섯, 느타리버섯, 두부, 호박, 홍고추를 넣고 다시 한번 끓인다."},{"d":"청국장이 한소끔 끓으면 굵은 파, 청고추, 다진 마늘을 넣고 살짝 끓인 후 마지막에 팽이버섯을 넣고 불에서 내려 상에 낸다."}],"양송이버섯죽":[{"d":"찹쌀을 2시간 정도 불린다."},{"d":"양송이버섯은 껍질을 벗기고 모양을 살려서 썬다."},{"d":"호박, 당근, 실파, 깻잎은 깨끗이 씻은 후 3㎝ 길이로 채썬다."},{"d":"불린 찹쌀은 방망이로 쌀알이 1/2정도가 되도록 부순다."},{"d":"냄비에 참기름을 두르고 ④를 볶다가 물을 붓고 끓인다."},{"d":"쌀알이 퍼지면 썰어 놓은 채소를 넣고 한번 더 끓여 소금으로 간한다."}],"찬밥지짐이":[{"d":"양파, 당근은 다진다."},{"d":"실파는 송송썬다."},{"d":"두부는 곱게 으깬다."},{"d":"찬밥, 양파, 당근, 실파, 두부를 섞고 콩가루와 계란을 넣은 뒤 소금과 후춧가루로 간을 맞춘다."},{"d":"프라이팬에 기름을 두르고 둥글게 지진다."}],"고등어양념구이":[{"d":"고등어를 머리, 꼬리와 내장을 제거하고 손질한 후, 포를 떠서 뼈를 발라낸다.","t":"양념장 : 간장 3큰술, 굵은 고춧가루 2큰술, 고운 고춧가루 1큰술, 대파 1개, 양파 1개, 실파 3~4뿌리, 홍고추 2개, 청고추 2개, 정종 2큰술, 생강 1개, 마늘 5개, 참기름 2작은술, 깨소금 1큰술, 물엿 2큰술"},{"d":"양념장을 만들어 고등어를 12시간 재운 후 석쇠에 굽는다."},{"d":"구울 때 양념장을 발라 가면서 굽는다."},{"d":"센 불에 구우면 생선이 완전히 익지 않으므로 중, 약불에 구워낸다."}],"닭가슴살해파리샐러드":[{"d":"닭가슴살은 끓는물에 삶은 뒤 손으로 먹기좋게 찢어놓는다."},{"d":"해파리는 소금기를 씻어내고 끓는물에 삶아서 찬물에 식힌 후 설탕 2큰술, 소금 약간, 식초 2큰술, 물 8큰술을 섞어  담가둔다."},{"d":"홍고추, 청고추는 잘게 썰어놓는다."},{"d":"그릇에 물 3큰술, 식초 4큰술, 참기름 1작은술, 간장 1작은술, 소금 약간, 설탕 2큰술, 꿀 2큰술, 홍고추, 청고추를 넣고 잘 섞어 소스를 만든다."},{"d":"오이와 레몬은 편으로 얇게 썰어놓는다."},{"d":"④의 소스에 찢어놓은 닭가슴살과 해파리를 묻힌 후 접시에 오이를 깔고 그 위에 담아낸다."}],"잔치국수":[{"d":"찬물에 멸치를 넣고 끓여 멸칫국물을 우려내고 국간장이나 소금으로 간을 해 멸치장국을 만들어준다."},{"d":"쇠고기는 불고기양념을 해서 재워 두었다가 팬에 국물없이 볶아낸다."},{"d":"호박, 당근도 채썰어 소금 간을 해서 볶아주고 계란은 지단을 부쳐 채썬다."},{"d":"분량의 양념재료를 섞어 매콤한 양념장을 만들어준다."},{"d":"소면은 물에 삶아 건져서 찬물에 헹군 다음 1인분씩 사리지어 놓는다."},{"d":"국수대접에 사리지은 소면을 담고 멸치장국을 부어 준비한 고명을 골고루 얹고 양념장을 곁들여 낸다."}],"골뱅이볶음":[{"d":"통조림 골뱅이는 끓는물에 살짝만 데쳐내어 깔끔하게 준비한다."},{"d":"골뱅이가 식으면 얇게 저며썬다."},{"d":"표고버섯, 홍피망, 청피망, 양파는 얇고 네모나게 썰고 마늘과 파는 다진다."},{"d":"팬에 기름을 두르고 표고버섯, 양파를 같이 볶다가 청피망, 홍피망을 넣고 같이 볶아준다."},{"d":"④의 채소들이 볶아지면 물 1/4컵을 붓고 끓이다가 진간장으로 간을 맞춘다."},{"d":"데친 골뱅이, 다진 파, 다진 마늘, 후춧가루, 깨소금, 참기름을 넣고 젓다가 녹말물을 조금씩 넣어가며 걸쭉하게 농도를 맞춘다."}],"모듬전":[{"d":"(감자전) 감자는 깨끗하게 씻고 껍질을 벗겨 1/2은 곱게 채썰고, 1/2은 강판에 곱게 갈아 냉수에 15분정도 담가둔다."},{"d":"전분을 빼낸 ①을 고운 거즈에 싸서 꼭 짠 뒤 밀가루와 소금을 넣고 섞는다. 반죽이 되면 물을 조금씩 섞어주고 1cm 길이로 썬 부추도 같이 넣어 섞어준다."},{"d":"반죽에 소금과 참기름을 조금 넣어 간을 맞춘뒤 팬에 식용유를 조금 두르고 한 숟가락씩 떠서 5cm 정도의 크기로 둥글게 만든다. 불을 약하게 하여 노릇하게 지져낸다."},{"d":"(양파전) 양파는 껍질을 말끔히 벗긴 뒤 0.5cm 두께로 둥글게 썰고 쇠고기는 곱게 다져서 소금, 참기름, 후춧가루로 밑간한다."},{"d":"양파의 중심부를 떼어내 링 모양으로 만든 뒤 링의 안쪽에 밀가루를 살짝 바르고 양념한 쇠고기를 양파 가운데의 빈 곳에 채워 넣는다. 위로 올라오게 채우면 익으면서 더 많이 올라오게 되므로 약간 납작한 듯이 채우도록 한다."},{"d":"전체적으로 밀가루를 묻힌 뒤 털어내고 계란물에 담갔다가 건져내어 팬에 식용유를 두르고 지진다."}],"채소국수":[{"d":"오이는 두께 0.3cm x 폭 0.3cm, 길이 5cm로 채썰어 소금에 절였다가 물기를 짠다.","t":"**쇠고기, 표고버섯 양념장: 간장 2작은술, 설탕 1/2작은술, 다진 파 1/2작은술, 다진 마늘 1/2작은술, 후춧가루 약간, 깨소금 약간, 참기름 약간  **양념간장 : 고춧가루 1큰술, 간장 1큰술, 다진 마늘 1작은술, 다진 파 1작은술, 깨소금 약간, 참기름 약간      * 양념간장"},{"d":"쇠고기는 두께와 폭이 0.3cm, 길이 5cm로 썰어 양념한다."},{"d":"표고도 물에 불려 쇠고기와 같은 크기로 채썰어 양념한다."},{"d":"부추는 잘 씻어 5cm 길이로 잘라둔다."},{"d":"계란은 노른자와 흰자를 분리하여 지단을 붙이고 채썰어 둔다."},{"d":"번철에 오이, 표고, 쇠고기순으로 볶는다."}],"순대볶음":[{"d":"프라이팬에 기름을 두르고 다진 마늘을 볶다가 양파, 양배추를 볶는다."},{"d":"양배추에 기름이 돌면 분량의 양념과 쫄면 혹은 더운 물에 불린 당면을 넣고 볶는다."},{"d":"마지막으로 순대와 깻잎을 넣고 볶아낸다."}],"콩나물국밥":[{"d":"뚝배기에 한 사람이 먹을 만큼의 밥을 담고 콩나물은 씻어 삶아 밥이 덮일 만큼 수북이 얹는다."},{"d":"①위에 어슷썬 실파와 청고추, 결대로 찢은 장조림을 보기 좋게 둘러 얹고, 그 위에 잘게 썬 김치와 다진 마늘을 얹는다."},{"d":"재료를 넣은 뚝배기에 육수를 자작하게 부어 보글보글 끓이다가 상에 내기 직전에 살짝 구운 김을 비벼 얹고 생계란을 깨뜨려 얹은 다음 깨소금을 뿌린다."},{"d":"새우젓을 따로 곁들여 식성대로 간을 맞춰 먹는다."}],"김치적":[{"d":"김치는 소를 털어내고 줄기만 길이 8cm, 너비 2cm로 썰어 참기름을 고루 묻힌다."},{"d":"쇠고기는 도톰하게 포를 떠 잔칼질하여 김치보다 약간 길게 썬다."},{"d":"표고버섯은 1cm 폭으로 썰고 도라지는 삶아서 반으로 갈라 참기름과 소금으로 무친다."},{"d":"준비된 재료를 꼬치에 꽂아 밀가루를 묻힌 후 계란물을 묻혀 기름에 지진다."}],"갈치무조림":[{"d":"갈치는 토막내 비늘을 벗기고 칼집을 넣어 준비하며, 대파와 홍고추는 어슷썰고, 마늘은 편썰어 준비한다."},{"d":"무는 큼직하게 나박썰어 냄비 바닥에 깔아 준비한다."},{"d":"그릇에 분량의 양념 재료를 넣고 준비한 파와 마늘을 고루 섞는다."},{"d":"냄비에 깔아 둔 무 위에 갈치를 얹고, 그 위에 ③의 양념장을 얹어 물을 자작하게  부어 끓인다."},{"d":"15분간 끓이다가 국물이 졸아들면 뚜껑을 열고 파와 고추를 넣은 후 참기름을 넣어 불에서 내린다."}],"나박김치":[{"d":"무는 나박썰기하고 배추는 속대만 골라 무와 같은 크기로 썰고 따로 소금에 절인다. 30분 정도 절인 뒤 한 번 뒤집어 준다.","t":"나복저(蘿 菹)라고도 한다. 무를 얄팍하고 네모지게 썰어서 소금에 절였다가 건져서 고춧가루로 빨갛게 물들인 다음, 파 ·마늘 ·생강 등의 양념을 넣고 미나리와 실고추를 썰어 넣어 익히면 무의 알싸한 맛이 국물에 베어 청량감을 맛볼 수 있다."},{"d":"미나리는 씻어 3cm 길이로 자르고 홍고추는 반으로 갈라 씨를 털고 채썬다."},{"d":"굵은 파, 생강, 마늘도 곱게 채썬다."},{"d":"큰 그릇에 물 20컵을 붓고 고춧가루 1/3컵을 거즈에 싸서 물에 담가 흔들어 고춧가루 물을 만든 뒤 소금간을 한다."},{"d":"절여진 배추와 무에 채썬 파, 마늘, 생강, 홍고추, 미나리를 섞어 고루 버무린다."},{"d":"잘 버무려진 나박김치를 항아리에 먼저 담고 삼삼하게 간을 한 김칫국을 부어 숙성시킨다."}],"사골우거지탕":[{"d":"사골은 찬물에 담가 핏물을 뺀 후 냄비에 물을 붓고 끓이다가 첫 물은 따라버리고 다시 물을 부어 끓인다."},{"d":"사태는 덩어리째 핏물을 뺀 후 ①에 같이 넣고 푹 익힌다."},{"d":"우거지는 끓는 물에 소금을 넣고 푹 삶은 후 찬물에 담가 냄새를 우려낸 뒤 물기를 꼭 짜고 5cm 폭으로 썰고 고기는 건져서 얄팍하게 저민다."},{"d":"③에 된장, 마늘을 넣어 골고루 무친다."},{"d":"뽀얗게 우러난 사골 국물을 4컵 정도 냄비에 넣고 ④를 넣어 한소끔 끓으면 어슷하게 파, 고추를 넣고 소금으로 간을 맞춘 다음 고춧가루를 조금 넣는다."}],"생태국":[{"d":"생태는 씻어 내장을 빼고 비늘을 긁은 뒤 다시 씻어 5cm 길이로 토막내어 소금을 살짝 뿌려둔다."},{"d":"콩나물은 뿌리를 떼고 무는 0.5cm 두께로 얄팍하게 나박썬다. 붉은 고추는 어슷썰어 씨를 털고 미나리는 줄기만 4cm 길이로 썬다."},{"d":"마지막에 씻은 쌀뜨물을 받아 냄비에 붓고 센불에서 끓이다가 손질한 생태를 넣는다."},{"d":"국물이 끓어 생태가 익으면 무와 콩나물을 넣고 뚜껑을 덮은채 한소끔 끓인다."},{"d":"거의 끓었을 때 붉은 고추와 다진 마늘, 미나리를 넣고 소금과 후춧가루로 간 한 뒤 더 끓이다가 미나리가 살짝 숨이 죽으면 불에서 내린다."}],"돼지갈비찜":[{"d":"돼지갈비는 기름기를 떼어내고 손질하여 칼집을 충분히 내 찬물에 담가 핏물을 빼준다."},{"d":"홍고추는 배를 갈라 씨를 털어내어 어슷썰고 감자와 당근, 무를 밤톨 크기로 썰어 가장자리를 둥글려준다."},{"d":"큰 그릇에 분량의 양념 재료를 섞어 양념장을 만들어 ①의 갈비에 재워놓는다."},{"d":"프라이팬에 기름을 넉넉히 두르고 홍고추를 볶아 고추기름을 낸 후 재운 갈비를 앞뒤로 노릇하게 지진다."},{"d":"④에 감자, 무, 당근을 넣고 뒤적이면서 돼지갈비가 잠길 정도로 물을 부어, 뚜껑을 덮고 끓이다가 갈비가 익을 무렵 고추장과 고춧가루를 넣고 윤기나게 조려낸다."}],"콩나물잡채":[{"d":"깨끗이 다듬은 콩나물은 냄비에 안치고 소금을 조금 넣은 후 물 1컵을 붓고 삶는다. 7분 정도 지나면 체에 밭쳐 물기를 뺀다."},{"d":"물에 불린 표고와 쇠고기는 채썰어 갖은 양념(간장, 설탕, 다진 파, 마늘, 후춧가루, 깨소금) 한다."},{"d":"미나리는 다듬어 5cm 길이로 썰어 놓는다."},{"d":"양파와 당근은 채썰어 소금에 절여놓고 계란은 풀어 지단을 부쳐 채썬다."},{"d":"당근, 미나리를 각각 볶아내고 양념해둔 표고와 쇠고기도 볶는다."},{"d":"삶은 콩나물에 참기름 1/2큰술과 소금으로 무친다."}],"계란말이주먹밥":[{"d":"다시마는 마른 행주로 닦은 후 냄비 바닥에 깔아 쌀을 넣어 고슬하게 밥을 짓고, 다시마를 빼낸 후 분량의 배합초를 넣어 버무려 식힌다."},{"d":"볼에 계란을 풀고 소금간을 한 뒤 프라이팬에 식용유를 두르고 계란 지단을 부친다."},{"d":"지단이 식으면 가로 x 세로가 20cm x 20cm 정도가 되도록 자른다."},{"d":"표고버섯을 불린 다음 얇게 채썰고, 오이는 돌려깎기한 후 껍질 부분만 채를 썰고, 당근은 곱게 채썰어 각각 볶은 후 소금으로 간을 한다."},{"d":"미나리는 잎을 떼고 끓는 소금물에 데친다."},{"d":"계란 지단 위에 밥을 펴고 볶아 둔 표고버섯, 오이, 당근을 올리고 김밥 말듯이 말아준 후 데친 미나리로 한입 크기 마다 묶어서 썬다."}],"김치두부쌈":[{"d":"김치는 얇게 썰어둔다."},{"d":"두부는 끓는물에 데쳐 삼각모양으로 0.8cm 두께로 썰어 놓는다."},{"d":"돼지고기는 가제에 싸서 끓는물에 대파, 생강, 소금을 넣고 삶은 후 알맞게 썬다."},{"d":"접시에 돼지고기를 깔고, 두부를 돌려 담은 후 김치를 얹어 보기좋게 준비한다."},{"d":"쌈채소와 쌈장을 곁들이면 더욱 좋다."}],"제육겨자쌈":[{"d":"돼지고기 안심을 준비하여 대파, 통후추, 양파 등을 넣고 삶는다.","t":"**돼지고기는 냄새가 많이 나기때문에 향신료나 채소등을 넣어 삶아준다. 양겨자 대신 겨자가루를 물에 개어 대신 넣어주어도 좋다."},{"d":"당근, 양파, 깻잎은 5cm 정도로 채썰어 놓는다."},{"d":"양겨자 1/2큰술, 설탕 1/2작은술, 소금 약간, 식초 1/4 작은술로 양념장을 만들어 ②번을 섞어준다."},{"d":"삶은 돼지고기는 한 입 크기로 준비하여 ③의 채소를 넣어 마주보게 한다.(샌드위치모양으로 겹쳐지게 한다.)"}],"갈치조림":[{"d":"갈치를 깨끗이 손질하여 알맞은 크기로 잘라 놓는다.","t":"양념장 만들기 : 간장 2큰술, 굵은고춧가루 2큰술, 고운고춧가루 1큰술, 설탕 1큰술, 물엿 2큰술, 다진생강 2작은술, 다진마늘 1큰술, 정종 1큰술, 된장 2작은술, 후춧가루 약간, 소금 약간"},{"d":"채소는 길이 4~5cm, 두께 2.5cm 정도로 얇게 썰어 보기 좋게 놓는다."},{"d":"그 위에 생선을 얹고 양념장을 뿌려 중, 약불에 끓인다."},{"d":"끓인 후, 홍고추와 청고추로 장식한다."}],"동태찌개":[{"d":"동태는 비늘을 긁고 내장을 제거한 후 5cm 길이로 토막 낸다."},{"d":"무는 0.5cm 두께로 나박썰고 애호박은 도톰하게 반달썬다."},{"d":"청고추, 홍고추, 대파는 어슷썬다."},{"d":"두부는 1cm x 4cm x 3cm 크기로 썬다."},{"d":"냄비에 물 또는 육수를 붓고 고추장을 풀어 끓으면 무와 동태를 넣은 뒤 남은 재료를 모두 넣고 끓이면서 소금으로 간을 맞춘다."}],"김치수제비":[{"d":"냄비에 물을 붓고 멸치, 다시마를 넣어 끓기 시작하면 다시마는 건져내고 20분정도 멸치 물을 우려낸다."},{"d":"김치는 속을 털어낸 후 물기를 제거한 후 한 입 크기로 썰어놓는다."},{"d":"감자, 양파, 청고추, 대파는 적당히 먹기 좋게 썰어놓는다."},{"d":"밀가루에 계란, 식용유, 소금, 물을 넣고 수제비 반죽을 한다."},{"d":"①번 장국에 김치를 넣고 끓인 후 채소를 넣고 다시 끓어오르면 수제비를 떠서 넣는다."},{"d":"⑤번이 어느 정도 끓기 시작하면 간장으로 간을 맞춘다."}],"깻잎말이김치":[{"d":"깻잎은 잘 씻어 소금물(물 4컵, 소금 1.5큰술)에 절여 체에 밭쳐둔다."},{"d":"대파, 양파, 생강, 멸치, 액젓, 설탕, 물을 넣고 끓여 국물만 걸러 식혀서 사용한다."},{"d":"고추는 반으로 갈라 씨를 털어낸 후 3cm 길이로 잘라서 사용하고 모든 재료는 곱게 채를 썬다."},{"d":"잘 절여진 깻잎 여러장을 겹쳐 소를 넣고 돌돌 말은 후 통에 가진런히 담아 국물을 부은 후 냉장보관하여 먹는다."}],"오징어찌개":[{"d":"오징어는 내장을 제거하고 껍질을 벗긴 뒤 0.5㎝ 두께의 링 모양으로 썬다."},{"d":"쇠고기는 0.2㎝ 두께로 채썬 뒤 간장, 후춧가루로 밑간을 한다."},{"d":"풋고추, 홍고추, 대파는 어슷썬다."},{"d":"냄비에 물을 붓고 ②의 쇠고기를 넣어 끓으면 양념 재료를 넣어 간을 맞춘다."},{"d":"④에 오징어, 풋고추, 홍고추, 대파를 넣어 끓인다."}],"쇠고기완자찜":[{"d":"두부는 물기를 짠 후 곱게 으깨어 다진쇠고기와 섞는다."},{"d":"①에 소금, 후춧가루, 깨소금, 참기름을 넣어 양념한다."},{"d":"②를 치대어 직경 3㎝ 크기의 완자를 빚는다."},{"d":"밤은 껍질을 까서 물에 담가놓고 무, 당근은 밤 크기로 썰어 끓는 물에 데친다."},{"d":"분량의 재료를 섞어 양념장을 만든다."},{"d":"냄비에 양념장을 넣어 끓어오르면 완자를 넣는다."}],"열무김치냉면":[{"d":"열무는 다듬어 소금에 절여둔다."},{"d":"냄비에 물 1컵과 찹쌀가루 2큰술을 넣고 나무주걱으로 저어가며 약불에서 찹쌀풀을 쑨다."},{"d":"볼에 물 4컵과 고춧가루 4큰술을 풀고 찹쌀풀을 넣어 간을 맞춘다."},{"d":"③에 절인 열무와 어슷썬 고추, 채썬 파, 마늘, 생강을 넣고 버무려 열무김치를 담아 익힌다."},{"d":"알맞게 익은 열무김치에 식초, 설탕, 소금으로 간을 맞추어 차게 둔다."},{"d":"냉면을 삶아 그릇에 담고 열무김치를 부은 다음 겨자 갠 것을 곁들인다."}],"두부알찜":[{"d":"두부는 멍울이 지지 않도록 체에 내려 소금 약간과 조미술을 뿌린다."},{"d":"유리볼에 계란과 다시물을 섞고 소금, 조미술, 간장으로 간을 한 후 고운 체에 걸러 알끈 등을 제거한다."},{"d":"생표고버섯은 기둥을 채썰고 모시조개는 소금물에 담가 해감 시킨 후 살짝 데치고 새우는 내장을 제거한 후 삶아 껍질을 벗긴다. 은행도 끓는물에 데쳐 껍질을 벗긴다."},{"d":"②에 체에 내린 두부를 넣어 서로 잘 섞이도록 저어준다."},{"d":"찜그릇에 속재료를 넣고 계란물을 부어 은박지로 뚜껑을 만들어 덮고 김 오른 찜통에 13분 정도 쪄 부드럽게 먹는다."}],"닭꼬치구이":[{"d":"닭은 중간크기의 것으로 골라서 깨끗이 씻은 후 뼈는 남기고 살을 발라 준비한다."},{"d":"닭고기살에 잔칼집을 넣어 고기가 덜 오그라지게 한 다음 소금, 후추를 약간 뿌린다."},{"d":"프라이팬에 식용유를 두르고 뜨거워지면 닭살을 넣고 앞뒤로 눌러서 살짝 지져낸다."},{"d":"냄비에 간장, 설탕, 청주, 생강즙, 다시물을 넣어 끓여 약간 걸쭉하게 한다."},{"d":"④의 냄비에 지져서 기름을 뺀 닭을 집어넣고 은근히 윤기나게 익힌다."},{"d":"닭이 어느정도 익어가면 대파도 4㎝ 길이로 썰어 살짝 익힌다."}],"해물밥전":[{"d":"새우는 막새우를 준비하여 잘 씻어 물기를 빼고 잘게 썬다. 오징어는 배를 갈라 내장을 손질하고 껍질을 벗겨내어 잘게 썬다.","t":"**해물과 야채는 일단 한 번 볶은 다음 섞는다.  해물과 야채를 손질하여 기름 두른 팬에 한번 볶아낸 다음 밀가루와 달걀을 넣으면 재료들이 잘 섞여 전을 부치기가 좋다. 반죽의 농도는 숟가락으로 들어올렸을 때 재료들이 천천히 흘러내릴 정도가 알맞다."},{"d":"양파와 당근은 손질하여 오징어와 비슷한 크기로 입자 있게 잘게 썰고, 실파는 송송 썬다."},{"d":"팬에 기름을 두르고 새우, 오징어, 양파, 당근, 실파를 넣고 소금, 후춧가루로 간하여 중불에서 약간 익을 정도로 볶는다."},{"d":"고슬고슬하게 지어진 밥을 준비하여 볶은 재료를 넣고 소금, 깨소금, 참기름으로 간을 맞춘 다음 밀가루를 잘 섞고 계란을 깨뜨려 넣어 끈기가 나게 섞는다."},{"d":"팬에 기름을 넉넉히 두르고 뜨겁게 달구어지면 해물밥을 한 스푼씩 떠넣어 둥글납작하게 완자 모양을 만들어 앞 뒤로 노릇하게 지진다."},{"d":"간장에 식초, 다진 파, 마늘, 통깨, 송송 썬 실파를 넣어 초간장을 만들어 곁들인다."}],"명란젓찌개":[{"d":"마늘은 얇게 편으로 썰고, 무는 1.5cm x 1.5cm 크기로 나박썰기 하고, 두부도 같은 크기로 썰어 둔다.","t":"**명란은 익으면 표피가 줄어들고 단단해지므로 반드시 칼집을 넣어 사용한다. 명란을 끓일 때 강한 불에서 끓이면 알이 터지고 딱딱해지므로 중간불에서 끓인다. 명란 자체에서 맛있는 국물이 베어나오도록 불을 끄고 10~20분쯤 둔 다음 소금으로 간을 맏춘다(시중에서 판매"},{"d":"명란은 길이로 칼집을 낸 뒤 3~4등분한다."},{"d":"홍고추와 대파는 어슷 썰어 놓는다."},{"d":"뚝배기에 무, 마늘, 물을 넣고 끓이다가 무가 익으면 불을 줄이고 두부를 먼저 넣은 뒤 명란을 넣는다."},{"d":"중간불에서 가열하다 명란의 속이 하얗게 익으면 불을 끄고 뚜껑을 덮은 채 그대로 둔다."},{"d":"먹기 직전에 고추와 간장, 파, 소금을 넣고 한소끔 더 끓여낸다."}],"알탕":[{"d":"명란은 붉은 빛을 띠는 싱싱한 것으로 준비해 찬물에 살살 씻어 헹군 다음 체에 밭쳐 물기를 뺀다."},{"d":"쇠고기는 기름기 없는 연한 살코기만 골라 가늘게 채썬 후 간장, 다진 파, 다진 마늘, 참기름, 깨소금을 넣고 무친다."},{"d":"무는 2cm x 2cm 크기로 납작썰고 콩나물은 뿌리를 다듬어 씻고, 대파, 홍고추는 어슷썰며 쑥갓과 대파는 씻어 5cm 길이로 썬다."},{"d":"분량의 간장에 고춧가루, 다진 마늘, 생강즙, 청주, 소금, 후춧가루를 넣고 골고루 섞어 양념장을 만든다."},{"d":"뚝배기를 뜨겁게 달구어 밑간한 쇠고기와 납작썬 무를 넣고 볶다가 어느 정도 익으면 물 4컵을 붓고 양념장을 고루 풀어 넣는다."},{"d":"국물에 명란과 콩나물을 넣고 끓이다가 미나리, 쑥갓, 고추, 대파를 넣고 조금 더 끓여 향을 돋군다."}],"별미밥":[{"d":"다진 쇠고기는 간장 1큰술, 설탕 1/2작은술, 마늘 1작은술, 후춧가루, 참기름에 양념하여 프라이팬에 기름을 두르고 볶아 놓는다."},{"d":"콩나물은 꼬리를 떼고 깨끗이 다듬어 끓는 소금물에 데친다."},{"d":"당근은 껍질을 벗겨 곱게 채썰고 미나리도 같은 길이로 잘라 뜨거운 프라이팬에 기름을 두르고 소금 간을 하며 볶는다."},{"d":"유부는 끓는 물에 데쳐 기름을 빼고 채썰어 소금, 참기름에 무쳐 놓는다."},{"d":"고슬하게 지은 밥을 그릇에 적당히 담아, 볶아 놓은 모든 재료를 색 맞추어 올리고 분량의 양념 재료를 넣어 양념장을 곁들여 낸다."}],"버섯두부찌개":[{"d":"두부는 모양이 으깨지지 않도록 씻어 도톰하고 납작하게 썰어 준비하고 잘 익은 김치는 속을 털어내고 송송 썰어 준비한다."},{"d":"느타리버섯은 적당한 굵기로 잘라놓고 생표고 팽이버섯도 먹기 좋게 준비한다."},{"d":"돼지고기는 잘게 썰고 양파는 채썰어 준비한다."},{"d":"청고추, 대파는 어슷하게 썰어놓고 마늘, 생강은 다진다."},{"d":"냄비에 참기름을 두르고 돼지고기, 김치, 양파를 달달 볶다가 물을 넣어 한소끔 끓인다."},{"d":"고춧가루 1큰술, 국간장 1큰술, 다진 양파, 다진 마늘, 깨소금, 어슷썬 청고추를 섞어 양념장을 만든다."}],"맑은대구탕":[{"d":"토막 낸 생대구를 깨끗한 물에 한번 씻은 후 체에 밭쳐 물기를 뺀다.","t":"* 대구를 넣어 끓어오르기 시작하면 국물에서 불순물이 나오므로 가끔씩 제거해준다.  * 오래 끓이면 ？은맛이 나오기 때문에 다시마를 넣고 오래 끓이지 않도록 한다."},{"d":"마늘은 다지고 대파, 홍고추, 청고추는 어슷하게 썰고 두부는 적당한 크기로 썰어 준비한다."},{"d":"냄비에 물 3컵을 담아 다시마를 넣고 살짝 한번 끓인 후 가쓰오브시를 넣어 10분 후에 걸른 후 국물을 우려낸다."},{"d":"③의 국물이 끓어오르기 시작하면 ①의 손질한 대구를 넣어 한소끔 끓인 후 소금으로 간을 맞춘다."},{"d":"대구의 시원한 맛이 어느정도 우러나오면 두부, 마늘, 홍고추, 청고추, 팽이버섯, 미나리 등을 넣어 마무리 한다."}]},"photos":{"양파전":{"t":"Spring Onion Pancake - SOJU 2024-06-02.jpg","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Spring_Onion_Pancake_-_SOJU_2024-06-02.jpg"},"북어국":{"t":"Bugeo-guk 2.jpg","l":"CC BY-SA 2.0 kr","u":"https://commons.wikimedia.org/wiki/File:Bugeo-guk_2.jpg"},"두부두루치기":{"t":"Gimchi-duruchigi-ssam.jpg","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Gimchi-duruchigi-ssam.jpg"},"된장찌개":{"t":"Doenjang-jjigae 2.jpg","l":"CC BY 4.0","u":"https://commons.wikimedia.org/wiki/File:Doenjang-jjigae_2.jpg"},"된장채소수제비":{"t":"Korean.cuisine-Sujebi-01.jpg","l":"CC BY 2.0","u":"https://commons.wikimedia.org/wiki/File:Korean.cuisine-Sujebi-01.jpg"},"호박무침":{"t":"Saeu-aehobak-bokkeum.jpg","l":"CC BY 4.0","u":"https://commons.wikimedia.org/wiki/File:Saeu-aehobak-bokkeum.jpg"},"가지쇠고기볶음":{"t":"Gaji-bokkeum.jpg","l":"CC BY 2.0","u":"https://commons.wikimedia.org/wiki/File:Gaji-bokkeum.jpg"},"청국장찌개":{"t":"Cheonggukjang-jjigae.jpg","l":"CC BY 4.0","u":"https://commons.wikimedia.org/wik <style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  :root{
    --d-bg:oklch(.215 .006 60); --d-card:oklch(.268 .006 60); --d-card2:oklch(.312 .006 60);
    --d-line:oklch(.352 .006 60); --d-tx2:oklch(.782 .008 70); --d-tx3:oklch(.622 .008 70);
    --cream:oklch(.965 .008 85);
    --l-bg:oklch(.968 .004 80); --l-card:#fff; --l-line:oklch(.925 .005 80);
    --l-thumb:oklch(.953 .005 80); --ink:oklch(.215 .008 60);
    --l-tx2:oklch(.485 .01 60); --l-tx3:oklch(.67 .01 60);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* 아이폰 기준: 100vh는 주소창 때문에 튀므로 dvh를 쓰고, 노치·홈바는 safe-area로 피한다. */
  :root{ --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px) }
  html,body{overscroll-behavior-y:none}
  /* 바탕은 현재 화면 색을 따라간다. 밝은 회색으로 두면 좌우 끝과
     스크롤 바운스에서 흰 띠가 비친다. */
  html{background:var(--d-bg)}
  body{margin:0;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
       -webkit-font-smoothing:antialiased;background:var(--d-bg);
       text-size-adjust:100%;-webkit-text-size-adjust:100%}
  body.light{background:var(--l-bg)}
  html:has(body.light){background:var(--l-bg)}
  a{color:inherit;text-decoration:none}
  .app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
  .view{display:none;min-height:100dvh;flex-direction:column}
  .view.on{display:flex}
  .mk{font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:-.045em;line-height:1}
  .deg{font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-weight:800;letter-spacing:0;line-height:1}
  button{font:inherit;border:0;background:none;padding:0;cursor:pointer;color:inherit;text-align:left}
  .grow{flex:1}

  /* ── 고르기 (다크) ───────────────────────────── */
  #pick{background:var(--d-bg);color:var(--cream)}
  .top{display:flex;align-items:center;gap:10px;padding:calc(14px + var(--sa-t)) 26px 6px}
  .tabs{display:flex;gap:22px;padding:0 26px;border-bottom:1px solid var(--d-line);margin-bottom:12px}
  /* 탭은 눌리는 것이므로 44px 세로 영역을 확보한다 */
  .tab{font-size:14.5px;font-weight:500;letter-spacing:-.03em;color:var(--d-tx3);
       height:42px;display:flex;align-items:center;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{font-weight:900;color:var(--cream);border-bottom-color:var(--cream)}
  /* 아치는 위쪽 반지름이 가로폭의 절반이다. 그래서 높이가 폭의 0.66은 돼야
     반원 아래에 사각 부분이 남아 아치로 읽힌다. 5:4로 두면 반원이 다 먹는다. */
  .arch{margin:0 26px 12px;aspect-ratio:3/2;border-radius:999px 999px 18px 18px;
        overflow:hidden;background:var(--d-card)}
  .arch img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 62%}
  .badge{font-size:9.5px;letter-spacing:.16em;color:var(--d-tx3);padding:0 26px;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 제목은 한 줄로 앉힌다. 좁으면 글자만 조금 줄어들고 줄바꿈은 하지 않는다. */

  .lbl{font-size:10px;letter-spacing:.16em;color:var(--d-tx3);white-space:nowrap}
  .chip{display:flex;align-items:center;gap:8px;height:36px;padding:0 5px 0 12px;border-radius:11px;

  .dials{display:flex;gap:8px;padding:0 26px}
  /* 좁은 화면에서 한 줄로 두면 "아무렇게나 고르면"이 잘린다. 라벨을 위로 올린다. */
  .dial{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
        min-height:50px;flex:1;min-width:0;padding:7px 6px;

  /* 조합 고르기는 부속이다. 1순위(크림 CTA)는 화면당 하나라 여기는 카드색으로 가라앉힌다. */

           font-size:12.5px;font-weight:700}

  .ovl .sum{display:flex;align-items:baseline;gap:7px;padding-top:12px;border-top:1px solid oklch(.35 .008 60);
            font-size:12px;color:var(--d-tx2);flex-wrap:wrap}

  .bar{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 26px calc(14px + var(--sa-b));

  .b2{display:flex;align-items:center;justify-content:center;gap:7px;height:54px;padding:0 15px;border-radius:14px;
      border:1.5px solid oklch(.87 .006 80);color:var(--l-tx2);font-size:13.5px;font-weight:700;
      white-space:nowrap;flex-shrink:0}

  /* ── 시트 · 토스트 ─────────────────────────── */

  .rc .mt .cr{text-decoration:underline;text-underline-offset:2px}
  /* 조리법은 펼침으로 둔다. 여덟 가지를 한꺼번에 펼치면 48문단이 쏟아진다.
     <details>는 브라우저가 이미 하는 일이라 상태를 따로 들고 있을 필요가 없다. */
  .dt summary{list-style:none;cursor:pointer}
  .dt summary::-webkit-details-marker{display:none}
  .dt summary .ar{margin-left:auto;color:var(--l-tx3);flex-shrink:0;transition:transform .18s;padding-top:2px}
  .dt[open] summary .ar{transform:rotate(90deg)}
  .dt[open] summary{border-bottom-color:transparent}
  .steps{margin:0;padding:2px 4px 16px 35px;border-bottom:1px solid var(--l-line);

  .steps li::marker{font-weight:900;font-size:11px;color:var(--l-tx3)}
  .steps .tip{display:block;margin-top:5px;padding:8px 11px;border-radius:9px;background:var(--l-thumb);
              font-size:11.5px;line-height:1.6;color:var(--l-tx3)}
  @media (prefers-reduced-motion:reduce){.dt summary .ar{transition:none}}

  /* 조합 고르기. 지금 보고 있는 것만 밝기를 뒤집는다 — 위계는 색이 아니라 반전으로. */
  button.rc{width:100%;text-align:left;min-height:44px}

  .close{display:flex;align-items:center;justify-content:center;height:52px;border-radius:14px;
         background:var(--ink);color:var(--cream);font-size:15px;font-weight:900;margin-top:16px;width:100%}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);background:var(--ink);color:var(--cream);

         transition:.22s;pointer-events:none;z-index:20;white-space:nowrap}

const dishFace = n => PHOTO[n]
  ? `<span class="cir ph"><img src="${PHOTO[n]}" alt=""></span>`
  : `<span class="cir">${BOWL}</span>`;
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 파이썬 build.py의 fmt()와 같은 규칙. 장볼 양이라 모자라지 않게 올림한다.
function fmt(v, u){
  if(v == null || !u) return '조금';
  if(u === 'ml') return v >= 200 ? (Math.ceil(v/100)/2) + '컵' : Math.max(1, Math.round(v/15)) + '큰술';
  if(u === 'g')  return v >= 1000 ? (Math.ceil(v/100)/10) + 'kg' : (Math.ceil(v/10)*10) + 'g';
  return Math.ceil(v - 1e-9) + u;
}
const qtyOf = it => it.value == null ? '조금' : fmt(it.value / set().people * people, it.unit);
const usedOf = n => (set().overlaps.find(o => o.name === n) || {}).used || 0;

/** 출처는 레시피마다 다를 수 있다. 세트 전체가 한 곳인 것처럼 뭉뚱그리지 않는다. */
function sourceCounts(){
  const m = new Map();
  set().dishes.forEach(d => m.set(d.source, (m.get(d.source) || 0) + 1));
  return [...m.entries()];
}

function renderPick(){
  const s = set();
  $('tabs').innerHTML = AXES.map(a =>
    `<button class="tab${a.type===s.type?' on':''}" data-i="${a.i}">${esc(a.label)}</button>`).join('');
  $('again').style.display = s.vn > 1 ? '' : 'none';
  $('againN').textContent = s.vi + '/' + s.vn;
  $('badge').textContent = s.badge;
  $('title').textContent = s.title;
  $('dishes').innerHTML = s.dishes.slice(0, 5).map(d =>
    `<span class="dish">${dishFace(d.name)}<span>${esc(d.name)}</span></span>`).join('') +
    (s.dishes.length > 5 ? `<span class="dish"><span class="cir" style="background:var(--d-card2);font-size:13px;font-weight:900;color:var(--d-tx2)">+${s.dishes.length-5}</span><span>더 있어요</span></span>` : '');
  $('dishmore').innerHTML = `요리 ${s.dishes.length}가지 · 조리법과 출처 보기
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>`;
  $('apart').textContent = '재료 ' + s.apart + '가지';
  $('buy').textContent = s.buyCount;
  $('pp').textContent = people;
  $('dials').innerHTML =
    `<div class="dial">겹치는 재료 <b>${s.overlaps.length}가지</b></div>` +
    `<div class="dial">아무렇게나 고르면 <b>${s.randomAvg}가지</b></div>`;
}

function renderList(){
  const s = set();
  $('lsub').textContent = `성인 ${people} · 요리 ${s.dishes.length}가지 · 살 것 ${s.buyCount}가지`;
  $('ovl').innerHTML = `
    <div class="k">이 재료들이 겹쳐요</div>
    <div class="tags">${s.overlaps.map(o =>
      `<span class="tg">${esc(o.name)}<i>${o.used}끼</i></span>`).join('')}</div>
    <div class="sum"><span>따로 사면 <s>${s.apart}가지</s></span><span>·</span><span>한 번에 사면</span><b>${s.buyCount}가지</b></div>`;
  $('cats').innerHTML = s.groups.map(g => `
    <section class="cat">
      <h2><span class="ic"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" style="color:var(--ink)">${ICONS[g.cat]||''}</svg></span>
        <span class="n">${esc(g.cat)}</span><span class="c">${g.items.length}가지</span></h2>
      ${g.items.map(it => { const u = usedOf(it.name); return `
        <button class="row${done[it.name]?' done':''}" data-n="${esc(it.name)}">
          <span class="nm">${esc(it.name)}</span>
          ${u >= 2 ? `<span class="ov">${u}끼</span>` : ''}
          <span class="qt">${qtyOf(it)}</span>
          <span class="ck"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 5"/></svg></span>
        </button>`; }).join('')}
    </section>`).join('');
}

/** 화면이 바뀌면 바탕색과 상태바 색도 같이 바꾼다. 안 그러면 좌우 끝과
 *  스크롤 바운스에서 반대 색이 비친다. */
function show(id){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id));
  const light = id === 'list';
  document.body.classList.toggle('light', light);
  const m = document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content', light ? '#f5f4f1' : '#2b2926');
}
let tt;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1900); }

const sheet = $('sheet'), box = $('sheetbox');
sheet.onclick = e => { if(e.target === sheet) sheet.classList.remove('on'); };
function openSheet(html){
  box.innerHTML = html + '<button class="close">닫기</button>';
  box.querySelector('.close').onclick = () => sheet.classList.remove('on');
  sheet.classList.add('on'); box.scrollTop = 0;
}

$('tabs').onclick = e => { const b = e.target.closest('.tab'); if(!b) return;
  si = +b.dataset.i; people = set().people; done = {}; renderPick(); };
/** 조합 고르기 — 하나씩 넘기면 3번이 좋았는데 7번까지 가버렸을 때 되돌아갈 수가 없다.
 *  전부 펼쳐 두고 한 번에 고른다. 먹을 사람은 그대로 두고(축이 같으면 인원도 같은 맥락)
 *  체크만 비운다 — 조합이 바뀌면 재료가 달라진다. */
function pickCombo(next){
  si = next; axis().i = si; done = {}; renderPick();
  sheet.classList.remove('on'); scrollTo(0, 0);
}
$('again').onclick = () => {
  const ix = siblings();
  openSheet(`<h3>조합 ${ix.length}가지</h3>
    <p class="sub">재료가 가장 많이 겹치는 순서예요. 무엇을 고르든 아무렇게나 고를 때보다 적게 삽니다.</p>` +
    ix.map(i => { const s = D.sets[i]; return `
      <button class="rc${i===si?' now':''}" data-i="${i}">
        <div class="no">${s.vi}</div>
        <div><div class="nm">살 것 ${s.buyCount}가지</div>
          <div class="mt">${s.dishes.map(d => esc(d.name)).join(' · ')}</div></div>
      </button>`; }).join(''));
  box.querySelectorAll('.rc').forEach(b => b.onclick = () => pickCombo(+b.dataset.i));
  const now = box.querySelector('.rc.now');
  if(now) now.scrollIntoView({block: 'nearest'});
};
$('minus').onclick = () => { people = Math.max(1, people - 1); renderPick(); };
$('plus').onclick  = () => { people = Math.min(12, people + 1); renderPick(); };
$('go').onclick    = () => { renderList(); show('list'); scrollTo(0, 0); };
$('back').onclick  = () => { show('pick'); scrollTo(0, 0); };
$('cats').onclick  = e => { const r = e.target.closest('.row'); if(!r) return;
  const n = r.dataset.n; done[n] = !done[n]; r.classList.toggle('done', done[n]); };

/** 요리별 조리법과 출처. 레시피가 다른 곳에서 오면 여기서 각각 드러난다.
 *  조리법이 없는 요리는 펼침 없이 줄만 남는다 — 없는 걸 있는 척하지 않는다. */
const ARROW = '<svg class="ar" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>';
function dishSheet(){
  openSheet(
  `<h3>요리 ${set().dishes.length}가지</h3>
   <p class="sub">눌러서 만드는 법을 봅니다. 출처는 레시피마다 답니다 — 다른 곳 레시피를 더해도 이 목록에 그대로 드러나요.</p>` +
  set().dishes.map((d, i) => {
    // 사진은 대부분 CC BY / CC BY-SA라 표기가 의무다. 쓰는 자리에 바로 붙인다.
    const pc = (D.photos || {})[d.name];
    const head = `<div class="no">${i+1}</div>
      <div><div class="nm">${esc(d.name)}</div>
        <div class="mt">${esc(d.kind)} · ${esc(d.time)} · ${esc(d.level)} · ${esc(d.servings)}인분 기준<br>
        레시피 ${esc(d.source)}${pc ? `<br>사진 <a class="cr" href="${esc(pc.u)}" target="_blank" rel="noopener">${esc(pc.t)}</a> · ${esc(pc.l)} · 위키미디어 공용` : ''}</div></div>`;
    const st = (D.recipes || {})[d.name];
    if(!st) return `<div class="rc">${head}</div>`;
    return `<details class="dt"><summary class="rc">${head}${ARROW}</summary>
      <ol class="steps">${st.map(s =>
        `<li>${esc(s.d)}${s.t ? `<span class="tip">${esc(s.t)}</span>` : ''}</li>`).join('')}</ol></details>`;
  }).join(''));
  // 출처 링크가 summary 안에 있어 그냥 두면 누를 때 펼침까지 같이 토글된다.
  box.querySelectorAll('.cr').forEach(a => a.onclick = e => e.stopPropagation());
}
$('dishes').onclick = dishSheet;
$('dishmore').onclick = dishSheet;

/** 공유 — 체크한 건 이미 산 것이니 빼고, 남은 것만 보낸다.
 *  기기 공유 시트 → 클립보드 → 텍스트 상자 순으로 물러난다. */
function shareText(){
  const s = set();
  const left = s.groups.map(g => ({ cat: g.cat, items: g.items.filter(it => !done[it.name]) }))
                       .filter(g => g.items.length);
  const n = left.reduce((a, g) => a + g.items.length, 0);
  const body = left.map(g => `[${g.cat}]\n` +
      g.items.map(it => `· ${it.name} ${qtyOf(it)}`).join('\n')).join('\n\n');
  return {
    n,
    text: `${s.title.replace(/\n/g, ' ')} — 성인 ${people}\n살 것 ${n}가지\n\n${body}\n\n` +
          `요리 · ${s.dishes.map(d => d.name).join(' · ')}\n` +
          `레시피 출처 · ${sourceCounts().map(([x, c]) => x + ' ' + c).join(' · ')}\n보글 · BOGL°`
  };
}
$('share').onclick = async () => {
  const { n, text } = shareText();
  if(!n) return toast('전부 담으셨어요');
  if(navigator.share){
    try { await navigator.share({ title: '장볼 것 ' + n + '가지', text }); return; } catch(e){ if(e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(text); toast('장볼 것 ' + n + '가지 복사했어요'); return; } catch(e){}
  openSheet(`<h3>장볼 것 ${n}가지</h3><p class="sub">전체 선택해서 가져가세요. 체크한 건 빠져 있어요.</p>
             <textarea readonly>${esc(text)}</textarea>`);
  box.querySelector('textarea').select();
};

$('find').onclick = () => {
  const items = set().groups.flatMap(g => g.items).filter(it => !done[it.name]);
  if(!items.length) return toast('전부 담으셨어요');
  openSheet(`<h3>쿠팡에서 찾기</h3>
    <p class="sub">재료마다 검색으로 열려요. 상품을 저장해 두지 않아서 품절이나 단종으로 링크가 끊기지 않습니다.</p>` +
    items.map(it => `<a class="lk" target="_blank" rel="noopener"
        href="https://www.coupang.com/np/search?q=${encodeURIComponent(it.name)}">
        <span>${esc(it.name)}</span><span class="q">${qtyOf(it)}</span>
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></a>`).join(''));
};

renderPick();
</script>
